name: Fix IIM Amritsar On This Page Navigation

on:
  push:
    branches: [main]
    paths:
      - 'iim-amritsar-on-page.js'
      - '.github/workflows/iim-amritsar-on-page-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add navigation behavior to IIM Amritsar pages
        shell: python
        run: |
          from pathlib import Path

          script_tag = '<script src="iim-amritsar-on-page.js"></script>'
          files = sorted(Path('.').glob('iim-amritsar*.html'))
          changed = []

          for path in files:
              html = path.read_text(encoding='utf-8')
              if script_tag in html:
                  continue
              marker = '</body>'
              if marker not in html:
                  print(f'Skipping {path}: no </body> marker')
                  continue
              html = html.replace(marker, f'{script_tag}{marker}', 1)
              path.write_text(html, encoding='utf-8')
              changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'iim-amritsar*.html'
          git diff --cached --quiet || git commit -m "Fix IIM Amritsar on-page menu navigation"
          git push

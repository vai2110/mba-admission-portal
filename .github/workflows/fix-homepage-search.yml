name: Fix Homepage Search

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-search:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch homepage search
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = '<script id="homepage-search-exact-fix">'

          js = r'''<script id="homepage-search-exact-fix">
          (function(){
            const input=document.getElementById('collegeSearch');
            const result=document.getElementById('collegeSearchResult');
            if(!input||!result)return;
            const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
            const CITY={bangalore:['bengaluru','blr'],bengaluru:['bangalore','blr'],mysore:['mysuru'],mysuru:['mysore'],hyderabad:['hyd'],hyd:['hyderabad'],ghaziabad:['gzb','gaziabad'],gzb:['ghaziabad'],'navi mumbai':['nerul'],nerul:['navi mumbai'],'new delhi':['delhi'],delhi:['new delhi'],calcutta:['kolkata'],kolkata:['calcutta'],gurugram:['gurgaon'],gurgaon:['gurugram'],mumbai:['bombay'],bombay:['mumbai']};
            const FAMILY=['sibm','siib','siom','sitm','sicsr','sims','scit','ssmc','xime','vjim','sdmimd','siescoms','pumba','ibs','iim','iift','xlri','spjimr','imt','nmims','tapmi','gim','jims','bimtech','soa','kiit','upes'];
            const tokens=s=>norm(s).split(' ').filter(Boolean);
            const cityOf=q=>{const t=tokens(q);for(const [c,vs] of Object.entries(CITY)){if(t.includes(c)||vs.some(v=>t.includes(v)))return c}return ''};
            const cityOK=(q,c)=>{const qc=cityOf(q);if(!qc)return true;const loc=norm(c.location);return loc.includes(qc)||(CITY[qc]||[]).some(v=>loc.includes(v))};
            const aliases=c=>{
              const n=norm(c.name), loc=norm(c.location).split(' ')[0];
              const a=[n].concat((c.aliases||[]).map(norm));
              if(n.startsWith('indian institute of management')){
                const parts=n.split(' '), last=parts[parts.length-1];
                if(last!=='management')a.push('iim '+last);
                if(loc&&loc!=='india')a.push('iim '+loc);
                if(last==='calcutta'||loc==='kolkata')a.push('iim calcutta','iim kolkata');
              }
              if(n.startsWith('symbiosis institute of business management')){
                if(loc)a.push('sibm '+loc);
                a.push('sibm pune','sibm nagpur');
              }
              if(n==='institute of management technology'&&loc)a.push('imt '+loc);
              if(n==='great lakes institute of management'&&loc)a.push('great lakes '+loc);
              return [...new Set(a)];
            };
            const familyOf=q=>{const n=norm(q);return FAMILY.find(f=>n===f||n.startsWith(f+' '))||''};
            const score=(q,c)=>{
              if(!cityOK(q,c))return -1;
              const n=norm(q),qt=tokens(n),al=aliases(c),fam=familyOf(n);
              if(fam&&!al.some(a=>a===n||a.startsWith(fam+' ')))return -1;
              let best=0;
              for(const a of al){
                if(a===n)best=Math.max(best,10000);
                else if(a.replace(/ /g,'')===n.replace(/ /g,''))best=Math.max(best,9500);
                else if(a.startsWith(n+' ')||n.startsWith(a+' '))best=Math.max(best,7000);
              }
              const hay=norm([c.name,c.location,...(c.aliases||[])].join(' '));
              const covered=qt.filter(t=>hay.split(' ').includes(t)).length;
              if(covered===qt.length)best=Math.max(best,4000+covered*100);
              return best;
            };
            const escape=s=>String(s||'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
            let indexPromise;
            const getIndex=()=>indexPromise||(indexPromise=fetch('./homepage-search-index.json?exactfix=20260914',{cache:'no-store'}).then(r=>r.json()));
            const show=(q,data)=>{
              const ranked=(data.colleges||[]).map(c=>({c,s:score(q,c)})).filter(x=>x.s>0&&x.c.live&&x.c.url).sort((a,b)=>b.s-a.s);
              if(!ranked.length){result.innerHTML='<div class="search-result-inner"><h3>No direct match found</h3><div class="search-location">No college matches that name and city. Try the official college name, abbreviation and city.</div></div>';result.style.display='block';return}
              const exact=ranked[0].s>=9500;
              const items=exact?ranked.slice(0,1):ranked.slice(0,7);
              result.innerHTML='<div class="search-result-inner"><h3>'+(exact?'College found':'Matching colleges')+'</h3>'+items.map(x=>'<div class="homepage-college-result"><div class="homepage-college-name">'+escape(x.c.name)+'</div><div class="homepage-college-location">'+escape(x.c.location||'')+'</div><a class="homepage-college-cta" href="'+escape(x.c.url)+'">View College Page <span aria-hidden="true">→</span></a></div>').join('')+'</div>';
              result.style.display='block';
            };
            function run(){
              const q=norm(input.value);
              if(!q){result.style.display='none';result.innerHTML='';return}
              getIndex().then(data=>show(q,data)).catch(()=>{result.innerHTML='<div class="search-result-inner"><h3>Search is temporarily unavailable</h3></div>';result.style.display='block'});
            }
            if(!document.getElementById('homepage-search-cta-style')){
              const style=document.createElement('style');style.id='homepage-search-cta-style';style.textContent='.homepage-college-result{padding:14px 0;border-top:1px solid rgba(15,23,42,.08)}.homepage-college-result:first-of-type{border-top:0}.homepage-college-name{font-weight:700;font-size:16px;line-height:1.35}.homepage-college-location{margin-top:3px;font-size:13px;opacity:.72}.homepage-college-cta{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:9px 14px;border-radius:8px;text-decoration:none;font-weight:700;line-height:1;background:#0f62fe;color:#fff}.homepage-college-cta:hover{opacity:.92}';document.head.appendChild(style);
            }
            window.searchContent=run;
            input.addEventListener('input',run);
            input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopImmediatePropagation();run()}},true);
          })();
          </script>'''

          if marker in html:
              html = re.sub(r'<script id="homepage-search-exact-fix">.*?</script>', lambda m: js, html, count=1, flags=re.S)
          else:
              html = html.replace('</body>', js + '\n</body>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit search patch
        run: |
          if git diff --quiet; then
            echo "No search patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use CTA instead of automatic homepage search redirect"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1

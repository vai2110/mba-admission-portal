name: Fix IMT Nagpur Pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI and content fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          files=['imt-nagpur.html','imt-nagpur-pgdm.html','imt-nagpur-pgdm-marketing.html','imt-nagpur-pgdm-financial-management.html','imt-nagpur-placements.html']
          for fn in files:
              p=Path(fn); s=p.read_text()
              start=s.find('<section class="main-section" id="faq">')
              if start<0: continue
              end=s.rfind('</section>')
              title=re.search(r'<h2>(.*?)</h2>',s[start:end],re.S)
              faq_title=title.group(1) if title else 'FAQs'
              if fn=='imt-nagpur.html':
                  qs=[('Is IMT Nagpur an MBA college or a PGDM institute?','IMT Nagpur primarily offers two-year PGDM programmes. The institute states that its PGDM programmes are equivalent to an MBA for higher studies. Students should compare curriculum, accreditation, residential format, fees, selection process and placements rather than only the qualification label.'),('What is the IMT Nagpur fee for PGDM 2025-27?','The official 2025-27 FAQ states that the total fee, including hostel and mess, is ₹15 lakh and is subject to minor revisions. The fee sheet lists ₹50,000 admission fee, ₹14.27 lakh academic fee, ₹8,000 alumni membership and ₹15,000 refundable caution money.'),('What is the CAT/XAT cutoff for IMT Nagpur?','IMT Nagpur says there is no pre-decided cutoff. Its 2025-27 FAQ cites previous stopping points of 75 percentile for CAT/XAT, 90+ percentile for CMAT and 550 for GMAT. These are historical reference points, not a guaranteed 2026 cutoff.'),('Can freshers apply to IMT Nagpur?','Yes. Work experience is not compulsory. The institute says relevant work experience can receive additional weight in selection, so freshers should focus on entrance performance, academics, PI preparation and a clear career narrative.'),('Is hostel compulsory at IMT Nagpur?','Yes, for the residential programme. The 2025-27 FAQ says hostel stay is required; separate hostels are available for boys and girls, while single occupancy is limited and allocated on a first-come, first-served basis.'),('Which PGDM programme should I choose at IMT Nagpur?','The current admission material lists PGDM, PGDM-Marketing and PGDM-Financial Management. Choose Core PGDM for flexibility, Marketing for brand/sales/digital/growth careers, and Financial Management for finance, investment, banking, risk or related analytics. The placement process is common across programmes, so choose primarily on curriculum and career fit.')]
                  official='<div class="official-links"><a class="official-link" href="https://www.imtnagpur.ac.in/" rel="noopener" target="_blank">Official Website ↗</a><a class="official-link" href="https://www.imtnagpur.ac.in/admissions/" rel="noopener" target="_blank">Official Admissions ↗</a></div>'; note='<p class="source-note">*Fee and placement figures are tied to the official fee cycle/batches cited and can change.</p>'
              elif fn=='imt-nagpur-pgdm.html':
                  qs=[('Is IMT Nagpur PGDM equivalent to an MBA?','Yes. IMT Nagpur states that its PGDM programmes are equivalent to MBA for higher studies. The programme is a two-year, full-time, residential PGDM conducted through a trimester system.'),('What is the eligibility and selection process for IMT Nagpur PGDM?','Selection considers CAT, XAT, CMAT or GMAT scores along with past academic record, work experience and personal interview performance. Work experience is not compulsory, and the institute says there is no pre-decided cutoff.'),('What is the IMT Nagpur PGDM fee?','The official 2025-27 fee reference is ₹15 lakh including hostel and mess. The fee sheet lists ₹50,000 admission fee, ₹14.27 lakh academic fees, ₹8,000 alumni membership and ₹15,000 refundable caution money.'),('Can a fresher get admission to IMT Nagpur PGDM?','Yes. Work experience is not mandatory. Relevant experience can provide additional selection weight, so freshers should focus on entrance performance, academics, PI preparation and a coherent career narrative.'),('What can I specialize in after the common PGDM foundation?','IMT Nagpur allows students to pursue the PGDM without a specialization or specialize in one/two functional areas. Published academic material covers Finance, Marketing, HR & OB, Operations, Economics, General Management and Business Analytics & IT.'),('What are the placement outcomes for IMT Nagpur PGDM?','The official 2025-27 FAQ reports ₹36.33 LPA as the highest package for the 2022-24 batch, with a Top-10 average of ₹17.16 LPA and Top-20 average of ₹14.47 LPA. These are institute-level batch figures, not guaranteed individual salaries.')]
                  official='<div class="official-links"><a class="official-link" href="imt-nagpur.html">IMT Nagpur Overview →</a><a class="official-link" href="imt-nagpur-placements.html">Placement Guide →</a></div>'; note='<p class="source-note">*Fee and placement figures refer to the official cycles/batches cited.</p>'
              elif fn=='imt-nagpur-pgdm-marketing.html':
                  qs=[('What is IMT Nagpur PGDM Marketing?','PGDM-Marketing is one of IMT Nagpur’s three programme labels. It is a two-year, full-time residential management programme with marketing-focused subjects alongside the broader management foundation.'),('What entrance exams are accepted for PGDM Marketing?','The institute considers CAT, XAT, CMAT and GMAT as part of its consolidated selection process. Academic record, work experience and personal interview performance are also considered.'),('What is the PGDM Marketing fee at IMT Nagpur?','The official 2025-27 fee sheet lists ₹15 lakh for PGDM, PGDM-Marketing and PGDM-Financial Management. The FAQ says this includes hostel and mess charges and is subject to minor revisions.'),('Is work experience compulsory for PGDM Marketing?','No. Work experience is not compulsory. Relevant experience can, however, add weight during selection.'),('What subjects are covered in PGDM Marketing?','Published elective material includes Brand Management, Digital Marketing, Marketing Analytics, Advanced Marketing Research, CRM, Integrated Marketing Communication, Sales and Distribution, Services Marketing, International Marketing, Pricing and Retail Management.'),('What jobs can I target after PGDM Marketing?','Career directions include brand management, digital marketing, sales, business development, category management, market research, customer experience, product marketing and growth. The placement process is common across programmes, so students should use the latest role and recruiter mix rather than assume a separate marketing package.')]
                  official='<div class="official-links"><a class="official-link" href="imt-nagpur.html">IMT Nagpur Overview →</a><a class="official-link" href="imt-nagpur-pgdm.html">Compare with Core PGDM →</a></div>'; note='<p class="source-note">*Fee and intake references are based on official 2025-27 admissions material and may change.</p>'
              elif fn=='imt-nagpur-pgdm-financial-management.html':
                  qs=[('What is IMT Nagpur PGDM Financial Management?','It is a two-year, full-time residential programme focused on finance within IMT Nagpur’s wider management curriculum, for students interested in corporate finance, investment, banking, risk and related financial roles.'),('Which exams are accepted for PGDM Financial Management?','IMT Nagpur considers CAT, XAT, CMAT and GMAT, along with academics, work experience and personal interview performance. Work experience is not compulsory and there is no pre-decided cutoff.'),('What is the fee for PGDM Financial Management?','The official 2025-27 fee sheet lists ₹15 lakh for PGDM, PGDM-Marketing and PGDM-Financial Management. The FAQ states that the total includes hostel and mess charges and is subject to minor revisions.'),('Is PGDM Financial Management suitable for freshers?','Yes. Work experience is not mandatory. Candidates with relevant experience may receive additional selection weight, while freshers can strengthen their application through entrance performance, academics, PI preparation and clear finance-oriented goals.'),('What finance subjects are taught?','Published elective material includes Financial Statement Analysis & Reporting, Financial Modeling Using Excel, Investment Management, Equity Research, Fixed Income Securities, Derivatives, Financial Planning & Wealth Management, M&A, Commercial Bank Management and Credit Risk Analytics.'),('What careers can I pursue after PGDM Financial Management?','Potential tracks include financial analysis, corporate finance, investment banking, equity research, credit, risk, banking, wealth management, consulting and finance operations. Individual outcomes depend on skills, internships, interviews, market conditions and available roles.')]
                  official='<div class="official-links"><a class="official-link" href="imt-nagpur.html">IMT Nagpur Overview →</a><a class="official-link" href="imt-nagpur-placements.html">Placement Guide →</a></div>'; note='<p class="source-note">*Fee and intake references are based on official 2025-27 admissions material and may change.</p>'
              else:
                  qs=[('What is the highest package at IMT Nagpur?','The official 2025-27 FAQ reports ₹36.33 LPA as the highest pay package for the 2022-24 batch. This is a historical batch figure, not a guaranteed package for the 2026 placement cycle.'),('What are the Top-10 and Top-20 average packages?','For the 2022-24 batch, the official FAQ reports a Top-10 average of ₹17.16 LPA and a Top-20 average of ₹14.47 LPA. These figures describe the highest-performing groups and are not the average salary of the entire batch.'),('Does IMT Nagpur have one placement process for all PGDM programmes?','Yes. The institute says the placement process is standard for students of all programmes. Institute-wide placement figures should therefore not automatically be presented as separate package figures for Core PGDM, Marketing or Financial Management.'),('What sectors and roles can students target?','Published material and the alumni ecosystem indicate opportunities across BFSI, FMCG, manufacturing, consulting, automobile, IT/ITES and other sectors. Roles can include analytics, finance, sales, marketing, consulting, operations, project management and general management depending on the recruiting cycle and student profile.'),('Do summer internships lead to pre-placement offers?','They can. IMT Nagpur’s 2025-27 FAQ says students from the 2022-24 batch received 8 pre-placement offers from summer internships. An internship is an important part of the placement journey, but an offer is not guaranteed.'),('Should I judge placements only by the highest package?','No. Compare average/median figures where available, role quality, recruiter mix, internship outcomes, specialization relevance and placement coverage. Different official documents cover different batches, so always read the batch year with each salary number.')]
                  official='<div class="official-links"><a class="official-link" href="imt-nagpur.html">IMT Nagpur Overview →</a><a class="official-link" href="https://www.imtnagpur.ac.in/" target="_blank">Official Website ↗</a></div>'; note='<p class="source-note">*Placement figures are batch-specific and may change with subsequent official reports.</p>'
              faq='<section class="main-section" id="faq"><h2>'+faq_title+'</h2><div class="faq-accordion">'+''.join(f'<details><summary>{q}</summary><div class="faq-answer"><p>{a}</p></div></details>' for q,a in qs)+'</div>'+official+note+'</section>'
              s=s[:start]+faq+s[end+10:]
              if fn=='imt-nagpur.html':
                  old=re.search(r'<div class="table-wrapper"><table><tr><th>Programme</th><th>Duration</th><th>Format</th><th>Dedicated guide</th></tr>.*?</table></div>',s,re.S)
                  new='<div class="table-wrapper"><table><tr><th>Programme</th><th>Best suited for</th><th>Distinctive focus</th><th>Student guide</th></tr><tr><td>PGDM</td><td>Students who want flexibility across management functions.</td><td>Broad foundation with the option to specialize in one or two functional areas.</td><td><a class="course-link" href="imt-nagpur-pgdm.html">Read PGDM guide →</a></td></tr><tr><td>PGDM Marketing</td><td>Students targeting brand, digital, sales or growth careers.</td><td>Marketing electives across brand, digital, analytics, consumer and sales areas.</td><td><a class="course-link" href="imt-nagpur-pgdm-marketing.html">Read Marketing guide →</a></td></tr><tr><td>PGDM Financial Management</td><td>Students targeting finance, BFSI, investment or risk roles.</td><td>Finance electives covering analysis, modelling, investments, banking and risk.</td><td><a class="course-link" href="imt-nagpur-pgdm-financial-management.html">Read Finance guide →</a></td></tr></table></div>'
                  if old: s=s[:old.start()]+new+s[old.end():]
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imt-nagpur*.html imt-nagpur.css
          git diff --cached --quiet || git commit -m "Improve IMT Nagpur UI and FAQ experience"
          git push
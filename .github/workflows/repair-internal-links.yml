name: Repair Internal Links

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Add reciprocal college navigation
        run: python scripts/repair_internal_links.py

      - name: Commit repaired pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No internal-link changes required."
          else
            git commit -m "Phase 3: repair reciprocal college internal links"
            git push
          fi

name: Apply site-wide no-hash navigation

on:
  push:
    branches: [main]
    paths:
      - 'no-hash-navigation.js'
      - '.github/workflows/strip-hash-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add no-hash navigation to root live pages
        shell: python
        run: |
          from pathlib import Path

          script_tag = '<script src="no-hash-navigation.js" defer></script>'
          changed = []

          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if 'src="no-hash-navigation.js"' in text:
                  continue
              marker = '</head>'
              lower = text.lower()
              if marker not in lower:
                  continue
              idx = lower.rfind(marker)
              text = text[:idx] + script_tag + '\n' + text[idx:]
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print(f'Updated {len(changed)} root HTML pages.')
          if changed:
              print('\n'.join(changed))

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Apply no-hash navigation site-wide"
          git push
name: Final IIT Roorkee benchmark repair

on:
  push:
    paths:
      - '.github/workflows/final-iit-roorkee-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore clean IIT Roorkee baseline and apply final rules
        run: |
          set -e
          BASE=2e050a4d4636e1578b55d86df755447aba190e84
          git fetch --no-tags origin "$BASE"
          git checkout "$BASE" -- iit-roorkee.html iit-roorkee-mba.html iit-roorkee-executive-mba.html iit-roorkee-placements.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=['iit-roorkee.html','iit-roorkee-mba.html','iit-roorkee-executive-mba.html','iit-roorkee-placements.html']
          replacements={
            'IIT Roorkee Management Studies: What Students Can Study':'IIT Roorkee MBA & Executive MBA',
            'IIT Roorkee MBA & Executive MBA: Which Route Fits You?':'IIT Roorkee MBA vs Executive MBA',
            'IIT Roorkee MBA Admission Process':'IIT Roorkee MBA Admission',
            'How to Get Admission to IIT Roorkee MBA':'IIT Roorkee MBA Admission',
            'IIT Roorkee MBA Eligibility 2026-28':'IIT Roorkee MBA Eligibility',
            'IIT Roorkee MBA Fees 2026-27: Semester-wise & Total Cost':'IIT Roorkee MBA Fees & Total Cost',
            'IIT Roorkee MBA Selection Criteria & CAT Cutoff':'IIT Roorkee MBA CAT Cutoff & Selection',
            'IIT Roorkee MBA Selection & CAT Cutoff':'IIT Roorkee MBA CAT Cutoff & Selection',
            'IIT Roorkee MBA Placement Highlights':'IIT Roorkee MBA Placements',
            'IIT Roorkee Executive MBA: What the Programme Is':'IIT Roorkee Executive MBA Overview',
            'How to Apply for IIT Roorkee Executive MBA':'IIT Roorkee Executive MBA Admission',
            'Executive MBA Programme Structure & Specialisations':'IIT Roorkee Executive MBA Structure',
            'How the IIT Roorkee Executive MBA Is Delivered':'IIT Roorkee Executive MBA Learning Format',
            'IIT Roorkee Executive MBA: What Students Receive':'IIT Roorkee Executive MBA Benefits',
          }
          css='''<style id="iit-roorkee-final-ui-lock">html{scroll-behavior:smooth;scroll-padding-top:82px}body{font-family:Arial,Helvetica,sans-serif}.hero{background:linear-gradient(110deg,#172554 0%,#1d4ed8 100%);color:#fff;padding:38px 0}.hero-container{width:min(1240px,calc(100% - 40px));margin:0 auto;min-height:0;display:block}.hero h1{font-family:Arial,Helvetica,sans-serif;font-size:34px;line-height:1.18;font-weight:700;color:#fff;margin:0 0 7px;max-width:980px}.hero h2{font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.45;font-weight:600;color:#dbeafe;margin:0 0 9px;max-width:900px}.hero p{font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#dbeafe;margin:0 0 9px;max-width:900px}.hero small,.hero-location{font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.4;color:#dbeafe;font-weight:600}.hero a{color:#fff;text-decoration:underline;text-underline-offset:2px}.facts{width:min(1240px,calc(100% - 40px));margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px 0 22px}.fact{background:#fff;border:1px solid #dfe5ed;border-radius:7px;padding:13px 15px;min-height:66px}.fact strong{display:block;color:#173f82;font-size:17px;line-height:1.25;font-weight:700}.fact span{display:block;color:#64748b;font-size:10px;line-height:1.4;margin-top:4px}.layout{width:min(1240px,calc(100% - 40px));margin:0 auto;display:grid;grid-template-columns:225px minmax(0,1fr);gap:22px;align-items:start}.sec h2{font-family:Arial,Helvetica,sans-serif;font-size:21px;line-height:1.3;font-weight:700;color:#102a43}.ans{background:#eef6ff;border:1px solid #cfe0f5;border-radius:8px;padding:15px 17px;margin-bottom:16px}.ans strong{display:block;color:#173f82;font-size:13px;margin-bottom:5px}.ans p{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.65;color:#334155}@media(max-width:700px){.hero{padding:27px 0}.hero-container{width:calc(100% - 24px)}.hero h1{font-size:26px;line-height:1.2}.hero h2{font-size:13px;line-height:1.45}.hero small,.hero-location{font-size:11px}.facts{width:calc(100% - 20px);grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 0 16px}.fact{padding:11px;min-height:62px}.layout{width:calc(100% - 20px);display:block}}</style>'''
          for name in files:
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=re.sub(r'<div\s+class=["\']answer-first["\'][^>]*>.*?</div>','',s,flags=re.I|re.S)
              for old,new in replacements.items(): s=s.replace(old,new)
              # Title changes must stay inside the existing compact hero container.
              s=s.replace('<section class="hero"><div class="w">','<section class="hero"><div class="hero-container">',1)
              s=re.sub(r'<style\s+id=["\']iit-roorkee-final-ui-lock["\']>.*?</style>','',s,flags=re.I|re.S)
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Verify final state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['iit-roorkee.html','iit-roorkee-mba.html','iit-roorkee-executive-mba.html','iit-roorkee-placements.html']:
              s=Path(name).read_text(encoding='utf-8')
              assert s.count('class="ans"') == 1, f'{name}: Quick Answer count != 1'
              assert 'class="answer-first"' not in s, f'{name}: legacy duplicate answer block'
              assert 'iit-roorkee-final-ui-lock' in s, f'{name}: UI lock missing'
              assert '<section class="hero"><div class="hero-container">' in s, f'{name}: hero container is not locked'
              assert not re.search(r'<h2[^>]*>[^<]*</p>',s,re.I|re.S), f'{name}: malformed H2/paragraph markup'
              assert not re.search(r'<p[^>]*>[^<]*</h2>',s,re.I|re.S), f'{name}: malformed paragraph/H2 markup'
          print('Final IIT Roorkee benchmark state verified for all four pages.')
          PY
      - name: Commit final pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iit-roorkee.html iit-roorkee-mba.html iit-roorkee-executive-mba.html iit-roorkee-placements.html .github/workflows/final-iit-roorkee-repair.yml
          git diff --cached --quiet || git commit -m 'Finalize IIT Roorkee benchmark pages [skip ci]'
          git push
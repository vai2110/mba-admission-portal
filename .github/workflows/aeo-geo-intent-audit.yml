name: AEO GEO Intent Audit

on:
  push:
    paths:
      - '**.html'
      - 'scripts/aeo_geo_intent_audit.py'
      - '.github/workflows/aeo-geo-intent-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run AEO GEO and intent audit
        run: python scripts/aeo_geo_intent_audit.py

      - name: Upload AEO GEO audit
        uses: actions/upload-artifact@v4
        with:
          name: aeo-geo-intent-audit
          path: aeo-geo-intent-audit.json

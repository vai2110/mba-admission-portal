name: Finalize KIIT page interlinks
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Interlink all KIIT pages') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch links
        shell: python
        run: |
          from pathlib import Path
          p=Path('kiit-bhubaneswar.html')
          s=p.read_text(encoding='utf-8')
          card='<div class="info-card"><span class="pill">Computer Applications</span><h3>KIIT BCA</h3><p>Undergraduate computer applications programme for students targeting software and technology careers or a later MCA.</p><a href="kiit-bca.html">Explore KIIT BCA →</a></div>'
          marker='<a href="kiit-bba.html">Explore KIIT BBA →</a></div></div></section>'
          if 'href="kiit-bca.html">Explore KIIT BCA' not in s:
              if marker not in s: raise SystemExit('BBA course-card marker not found')
              s=s.replace(marker,'<a href="kiit-bba.html">Explore KIIT BBA →</a></div>'+card+'</div></section>',1)
          p.write_text(s,encoding='utf-8')
          p=Path('kiit-bhubaneswar-placements.html')
          s=p.read_text(encoding='utf-8')
          if 'href="kiit-bca.html">BCA</a>' not in s:
              s=s.replace('<a href="kiit-bba.html">BBA</a>','<a href="kiit-bba.html">BBA</a><a href="kiit-bca.html">BCA</a>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/kiit-interlink.yml kiit-interlink.trigger
          git add kiit-bhubaneswar.html kiit-bhubaneswar-placements.html .github/workflows/kiit-interlink.yml kiit-interlink.trigger
          git commit -m 'Interlink all KIIT pages'
          git push

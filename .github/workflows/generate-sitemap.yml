name: Generate Sitemap and Install Analytics

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-sitemap
  cancel-in-progress: false

jobs:
  generate-and-install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate sitemap and install Google Analytics
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Site automation attempt $attempt"

            git fetch origin main
            git reset --hard origin/main

            python scripts/inject_google_analytics.py
            python scripts/generate_sitemap.py

            if ! git status --porcelain -- '*.html' sitemap.xml | grep -q .; then
              echo "No site changes."
              exit 0
            fi

            git add -- '*.html' sitemap.xml
            git commit -m "Install Google Analytics and update sitemap [skip ci]"

            if git push origin HEAD:main; then
              echo "Site automation changes pushed successfully."
              exit 0
            fi

            echo "Push failed because main changed during the run. Retrying..."
            sleep 5
          done

          echo "Failed to push site automation changes after 5 attempts."
          exit 1

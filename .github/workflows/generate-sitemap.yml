name: Generate Sitemap and Install Analytics

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sitemap-and-analytics-pr
  cancel-in-progress: false

jobs:
  generate-and-propose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate analytics installation, college hub and sitemap
        run: |
          set -euo pipefail
          python scripts/inject_google_analytics.py
          python scripts/generate_college_guides_hub.py
          python scripts/generate_sitemap.py
      - name: Propose generated changes for review
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Propose analytics, hub and sitemap updates"
          branch: automation/sitemap-and-analytics
          delete-branch: true
          add-paths: |
            *.html
            sitemap.xml
          title: "SEO: review generated sitemap and analytics changes"
          body: |
            Generated sitemap/hub/analytics proposal. Check sitemap URL coverage, lastmod semantics, canonical tags and homepage/college-hub changes before merging. No direct push to main is performed.

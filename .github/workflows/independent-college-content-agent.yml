name: Independent College Content Agent

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of eligible colleges to process'
        required: false
        default: '10'
        type: string
  push:
    paths:
      - 'independent-agent-trigger.txt'

permissions:
  contents: write

concurrency:
  group: independent-college-content-production
  cancel-in-progress: false

env:
  GEMINI_MODEL: gemini-3.1-flash-lite
  COLLEGE_BATCH_SIZE: ${{ inputs.batch_size || '10' }}
  GOOGLE_SHEET_WEBAPP_URL: https://script.google.com/macros/s/AKfycbxiFlF-p-0G0xxocXP1LKphHApsdxMA9cgDnexj6pDEAVxnZXe5kkHx7hlPuQaSL_d5/exec

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 openpyxl
      - name: Configure Git identity
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
      - name: Validate AI credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo '::error::GEMINI_API_KEY is unavailable'; exit 1; }
      - name: Validate Google Sheet queue endpoint
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request, json
          url = os.environ["GOOGLE_SHEET_WEBAPP_URL"]
          test_url = url + ("&" if "?" in url else "?") + urllib.parse.urlencode({"action":"health"})
          with urllib.request.urlopen(test_url, timeout=30) as r:
              data = json.loads(r.read().decode("utf-8"))
          if not data.get("success"):
              raise SystemExit("Google Sheet health check failed: " + str(data))
          print("Google Sheet endpoint: healthy")
          print("Permanent completed rank boundary:", data.get("completedUpToRank"))
          print("Default batch size:", data.get("defaultBatchSize"))
          PY
      - name: Run independent college content agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_WEBAPP_URL: ${{ env.GOOGLE_SHEET_WEBAPP_URL }}
        run: python scripts/run_independent_college_content_agent.py

<section class="main-section" id="overview"><h2>SRMIST Overview</h2>
<p>SRM Institute of Science and Technology (SRMIST) is a deemed university with its flagship Kattankulathur campus in the Chennai region. The university has six SRMIST campuses: Kattankulathur, Ramapuram, Vadapalani, Modinagar, Tiruchirappalli and Baburayanpettai.</p>
<p>Students commonly compare SRMIST for B.Tech, MBA, MBBS, MCA and other UG, PG and doctoral programmes. Programme availability, fees and admission routes differ by course and campus, so the course page should be checked before making a choice.</p>
</section><hr/>
<section class="main-section" id="courses"><h2>SRMIST Courses</h2>
<p>SRMIST offers programmes in Engineering &amp; Technology, Management, Medicine &amp; Health Sciences, Science &amp; Humanities, Law and Agricultural Sciences. B.Tech includes CSE, Artificial Intelligence, Information Technology, ECE and several specialised technology programmes. Management includes MBA Business Administration and specialised MBA programmes.</p>
</section><hr/>
<section class="main-section" id="popular"><h2>Popular SRMIST Courses</h2>
<div class="table-wrapper"><table><tr><th>Programme</th><th>Student-useful detail</th><th>Dedicated page</th></tr>
<tr><td>B.Tech CSE</td><td>Core computer science pathway; SRMJEEE route.</td><td><a href="srm-institute-science-technology-btech-cse.html">B.Tech CSE fees, eligibility &amp; admission</a></td></tr>
<tr><td>B.Tech Artificial Intelligence</td><td>AI-focused engineering pathway; SRMJEEE route.</td><td><a href="srm-institute-science-technology-btech-ai.html">B.Tech AI details</a></td></tr>

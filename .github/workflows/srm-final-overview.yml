</table></div></section><hr/>
<section class="main-section" id="admission"><h2>SRMIST Admission 2026-27</h2>
<h3>B.Tech admission</h3><p>SRMIST uses SRMJEEE (UG) for B.Tech admissions. The official 2026 FAQ listed three application phases, with deadlines of April 16, June 4 and June 30, 2026. These dates belong to the 2026 cycle and should not be treated as a future 2027 schedule.</p>
<h3>MBA admission</h3><p>For MBA, SRMIST lists SRMJEEM followed by personal interview. Candidates with CAT, XAT, MAT, GMAT, NMAT, CMAT or TANCET scores can receive direct consideration for the PI subject to the stated eligibility.</p>
<h3>Other programmes</h3><p>MBBS admission follows the NEET-UG and medical counselling route. Other UG and PG programmes have course-specific eligibility and admission rules.</p>
</section><hr/>
<section class="main-section" id="btech-cutoff"><h2>SRMIST B.Tech Cutoff: What Rank Should You Target?</h2>
<p>SRMIST does not publish a single official branch-wise closing-rank table on the current programme pages that can be used as a universal B.Tech cutoff. Therefore, this page does <strong>not</strong> present unofficial CSE/ECE closing ranks as official cutoffs.</p>
<div class="answer-box"><strong>What is officially available?</strong><p>SRMJEEE rank is used in counselling, and the official counselling manual states that programme/campus allotment depends on rank, preferences and seat availability. Students should use their actual SRMJEEE rank during counselling rather than relying on an unverified internet cutoff.</p></div>
</section><hr/>
<section class="main-section" id="fees"><h2>SRMIST Fees</h2>
<h3>Selected official management fees</h3><div class="table-wrapper"><table><tr><th>Programme / campus</th><th>Official fee</th></tr>
<tr><td>MBA Business Administration, Kattankulathur</td><td>₹4,50,000</td></tr>
<tr><td>MBA Business Administration, Ramapuram</td><td>₹3,25,000</td></tr>
<tr><td>MBA Business Administration, Vadapalani</td><td>₹3,00,000</td></tr>
<tr><td>MBA Financial Services with NSE, Kattankulathur</td><td>₹5,75,000</td></tr>
<tr><td>MBA Executive PGDM, Kattankulathur</td><td>₹12,00,000</td></tr>
</table></div>
<h3>B.Tech fee example</h3><p>The official SRMIST B.Tech CSE with Big Data Analytics page lists an annual fee of ₹4,25,000 for the Kattankulathur programme. Fees vary by branch and campus, so the dedicated course page should be used for the exact programme.</p>
</section><hr/>
<section class="main-section" id="placements"><h2>SRMIST Placements</h2>
<p>The latest consolidated university-level placement figures identified in SRMIST's official 2023 brochure report <strong>1,311 companies visited, 13,069 offers, 3,970 high-paying offers, a maximum salary of ₹1 crore per annum and an average salary of ₹10.5 LPA</strong>.</p>
<p>For engineering students, official NIRF 2026 data for 2024-25 reports 4,144 placed out of 4,408 graduating students in four-year UG programmes, with a median salary of ₹6.32 lakh. For two-year PG programmes, 595 of 621 graduates were placed, with a median salary of ₹6.35 lakh.</p>
</section><hr/>
<section class="main-section" id="scholarships"><h2>SRMIST Scholarships</h2><p>SRMIST offers scholarships including Founder’s Scholarship and SRM Merit Scholarship. B.Tech scholarship criteria include specified SRMJEEE and JEE Main rank bands, along with other academic achievement categories. Renewal conditions apply, so students should check the current scholarship policy for the exact rank, CGPA and renewal requirements.</p></section><hr/>
<section class="main-section" id="faq"><h2>SRMIST FAQs Students Actually Ask</h2>
<div class="accordion"><details><summary>Is SRMIST the same as SRM University?</summary><p>SRM Institute of Science and Technology is the deemed university commonly referred to as SRMIST. The broader SRM group also contains other institutions, so a student should verify that the programme is offered by SRMIST itself.</p></details>
<details><summary>Which SRMIST campus is the main campus?</summary><p>Kattankulathur is the flagship SRMIST campus in the Chennai region and has the broadest multi-faculty academic ecosystem.</p></details>
<details><summary>Does SRMIST accept JEE Main for B.Tech?</summary><p>SRMJEEE is the principal B.Tech admission route. SRMIST also publishes scholarship criteria involving JEE Main ranks; students should not confuse scholarship eligibility with the normal admission route.</p></details>
<details><summary>Does SRMIST publish branch-wise B.Tech closing ranks?</summary><p>A universal official branch-wise closing-rank table is not available on the current SRMIST pages used for this guide. Counselling allotment depends on rank, preference and seat availability.</p></details>
<details><summary>What is the SRMIST MBA fee?</summary><p>For MBA Business Administration, the official management admission page lists ₹4.50 lakh at Kattankulathur, ₹3.25 lakh at Ramapuram and ₹3 lakh at Vadapalani. Specialised MBA fees differ.</p></details>
<details><summary>What was SRMIST's official average placement salary?</summary><p>The official 2023 university placement figures report an average salary of ₹10.5 LPA. This is a university-level historical figure, not a guaranteed salary for every programme or student.</p></details>
</div></section>

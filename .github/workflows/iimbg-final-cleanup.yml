name: Finalize IIM Bodh Gaya Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant college nav and add new section links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          
          pages = ['iim-bodhgaya.html','iim-bodhgaya-mba.html','iim-bodhgaya-dbai.html','iim-bodhgaya-hhm.html','iim-bodhgaya-placements.html']
          for name in pages:
              p=Path(name)
              html=p.read_text(encoding='utf-8')
              html=re.sub(r'<nav class="college-cluster-nav"[^>]*>.*?</nav>', '', html, count=1, flags=re.S)
              if name=='iim-bodhgaya.html':
                  html=html.replace('<a href="#admission">Admission 2026</a>', '<a href="#admission">Admission 2026</a><a href="#admission-reality">MBA admission & cutoff</a>', 1)
              elif name=='iim-bodhgaya-mba.html':
                  html=html.replace('<a href="#eligibility">Eligibility &amp; admission</a>', '<a href="#eligibility">Eligibility &amp; admission</a><a href="#admission-detail">Detailed admission & cutoff</a>', 1)
                  html=html.replace('<a href="#roi">Is it worth the cost?</a>', '<a href="#roi">Is it worth the cost?</a><a href="#student-voice">Student discussions</a>', 1)
              elif name=='iim-bodhgaya-dbai.html':
                  html=html.replace('<a href="#eligibility">Eligibility &amp; admission</a>', '<a href="#eligibility">Eligibility &amp; admission</a><a href="#admission-detail">Detailed admission & cutoff</a>', 1)
                  html=html.replace('<a href="#compare">MBA vs MBA-DBAI</a>', '<a href="#compare">MBA vs MBA-DBAI</a><a href="#student-voice">Student discussions</a>', 1)
              elif name=='iim-bodhgaya-hhm.html':
                  html=html.replace('<a href="#admission">Admission 2026</a>', '<a href="#admission">Admission 2026</a><a href="#admission-detail">Detailed admission & cutoff</a>', 1)
                  html=html.replace('<a href="#compare">MBA vs MBA-HHM</a>', '<a href="#compare">MBA vs MBA-HHM</a><a href="#student-voice">Student discussions</a>', 1)
              elif name=='iim-bodhgaya-placements.html':
                  html=html.replace('<a href="#strategy">How to prepare</a>', '<a href="#strategy">How to prepare</a><a href="#student-voice">Student discussions</a>', 1)
              p.write_text(html,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iim-bodhgaya.html iim-bodhgaya-mba.html iim-bodhgaya-dbai.html iim-bodhgaya-hhm.html iim-bodhgaya-placements.html
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Remove redundant IIM Bodh Gaya nav and expose admission sections"; git push; fi

name: Trigger AMU depth upgrade
on:
  push:
  workflow_dispatch:
jobs:
  dispatch:
    if: ${{ github.event.head_commit.message != 'Expand AMU pages to IIM-level content depth' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch AMU depth workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run amu-depth-upgrade.yml --repo vai2110/mba-admission-portal --ref main
name: Restore IIT Roorkee page design

on:
  push:
    paths:
      - '.github/workflows/restore-iit-roorkee-pages.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pages from pre-change commit
        run: |
          git checkout e7604a52c230eed65dc42c9922667e8efb8be28a -- iit-roorkee.html iit-roorkee-mba.html iit-roorkee-executive-mba.html iit-roorkee-placements.html
          git config user.name 'mba-page-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iit-roorkee.html iit-roorkee-mba.html iit-roorkee-executive-mba.html iit-roorkee-placements.html
          git commit -m 'Restore IIT Roorkee page design'
          git push

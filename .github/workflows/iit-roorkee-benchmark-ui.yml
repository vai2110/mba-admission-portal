name: IIT Roorkee Benchmark UI

on:
  push:
    paths:
      - 'iit-roorkee*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply locked SIBM/IIMA UI rules
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = [
              Path('iit-roorkee.html'),
              Path('iit-roorkee-mba.html'),
              Path('iit-roorkee-executive-mba.html'),
              Path('iit-roorkee-placements.html'),
          ]

          for path in pages:
              if not path.exists():
                  continue
              s = path.read_text(encoding='utf-8')

              # Match the approved SIBM Pune typography/layout: Arial stack, 36px H1,
              # compact 38px hero padding, 16px hero subheading and 13px location.
              s = re.sub(r'\.hero\{[^}]*padding:[^}]*\}',
                         '.hero{background:linear-gradient(110deg,#172554 0%,#1d4ed8 100%);color:#fff;padding:38px 0}', s, count=1)
              s = re.sub(r'\.hero-container\{[^}]*\}',
                         '.hero-container{width:min(1240px,calc(100% - 40px));margin:auto}', s, count=1)
              s = re.sub(r'\.hero h1\{[^}]*\}',
                         '.hero h1{font-size:36px;line-height:1.18;margin:0 0 9px;max-width:900px}', s, count=1)
              s = re.sub(r'\.hero h2\{[^}]*\}',
                         '.hero h2{font-size:16px;line-height:1.5;font-weight:600;color:#dbeafe;margin:0 0 10px;max-width:900px}', s, count=1)
              s = re.sub(r'\.hero-location\{[^}]*\}',
                         '.hero-location{font-size:13px;color:#dbeafe;font-weight:600}', s, count=1)

              # Ensure the IIMA/SIBM shared base font is retained everywhere.
              s = re.sub(r'body\{font-family:[^}]*\}',
                         'body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033;line-height:1.65}', s, count=1)

              # Remove an accidental duplicate Quick Answer when both answer-first and
              # the approved answer-box/ans block exist. Keep the substantive answer block.
              if '<div class="ans">' in s:
                  s = re.sub(r'<div class="answer-first">.*?</div>\s*', '', s, count=1, flags=re.S)

              # Do not allow a second visible Quick Answer heading before the approved block.
              # If an answer-first survived because of formatting, remove its whole block.
              if '<div class="ans">' in s:
                  s = re.sub(r'<div[^>]+class=["\']answer-first["\'][^>]*>.*?</div>\s*', '', s, count=1, flags=re.S)

              # Keep placement H1 keyword-focused and compact: no year/trend stuffing in H1.
              if path.name == 'iit-roorkee-placements.html':
                  s = re.sub(r'<h1>IIT Roorkee MBA Placements[^<]*?</h1>',
                             '<h1>IIT Roorkee MBA Placements: Average Package, Median &amp; Highest CTC</h1>', s, count=1)

              path.write_text(s, encoding='utf-8')

          # Persist the exact rules so future agent runs don't regress them.
          agent = Path('AGENTS.md')
          if agent.exists():
              a = agent.read_text(encoding='utf-8')
          else:
              a = '# MBA Portal College Page Agent\n'
          marker = '## Locked Hero, Quick Answer and H2 Rules'
          if marker not in a:
              a += '''\n\n## Locked Hero, Quick Answer and H2 Rules\n- Use the SIBM Pune hero container as the visual benchmark for all new and audited college pages: compact text-first hero, same overall container proportions, typography scale and spacing; do not invent hero modules.\n- Preserve the approved site font stack `Arial, Helvetica, sans-serif` and do not independently substitute fonts or alter the established base typography.\n- Use exactly one visible Quick Answer block per page. Do not render both an introductory `answer-first` block and an `ans`/approved Quick Answer block.\n- H2 headings must be short, specific, student-intent driven and naturally keyword optimised. Avoid generic headings such as `Overview`, `Career Outcomes`, `Programme Details` or `Trends` when a more precise college/programme query can be used.\n- Placement-page H1s should be concise and keyword-led; put year-specific detail in the supporting content/title metadata rather than making the H1 unnecessarily long.\n- These are hard QA rules and must be checked after every creation or modification pass.\n'''
              agent.write_text(a, encoding='utf-8')

      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          import re
          pages = [Path('iit-roorkee.html'),Path('iit-roorkee-mba.html'),Path('iit-roorkee-executive-mba.html'),Path('iit-roorkee-placements.html')]
          for p in pages:
              s=p.read_text(encoding='utf-8')
              assert len(re.findall(r'<div[^>]+class=["\']ans["\']',s)) <= 1, f'{p}: duplicate ans block'
              assert 'font-family:Arial,Helvetica,sans-serif' in s, f'{p}: font regression'
              assert '.hero h1{font-size:36px' in s, f'{p}: hero typography regression'
              assert '.hero h2{font-size:16px' in s, f'{p}: hero subheading regression'
          print('IIT Roorkee benchmark UI rules verified.')

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iit-roorkee*.html AGENTS.md
          git diff --cached --quiet || git commit -m 'Apply locked IIT Roorkee UI benchmark fixes [skip ci]'
          git push
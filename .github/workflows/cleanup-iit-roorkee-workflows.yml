name: Consolidate IIT Roorkee page workflows

on:
  push:
    paths:
      - '.github/workflows/cleanup-iit-roorkee-workflows.yml'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove conflicting legacy IIT Roorkee workflows and repair pages
        run: |
          set -e
          rm -f \
            .github/workflows/iit-roorkee-apply-v2.yml \
            .github/workflows/iit-roorkee-apply-v3.yml \
            .github/workflows/iit-roorkee-apply-v4.yml \
            .github/workflows/iit-roorkee-apply-v5.yml \
            .github/workflows/iit-roorkee-apply.yml \
            .github/workflows/iit-roorkee-benchmark-ui.yml \
            .github/workflows/repair-iit-roorkee.yml \
            .github/workflows/repair-iit-roorkee-html.yml \
            .github/workflows/cleanup-iit-roorkee-workflows.yml

          python3 - <<'PY'
          from pathlib import Path
          import re
          files=['iit-roorkee.html','iit-roorkee-mba.html','iit-roorkee-executive-mba.html','iit-roorkee-placements.html']
          for name in files:
              p=Path(name); s=p.read_text(encoding='utf-8')
              # Remove legacy duplicate answer-first boxes.
              s=re.sub(r'<div\s+class=["\']answer-first["\'][^>]*>.*?</div>', '', s, flags=re.I|re.S)
              # Repair malformed h2-opened paragraphs and p-closed-as-h2 paragraphs.
              s=re.sub(r'<h2(\s[^>]*)?>(.*?)</p>', lambda m:'<p'+(m.group(1) or '')+'>'+m.group(2)+'</p>', s, flags=re.I|re.S)
              s=re.sub(r'<p(\s[^>]*)?>(.*?)</h2>', lambda m:'<p'+(m.group(1) or '')+'>'+m.group(2)+'</p>', s, flags=re.I|re.S)
              # Make the first Quick Answer box the only one and ensure its body is a paragraph.
              def qa(m):
                  inner=m.group(1)
                  inner=re.sub(r'<h2(\s[^>]*)?>(.*?)</p>', lambda x:'<p'+(x.group(1) or '')+'>'+x.group(2)+'</p>', inner, flags=re.I|re.S)
                  inner=re.sub(r'<h2(\s[^>]*)?>(.*?)</h2>', lambda x:'<p'+(x.group(1) or '')+'>'+x.group(2)+'</p>', inner, flags=re.I|re.S)
                  return '<div class="ans"><strong>Quick answer</strong>'+re.sub(r'<strong>Quick answer</strong>','',inner,flags=re.I)+'</div>'
              s=re.sub(r'<div\s+class=["\']ans["\']>(.*?)</div>', qa, s, count=1, flags=re.I|re.S)
              matches=list(re.finditer(r'<div\s+class=["\']ans["\']>.*?</div>', s, flags=re.I|re.S))
              for m in reversed(matches[1:]): s=s[:m.start()]+s[m.end():]
              # Final compact SIBM Pune-style hero and IIMA typography baseline.
              css='''<style id="iit-roorkee-final-ui-lock">html{scroll-behavior:smooth;scroll-padding-top:82px}body{font-family:Arial,Helvetica,sans-serif}.hero{background:linear-gradient(110deg,#172554 0%,#1d4ed8 100%);color:#fff;padding:38px 0}.hero-container{width:min(1240px,calc(100% - 40px));margin:0 auto;min-height:0;display:block}.hero h1{font-family:Arial,Helvetica,sans-serif;font-size:34px;line-height:1.18;font-weight:700;color:#fff;margin:0 0 7px;max-width:980px}.hero h2{font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.45;font-weight:600;color:#dbeafe;margin:0 0 9px;max-width:900px}.hero p{font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#dbeafe;margin:0 0 9px;max-width:900px}.hero small,.hero-location{font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.4;color:#dbeafe;font-weight:600}.hero a{color:#fff;text-decoration:underline;text-underline-offset:2px}.facts{width:min(1240px,calc(100% - 40px));margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px 0 22px}.fact{background:#fff;border:1px solid #dfe5ed;border-radius:7px;padding:13px 15px;min-height:66px}.fact strong{display:block;color:#173f82;font-size:17px;line-height:1.25;font-weight:700}.fact span{display:block;color:#64748b;font-size:10px;line-height:1.4;margin-top:4px}.layout{width:min(1240px,calc(100% - 40px));margin:0 auto;display:grid;grid-template-columns:225px minmax(0,1fr);gap:22px;align-items:start}.sec h2{font-family:Arial,Helvetica,sans-serif;font-size:21px;line-height:1.3;font-weight:700;color:#102a43}.ans{background:#eef6ff;border:1px solid #cfe0f5;border-radius:8px;padding:15px 17px;margin-bottom:16px}.ans strong{display:block;color:#173f82;font-size:13px;margin-bottom:5px}.ans p{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.65;color:#334155}@media(max-width:700px){.hero{padding:27px 0}.hero-container{width:calc(100% - 24px)}.hero h1{font-size:26px;line-height:1.2}.hero h2{font-size:13px;line-height:1.45}.hero small,.hero-location{font-size:11px}.facts{width:calc(100% - 20px);grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 0 16px}.fact{padding:11px;min-height:62px}.layout{width:calc(100% - 20px);display:block}}</style>'''
              s=re.sub(r'<style\s+id=["\']iit-roorkee-final-ui-lock["\']>.*?</style>','',s,flags=re.I|re.S)
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['iit-roorkee.html','iit-roorkee-mba.html','iit-roorkee-executive-mba.html','iit-roorkee-placements.html']:
              s=Path(name).read_text(encoding='utf-8')
              assert s.count('class="ans"') == 1, f'{name}: Quick Answer count != 1'
              assert 'class="answer-first"' not in s, f'{name}: duplicate answer-first remains'
              assert not re.search(r'<h2[^>]*>.*?</p>',s,re.I|re.S), f'{name}: malformed h2 paragraph'
              assert not re.search(r'<p[^>]*>.*?</h2>',s,re.I|re.S), f'{name}: malformed p close'
              assert 'iit-roorkee-final-ui-lock' in s, f'{name}: final UI lock missing'
          print('IIT Roorkee cleanup verification passed.')
          PY

      - name: Commit consolidated state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Consolidate IIT Roorkee page workflow and restore UI'
          git push
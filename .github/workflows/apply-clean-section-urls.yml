name: Apply clean section URLs across all pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-clean-section-navigation:
    if: ${{ !contains(github.event.head_commit.message, 'Apply clean section URLs across all pages') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add shared no-hash navigation to every HTML page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          changed = []
          script_tag = '<script src="/no-hash-navigation.js?v=20261010" defer></script>'
          for path in root.rglob('*.html'):
              if any(part in {'.git', 'node_modules', '.vercel'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              if '/no-hash-navigation.js' in text:
                  continue
              lower = text.lower()
              pos = lower.rfind('</body>')
              if pos >= 0:
                  updated = text[:pos] + script_tag + '\n' + text[pos:]
              else:
                  pos = lower.rfind('</html>')
                  if pos >= 0:
                      updated = text[:pos] + script_tag + '\n' + text[pos:]
                  else:
                      continue
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print(f'Added clean section navigation to {len(changed)} HTML files.')
          if changed:
              Path('/tmp/changed-html-count.txt').write_text(str(len(changed)))
          PY
      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "All HTML pages already include the shared navigation script."
            exit 0
          fi
          git commit -m "Apply clean section URLs across all pages"
          git push

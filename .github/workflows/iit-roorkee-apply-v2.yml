name: IIT Roorkee UI Fix v2

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply IIT Roorkee locked UI [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply SIBM Pune hero and IIMA typography rules
        shell: python
        run: |
          from pathlib import Path
          import re
          pages=[Path('iit-roorkee.html'),Path('iit-roorkee-mba.html'),Path('iit-roorkee-executive-mba.html'),Path('iit-roorkee-placements.html')]
          for p in pages:
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              # Normalize the existing hero without changing its HTML architecture/content.
              s=re.sub(r'\.hero\{[^}]*\}', '.hero{background:linear-gradient(110deg,#172554 0%,#1d4ed8 100%);color:#fff;padding:38px 0}', s, count=1)
              s=re.sub(r'\.hero-container\{[^}]*\}', '.hero-container{width:min(1240px,calc(100% - 40px));margin:auto}', s, count=1)
              s=re.sub(r'\.hero h1\{[^}]*\}', '.hero h1{font-size:36px;line-height:1.18;margin:0 0 9px;max-width:900px}', s, count=1)
              s=re.sub(r'\.hero h2\{[^}]*\}', '.hero h2{font-size:16px;line-height:1.5;font-weight:600;color:#dbeafe;margin:0 0 10px;max-width:900px}', s, count=1)
              s=re.sub(r'\.hero-location\{[^}]*\}', '.hero-location{font-size:13px;color:#dbeafe;font-weight:600}', s, count=1)
              # Keep the exact approved font family used by the benchmark pages.
              s=re.sub(r'body\{font-family:[^}]*\}', 'body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033;line-height:1.65}', s, count=1)
              # Remove only the duplicate visible introductory Quick Answer; keep the approved substantive answer.
              if '<div class="ans">' in s:
                  s=re.sub(r'<div[^>]+class=["\']answer-first["\'][^>]*>.*?</div>\s*', '', s, count=1, flags=re.S)
              if p.name=='iit-roorkee-placements.html':
                  s=re.sub(r'<h1>IIT Roorkee MBA Placements[^<]*?</h1>', '<h1>IIT Roorkee MBA Placements: Average Package, Median &amp; Highest CTC</h1>', s, count=1)
              p.write_text(s,encoding='utf-8')
          # Add the rule to the persistent agent skill.
          a=Path('AGENTS.md')
          txt=a.read_text(encoding='utf-8') if a.exists() else '# MBA Portal College Page Agent\n'
          marker='## Locked Hero, Quick Answer and H2 Rules'
          if marker not in txt:
              txt += '''\n\n## Locked Hero, Quick Answer and H2 Rules\n- The hero must use the SIBM Pune benchmark container, proportions, spacing and typography; never redesign it independently.\n- Preserve the approved `Arial, Helvetica, sans-serif` font stack and established font sizes.\n- Exactly one visible Quick Answer block is allowed per page.\n- H2s must be short, college/programme-specific and naturally keyword optimised; avoid generic headings.\n- Placement H1s must be concise and keyword-led; keep year-specific details in metadata/body.\n- Apply and verify these rules on every new or existing page audit.\n'''
              a.write_text(txt,encoding='utf-8')
      - name: Verify required changes
        shell: python
        run: |
          from pathlib import Path
          import re
          for p in [Path('iit-roorkee.html'),Path('iit-roorkee-mba.html'),Path('iit-roorkee-executive-mba.html'),Path('iit-roorkee-placements.html')]:
              s=p.read_text(encoding='utf-8')
              assert 'Arial,Helvetica,sans-serif' in s or 'Arial, Helvetica, sans-serif' in s, f'{p}: font rule missing'
              assert '.hero h1{font-size:36px' in s, f'{p}: hero h1 rule missing'
              assert '.hero h2{font-size:16px' in s, f'{p}: hero h2 rule missing'
              assert len(re.findall(r'<div[^>]+class=["\']ans["\']',s)) <= 1, f'{p}: duplicate ans blocks'
          print('IIT Roorkee benchmark UI checks passed.')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iit-roorkee*.html AGENTS.md
          git diff --cached --quiet || git commit -m 'Apply IIT Roorkee locked UI [skip ci]'
          git push
name: Content Relevance Audit

on:
  workflow_dispatch:
    inputs:
      target_page:
        description: 'HTML filename to audit; leave blank for all pages'
        required: false
        type: string
        default: 'iim-ahmedabad.html'
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'scripts/free_content_auditor.py'
      - '.github/workflows/content-audit.yml'

permissions:
  contents: write

concurrency:
  group: content-audit-main
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run free editorial audit
        env:
          TARGET_PAGE: ${{ github.event.inputs.target_page || 'iim-ahmedabad.html' }}
        run: python scripts/free_content_auditor.py

      - name: Commit audit report
        run: |
          git config user.name "MBA Portal Free Content Auditor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-audit-report.json
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Run free content relevance audit"
            git push
          fi

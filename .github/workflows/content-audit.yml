name: Content Relevance Audit

on:
  workflow_dispatch:
    inputs:
      target_page:
        description: 'HTML filename to audit'
        required: false
        type: string
        default: 'iim-ahmedabad.html'
      apply_changes:
        description: 'Apply reviewed safe content improvements to the target page'
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'scripts/free_content_auditor.py'
      - 'scripts/apply_iima_content_updates.py'
      - '.github/workflows/content-audit.yml'

permissions:
  contents: write

concurrency:
  group: content-audit-main
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run free editorial audit
        env:
          TARGET_PAGE: ${{ github.event.inputs.target_page || 'iim-ahmedabad.html' }}
        run: python scripts/free_content_auditor.py

      - name: Apply reviewed IIM Ahmedabad improvements
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.apply_changes == 'true' && github.event.inputs.target_page == 'iim-ahmedabad.html' }}
        run: python scripts/apply_iima_content_updates.py

      - name: Commit audit report and approved HTML changes
        run: |
          git config user.name "MBA Portal Content Auditor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-audit-report.json '*.html'
          if git diff --cached --quiet; then
            echo "No report or content changes required."
          else
            git commit -m "Audit and improve approved page content"
            git push
          fi

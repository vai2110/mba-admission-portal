name: Content Relevance Audit

on:
  workflow_dispatch:
    inputs:
      target_page:
        description: 'Optional HTML filename to audit; leave blank for all pages'
        required: false
        type: string
        default: 'iim-ahmedabad.html'
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'scripts/content_auditor.py'
      - '.github/workflows/content-audit.yml'

permissions:
  contents: write

concurrency:
  group: content-audit-main
  cancel-in-progress: true

jobs:
  audit-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Audit and improve HTML content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5
          TARGET_PAGE: ${{ github.event.inputs.target_page || 'iim-ahmedabad.html' }}
        run: python scripts/content_auditor.py

      - name: Commit improved pages and audit report
        run: |
          git config user.name "MBA Portal Content Auditor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' content-audit-report.json
          if git diff --cached --quiet; then
            echo "No content changes required."
          else
            git commit -m "Audit and improve page content"
            git push
          fi

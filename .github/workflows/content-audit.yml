name: Content Relevance Audit

on:
  push:
    paths:
      - '**.html'
      - 'scripts/seo_geo_aeo_audit.py'
      - '.github/workflows/content-audit.yml'
  workflow_dispatch:
    inputs:
      target_page:
        description: 'HTML filename to audit (leave blank for all HTML pages)'
        required: false
        type: string
        default: ''
      apply_changes:
        description: 'Apply safe automatic editorial improvements'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: content-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Determine pages to process
        env:
          TARGET_PAGE: ${{ inputs.target_page }}
          EVENT_AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          AUDIT_BASE="71a844d7b643c982103fe59542444600b4b92fb7"
          if [ -n "$TARGET_PAGE" ]; then
            printf '%s\n' "$TARGET_PAGE" > changed-html.txt
          elif [ "$EVENT_NAME" = "push" ]; then
            git diff --name-only "$AUDIT_BASE" "$EVENT_AFTER" -- '*.html' \
              | grep -vE '^(index\.html|404\.html|content-audit\.html|sibm-pune[^/]*\.html)$' \
              | sort -u > changed-html.txt || true
          else
            find . -type f -name '*.html' -not -path './.git/*' \
              -not -name 'index.html' -not -name '404.html' -not -name 'content-audit.html' \
              -not -name 'sibm-pune*.html' | sed 's#^./##' | sort > changed-html.txt
          fi
          echo "Pages selected:"
          cat changed-html.txt || true

      - name: Run SEO + AEO + GEO audit fixer
        if: ${{ (github.event_name == 'push' || inputs.apply_changes == true) && hashFiles('changed-html.txt') != '' }}
        run: |
          export TARGET_PAGES="$(cat changed-html.txt)"
          python scripts/seo_geo_aeo_audit.py

      - name: Run content audit after SEO/AEO/GEO fixes
        if: ${{ hashFiles('changed-html.txt') != '' }}
        run: |
          export TARGET_PAGES="$(cat changed-html.txt)"
          python scripts/free_content_auditor.py

      - name: Verify HTML integrity and hero protection
        if: ${{ hashFiles('changed-html.txt') != '' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          excluded = {'index.html', '404.html', 'content-audit.html'}
          pages = [p.strip() for p in Path('changed-html.txt').read_text().splitlines() if p.strip()]
          for name in pages:
              path = Path(name)
              if path.name in excluded or not path.exists():
                  continue
              raw = path.read_text(encoding='utf-8')
              if raw.count('<!DOCTYPE html>') > 1 or raw.lower().count('<html') > 1:
                  raise SystemExit(f'HTML integrity failed: duplicate document root in {name}')
              soup = BeautifulSoup(raw, 'html.parser')
              hero = soup.select_one('.hero')
              if hero is not None and hero.select('.notice'):
                  raise SystemExit(f'Hero protection failed: notice found in {name}')
              print(f'Integrity PASS: {name}')
          PY

      - name: Commit automatic HTML improvements
        if: ${{ github.event_name == 'push' || inputs.apply_changes == true }}
        run: |
          git config user.name "MBA Portal Content Auditor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No automatic HTML changes required."
          else
            git commit -m "SEO AEO GEO audit and improve updated college pages"
            git push
          fi

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-audit-results
          path: |
            content-audit-report.json
            seo-geo-aeo-report.json
          if-no-files-found: ignore

name: Content Relevance Audit

on:
  push:
    paths:
      - '**.html'
  workflow_dispatch:
    inputs:
      target_page:
        description: 'HTML filename to audit (leave blank for all HTML pages)'
        required: false
        type: string
        default: ''
      apply_changes:
        description: 'Apply safe automatic editorial improvements'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: content-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-update:
    # Ignore the workflow's own follow-up commit so automation cannot loop.
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Determine pages to process
        id: pages
        env:
          TARGET_PAGE: ${{ inputs.target_page }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          if [ -n "$TARGET_PAGE" ]; then
            printf '%s\n' "$TARGET_PAGE" > changed-html.txt
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$EVENT_BEFORE" "$EVENT_AFTER" -- '*.html' | grep -vE '^(index\.html|404\.html|content-audit\.html)$' > changed-html.txt || true
          else
            find . -type f -name '*.html' -not -path './.git/*' -not -name 'index.html' -not -name '404.html' -not -name 'content-audit.html' | sed 's#^./##' | sort > changed-html.txt
          fi
          echo "Pages selected:"
          cat changed-html.txt || true

      - name: Run automatic safe editorial fixer
        if: ${{ hashFiles('changed-html.txt') != '' }}
        env:
          TARGET_PAGES: ${{ steps.pages.outputs.pages }}
        run: |
          export TARGET_PAGES="$(cat changed-html.txt)"
          python scripts/auto_content_fixer.py

      - name: Run content audit after automatic fixes
        env:
          TARGET_PAGE: ${{ inputs.target_page }}
        run: |
          if [ -n "$TARGET_PAGE" ]; then
            python scripts/free_content_auditor.py
          elif [ -s changed-html.txt ]; then
            export TARGET_PAGE="$(head -n 1 changed-html.txt)"
            python scripts/free_content_auditor.py
          else
            echo 'No HTML pages changed; nothing to audit.'
          fi

      - name: Verify hero protection
        if: ${{ hashFiles('changed-html.txt') != '' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          excluded = {'index.html', '404.html', 'content-audit.html'}
          pages = [p.strip() for p in Path('changed-html.txt').read_text().splitlines() if p.strip()]
          for name in pages:
              path = Path(name)
              if path.name in excluded or not path.exists():
                  continue
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              hero = soup.select_one('.hero')
              if hero is not None:
                  # Automatic content fixes must never introduce audit notices into the hero.
                  if hero.select('.notice'):
                      raise SystemExit(f'Hero protection failed: notice found in {name}')
              print(f'Hero protection PASS: {name}')
          PY

      - name: Commit automatic HTML improvements
        run: |
          git config user.name "MBA Portal Content Auditor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No automatic HTML changes required."
          else
            git commit -m "Auto-audit and improve updated college pages"
            git push
          fi

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: content-audit-results
          path: |
            content-audit-report.json
            auto-fix-report.json
          if-no-files-found: ignore

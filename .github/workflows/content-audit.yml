name: Content Relevance Audit

on:
  workflow_dispatch:
    inputs:
      target_page:
        description: 'HTML filename to audit'
        required: false
        type: string
        default: 'iim-ahmedabad.html'
      apply_changes:
        description: 'Apply reviewed safe content improvements to the target page'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: content-audit-manual
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run initial free editorial audit
        env:
          TARGET_PAGE: ${{ inputs.target_page }}
        run: python scripts/free_content_auditor.py

      - name: Apply reviewed IIM Ahmedabad improvements
        if: ${{ inputs.apply_changes == true && inputs.target_page == 'iim-ahmedabad.html' }}
        run: python scripts/apply_iima_content_updates.py

      - name: Apply reviewed IIM Indore improvements
        if: ${{ inputs.apply_changes == true && inputs.target_page == 'iim-indore.html' }}
        run: python scripts/apply_iima_indore_content_updates.py

      - name: Re-run audit after approved changes
        if: ${{ inputs.apply_changes == true }}
        env:
          TARGET_PAGE: ${{ inputs.target_page }}
        run: python scripts/free_content_auditor.py

      - name: Verify approved IIM Ahmedabad changes
        if: ${{ inputs.apply_changes == true && inputs.target_page == 'iim-ahmedabad.html' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          path = Path('iim-ahmedabad.html')
          soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
          checks = {
              'scholarship section': soup.find(id='scholarships') is not None,
              'official IIMA admission source': 'https://www.iima.ac.in/academics/mba/admissions/indians' in str(soup),
              'official scholarship rules source': 'Financial%20AssistanceScholarships.pdf' in str(soup),
          }
          for label, ok in checks.items(): print(f'{label}: {"PASS" if ok else "FAIL"}')
          if not all(checks.values()): raise SystemExit('Approved IIMA verification failed; refusing to commit.')
          PY

      - name: Verify approved IIM Indore changes
        if: ${{ inputs.apply_changes == true && inputs.target_page == 'iim-indore.html' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          path = Path('iim-indore.html')
          soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
          html = str(soup)
          text = soup.get_text(' ', strip=True).lower()
          checks = {
              'scholarship section': soup.find(id='scholarships') is not None,
              'official NBFA source': 'need-based-financial-assistance-nbfa' in html,
              'official PGP fee source': 'feestructure' in html,
              'official PGP-HRM fee source': 'pgp-hrm/fee-structure' in html,
              'no automatic high-paying role claim': 'automatically guarantees a high-paying role' not in text,
          }
          for label, ok in checks.items(): print(f'{label}: {"PASS" if ok else "FAIL"}')
          if not all(checks.values()): raise SystemExit('Approved IIM Indore verification failed; refusing to commit.')
          PY

      - name: Commit audit report and approved HTML changes
        if: ${{ inputs.apply_changes == true }}
        run: |
          git config user.name "MBA Portal Content Auditor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-audit-report.json '*.html'
          if git diff --cached --quiet; then
            echo "No report or content changes required."
          else
            git commit -m "Audit and improve approved page content"
            git push
          fi

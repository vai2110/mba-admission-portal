name: Content Relevance Audit

on:
  push:
    paths:
      - '**.html'
      - 'scripts/*.py'
      - '.github/workflows/content-audit.yml'
  workflow_dispatch:
    inputs:
      target_page:
        description: 'HTML filename(s) to audit; comma-separated or blank for all HTML pages'
        required: false
        type: string
        default: ''
      apply_changes:
        description: 'Apply safe automatic editorial improvements'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

# Only audit after relevant pushes or when manually requested. The former
# 15-minute schedule repeatedly edited pages and refreshed trackers.
concurrency:
  group: portal-main-writer
  cancel-in-progress: false

jobs:
  audit-and-update:
    if: ${{ github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4 openpyxl

      - name: Determine pages to process
        id: pages
        env:
          TARGET_PAGE: ${{ inputs.target_page }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET_PAGE" ]; then
            printf '%s\n' "$TARGET_PAGE" | tr ',' '\n' | sed '/^[[:space:]]*$/d' > changed-html.txt
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
              git diff --name-only "$EVENT_BEFORE" "$EVENT_AFTER" -- '*.html' > all-changed-html.txt
            else
              git diff --name-only "$EVENT_AFTER^" "$EVENT_AFTER" -- '*.html' > all-changed-html.txt
            fi
            grep -vE '^(index\.html|404\.html|content-audit\.html|college-page-audit-dashboard\.html|sibm-pune[^/]*\.html)$' all-changed-html.txt | sort -u > changed-html.txt || true
          else
            find . -type f -name '*.html' -not -path './.git/*' \
              -not -name 'index.html' -not -name '404.html' -not -name 'content-audit.html' \
              -not -name 'college-page-audit-dashboard.html' -not -name 'sibm-pune*.html' \
              | sed 's#^./##' | sort > changed-html.txt
          fi
          echo "Pages selected:"
          cat changed-html.txt || true
          if [ -s changed-html.txt ]; then
            echo "has_pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pages=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare answer-first CSS
        if: ${{ steps.pages.outputs.has_pages == 'true' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          CSS='.answer-first{background:#eef6ff;border:1px solid #cfe0f5;border-radius:8px;padding:13px 15px;margin:0 0 14px;color:#173f82}.answer-first strong{display:block;margin-bottom:4px}.answer-first p{margin:0;font-size:13px;color:#334155}'
          pages=[p.strip() for p in Path('changed-html.txt').read_text().splitlines() if p.strip()]
          for name in pages:
              path=Path(name)
              if not path.exists(): continue
              raw=path.read_text(encoding='utf-8')
              if '.answer-first{' not in raw:
                  raw=raw.replace('</style>', CSS+'</style>', 1)
                  path.write_text(raw, encoding='utf-8')
          PY

      - name: Run SEO + AEO + GEO audit fixer
        if: ${{ steps.pages.outputs.has_pages == 'true' && (github.event_name == 'push' || inputs.apply_changes == true) }}
        run: |
          export TARGET_PAGES="$(cat changed-html.txt)"
          python scripts/seo_geo_aeo_audit.py

      - name: Apply locked benchmark UI fixes
        if: ${{ steps.pages.outputs.has_pages == 'true' && (github.event_name == 'push' || inputs.apply_changes == true) }}
        run: |
          export TARGET_PAGES="$(cat changed-html.txt)"
          python scripts/locked_benchmark_ui_audit.py

      - name: Run content audit after SEO/AEO/GEO fixes
        if: ${{ steps.pages.outputs.has_pages == 'true' }}
        run: |
          export TARGET_PAGES="$(cat changed-html.txt)"
          python scripts/free_content_auditor.py

      - name: Verify HTML integrity and hero protection
        if: ${{ steps.pages.outputs.has_pages == 'true' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          excluded = {'index.html','404.html','content-audit.html','college-page-audit-dashboard.html'}
          pages=[p.strip() for p in Path('changed-html.txt').read_text().splitlines() if p.strip()]
          for name in pages:
              path=Path(name)
              if path.name in excluded or not path.exists(): continue
              raw=path.read_text(encoding='utf-8')
              if raw.count('<!DOCTYPE html>')>1 or raw.lower().count('<html')>1:
                  raise SystemExit(f'HTML integrity failed: {name}')
              soup=BeautifulSoup(raw,'html.parser')
              hero=soup.select_one('.hero')
              if hero is not None and hero.select('.notice'):
                  raise SystemExit(f'Hero protection failed: notice found in {name}')
              answer_blocks=soup.select('.answer-first')
              if len(answer_blocks) > 1:
                  raise SystemExit(f'Duplicate Quick Answer blocks found in {name}')
              if answer_blocks and '.answer-first{' not in raw:
                  raise SystemExit(f'Quick Answer styling missing in {name}')
              print(f'Integrity PASS: {name}')
          PY

      - name: Run site-wide technical SEO audit
        run: python scripts/technical_seo_audit.py

      - name: Run site-wide AEO GEO intent audit
        run: python scripts/aeo_geo_intent_audit.py

      - name: Commit automatic HTML improvements
        if: ${{ steps.pages.outputs.has_pages == 'true' && (github.event_name == 'push' || inputs.apply_changes == true) }}
        run: |
          set -e
          git config user.name "MBA Portal Content Auditor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No automatic HTML changes required."
          else
            git commit -m "SEO AEO GEO and locked benchmark UI improvements"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Generate audit dashboard outputs
        if: ${{ steps.pages.outputs.has_pages == 'true' }}
        run: |
          python scripts/update_audit_dashboard.py
          python scripts/update_audit_dashboard_html.py
          python scripts/update_college_production_tracker.py

      - name: Commit live audit dashboard only
        if: ${{ steps.pages.outputs.has_pages == 'true' }}
        run: |
          set -e
          git config user.name "MBA Portal Audit Dashboard"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # This HTML dashboard is a live page; spreadsheets remain artifacts.
          git add college-page-audit-dashboard.html
          if git diff --cached --quiet; then
            echo "Live dashboard is already current."
          else
            git commit -m "Update live college audit dashboard"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-audit-results
          path: |
            content-audit-report.json
            seo-geo-aeo-report.json
            technical-seo-audit.json
            aeo-geo-intent-audit.json
            college-page-audit-dashboard.xlsx
            college-production-tracker.xlsx
          if-no-files-found: ignore

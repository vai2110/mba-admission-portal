name: College Existing Page Audit Queue

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: gemini-3.1-flash-lite
  GOOGLE_SHEET_WEBAPP_URL: ${{ secrets.GOOGLE_SHEET_WEBAPP_URL }}
  GOOGLE_SHEETS_API_SECRET: ${{ secrets.GOOGLE_SHEETS_API_SECRET }}

concurrency:
  group: college-existing-page-audit-pr
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Validate secrets
        run: |
          test -n "$GEMINI_API_KEY" || exit 1
          test -n "$GOOGLE_SHEET_WEBAPP_URL" || exit 1
          test -n "$GOOGLE_SHEETS_API_SECRET" || exit 1
      - name: Audit next pending college
        run: python scripts/college_audit_queue_agent.py
      - name: SEO AEO GEO audit
        run: |
          export TARGET_PAGES="$(cat changed-html.txt)"
          python scripts/seo_geo_aeo_audit.py
      - name: Content audit
        run: |
          export TARGET_PAGES="$(cat changed-html.txt)"
          python scripts/free_content_auditor.py
      - name: Technical SEO audit
        run: python scripts/technical_seo_audit.py
      - name: Validate HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          for name in Path("changed-html.txt").read_text().splitlines():
              name=name.strip()
              if not name: continue
              soup=BeautifulSoup(Path(name).read_text(encoding="utf-8"),"html.parser")
              if len(soup.find_all("h1")) != 1: raise SystemExit("H1 check failed: "+name)
              if not soup.title: raise SystemExit("Title missing: "+name)
              if not soup.find("meta",attrs={"name":"description"}): raise SystemExit("Meta missing: "+name)
          PY
      - name: Propose existing-page improvements for review
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Propose audited existing college page improvements"
          branch: automation/existing-college-page-audit
          delete-branch: true
          add-paths: |
            *.html
          title: "College page audit: review proposed content improvements"
          body: |
            Automated existing-college-page audit proposal.

            This PR is not a production deployment. The queue script marks successful edits as awaiting PR review. Do not mark the page live until this PR is merged and the actual Vercel production URL is verified.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: college-audit-result
          path: |
            college-audit-result.json
            changed-html.txt
            seo-geo-aeo-report.json
            content-audit-report.json
            technical-seo-audit.json
          if-no-files-found: ignore

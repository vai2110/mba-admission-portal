name: Internal Link Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Run internal link audit
        run: python scripts/internal_link_audit.py

      - name: Upload internal link audit report
        uses: actions/upload-artifact@v4
        with:
          name: internal-link-audit-report
          path: internal-link-audit.json


# Phase 3 audit is intentionally read-only against page content.

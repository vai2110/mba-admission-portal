name: Remove IMT Nagpur Duplicate Programme Table

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate programme table
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('imt-nagpur.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<div class="table-wrapper"><table><tr><th>Programme</th><th>Best suited for</th><th>Distinctive focus</th><th>Student guide</th></tr><tr><td>PGDM</td>.*?</table></div>'
          new, n = re.subn(pattern, '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one duplicate programme table, found {n}')
          p.write_text(new, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imt-nagpur.html
          git commit -m "Remove duplicate IMT Nagpur programme table"
          git push
          git rm .github/workflows/remove-imt-overview-duplicate-table.yml
          git commit -m "Remove one-time duplicate table workflow"
          git push

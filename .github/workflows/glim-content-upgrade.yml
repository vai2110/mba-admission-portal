name: Upgrade GLIM Chennai Content

on:
  push:
    paths:
      - '.github/workflows/glim-content-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade GLIM pages
        shell: python
        run: |
          from pathlib import Path
          import re

          files = {
            'glim-chennai.html': {
              'mobile': '<a href="#overview">Overview</a><a href="#why-glim">Why GLIM Chennai?</a><a href="#programmes">Popular Courses</a><a href="#admission">Admission & Eligibility</a><a href="#fees">Fees & Cost</a><a href="#profile">Batch Profile</a><a href="#academics">Academics & Campus</a><a href="#placements">Placements</a><a href="#roi">ROI & Decision Guide</a><a href="#faq">FAQs</a><a href="#links">Official Links</a>',
              'insert_before': '<hr><section class="main-section" id="placements">',
              'sections': '''<section class="main-section" id="why-glim"><h2>Why Consider Great Lakes Chennai?</h2><p>Great Lakes Chennai is not simply a college to evaluate on one placement number. Students should consider its <strong>AACSB and AMBA accreditations, AICTE approval, SAQS and NBA accreditation, industry-linked curriculum, residential format, international partnerships and programme-specific career outcomes</strong>. The Chennai campus is a 30-acre green campus and was the first campus in South Asia to receive LEED Platinum recognition, according to Great Lakes.</p><div class="highlight-grid"><div class="highlight"><strong>37th</strong><span>NIRF Management 2025</span></div><div class="highlight"><strong>30 acres</strong><span>Chennai green campus</span></div><div class="highlight"><strong>16,000+</strong><span>Alumni across 30+ countries</span></div></div><div class="answer-box"><strong>What is Great Lakes particularly known for?</strong><p>The institute's strongest differentiators are its one-year PGPM for experienced professionals, two-year PGDM for freshers/early-career candidates, industry-oriented pedagogy, analytics and AI exposure, international learning opportunities and a strong corporate-facing ecosystem.</p></div></section><hr><section class="main-section" id="profile"><h2>Great Lakes Chennai Batch Profile: Who Actually Studies Here?</h2><p>The cohort matters when deciding a management programme because peer learning, prior work experience and academic diversity affect the classroom experience.</p><div class="table-wrapper"><table><tbody><tr><th>Profile</th><th>Latest published picture</th></tr><tr><td>PGPM Class of 2026</td><td>Average work experience 3.2 years; students come from IT/ITES, BFSI, consulting, e-commerce, manufacturing, automobile, advertising and other sectors.</td></tr><tr><td>PGDM Class of 2027</td><td>64% freshers; 36% have an average 1.5 years of experience; average age 23 years.</td></tr><tr><td>PGDM academic diversity</td><td>Students come from Finance, PR, Psychology, Journalism, Hospitality, IT, Entrepreneurship, Statistics, Mathematics and engineering backgrounds.</td></tr></tbody></table></div><p>This means a student should not assume that the PGDM classroom is made up only of engineers or freshers, or that PGPM is made up only of IT professionals. The published profiles show substantial academic and professional diversity.</p></section><hr><section class="main-section" id="academics"><h2>Academics, International Exposure &amp; Campus Experience</h2><h3>PGDM learning model</h3><p>The two-year PGDM combines core management subjects, a summer internship, electives, experiential learning, Karma Yoga, empirical studies and boardroom simulation. Students can pursue functional depth in areas such as Finance, Marketing, Operations and Analytics and can select major/minor or double-major combinations depending on the programme structure.</p><h3>PGPM learning model</h3><p>The one-year PGPM has seven terms: core courses in the first three terms followed by concentration/elective learning. The current curriculum includes Gen AI, Business Analytics, data storytelling, communication, innovation, leadership and domain labs.</p><h3>International exposure</h3><p>Great Lakes lists short-term immersion opportunities and semester-abroad/academic exchange options with partner institutions including IÉSEG, EDHEC, SKEMA, HHL Leipzig, NUCB, Manchester Metropolitan University, IPAG, Ajman University and others. Availability, eligibility and costs should be checked for the relevant batch.</p><h3>Student life and campus</h3><p>The 30-acre Chennai campus provides a residential environment. Students should budget for the full residential cost rather than comparing only tuition fees because hostel and meal components form a significant part of the published programme fee.</p></section><hr><section class="main-section" id="roi"><h2>Great Lakes Chennai ROI: How a Student Should Evaluate the Cost</h2><p>For the latest published fee structures, PGPM costs ₹23.50 lakh and PGDM costs ₹22.50 lakh for Indian students, including accommodation and specified mandatory charges. Placement outcomes are programme- and batch-specific.</p><div class="table-wrapper"><table><tbody><tr><th>Decision factor</th><th>What to check</th></tr><tr><td>Total investment</td><td>Programme fee + hostel + meals included in the published fee + laptop + travel + personal expenses + financing cost.</td></tr><tr><td>Career outcome</td><td>Average CTC, highest CTC, role mix, industry mix and recruiter quality—not only the highest package.</td></tr><tr><td>Programme fit</td><td>PGPM for experienced professionals; PGDM for freshers/early-career candidates.</td></tr><tr><td>Opportunity cost</td><td>For PGPM, compare one year away from work with the potential career acceleration. For PGDM, compare two years of study and internship exposure with alternative colleges.</td></tr><tr><td>Scholarship</td><td>Check eligibility for merit/diversity scholarships and the Dr. Bala V. Balachandran Merit Scholarship before calculating net cost.</td></tr></tbody></table></div><div class="answer-box"><strong>Bottom line for ROI</strong><p>Do not use a simple “highest package ÷ fee” calculation. A better decision compares the programme-specific average CTC, your likely target role, realistic post-MBA salary, financed cost, prior salary, opportunity cost and career mobility.</p></div></section>'''
            },
            'glim-chennai-pgpm.html': {
              'mobile': '<a href="#overview">Overview</a><a href="#eligibility">Eligibility</a><a href="#admission">Admission & Selection</a><a href="#fees">Fees & Scholarships</a><a href="#profile">Class Profile</a><a href="#curriculum">Curriculum & Specialisations</a><a href="#international">International Exposure</a><a href="#placements">Placements</a><a href="#who">Who Should Choose PGPM?</a><a href="#faq">FAQs</a><a href="#links">Official Links</a>',
              'insert_before': '<hr><section class="main-section" id="placements">',
              'sections': '''<section class="main-section" id="profile"><h2>Great Lakes PGPM Class Profile</h2><p>The PGPM is designed for professionals with meaningful pre-MBA experience, so the peer group is materially different from a conventional two-year fresher-heavy programme.</p><div class="table-wrapper"><table><tbody><tr><th>Profile factor</th><th>Latest published PGPM Class of 2026</th></tr><tr><td>Average work experience</td><td>3.2 years</td></tr><tr><td>Experience range</td><td>24 to 60 months is highlighted in the class profile</td></tr><tr><td>Industries</td><td>IT/ITES, BFSI, consulting, e-commerce, manufacturing, automobile, advertising and others</td></tr><tr><td>Functions</td><td>Sales, marketing, operations, software development/testing, engineering, audit and others</td></tr><tr><td>Companies represented</td><td>Examples include Accenture, Amazon, American Express, Deloitte, EY, IBM, Infosys, TCS, Flipkart, Samsung and others.</td></tr></tbody></table></div><p>The published company list is non-exhaustive. The diversity is relevant if you want peer learning from professionals outside your own industry.</p></section><hr><section class="main-section" id="curriculum"><h2>PGPM Curriculum: What Will You Actually Study?</h2><p>The current PGPM 2.0 structure runs across seven terms. Terms 1-3 focus on core management, while later terms provide concentration and elective depth.</p><div class="table-wrapper"><table><tbody><tr><th>Stage</th><th>Examples of learning</th></tr><tr><td>Terms 1-3</td><td>Economics, accounting, statistics, marketing, operations, finance, strategy, Gen AI and business analytics.</td></tr><tr><td>Terms 4-6</td><td>Concentration courses, international business strategy, ethics &amp; sustainability, leadership and international immersion.</td></tr><tr><td>Term 7</td><td>Boardroom simulation, legal aspects of business, entrepreneurship and general electives.</td></tr><tr><td>Applied learning</td><td>Communication Lab, Making Sense of Data, Storytelling with Data, Innovation Sandbox, Finance Management Lab, Supply Chain Simulation, Product Lab, Business Consulting Lab and GenAI Models Lab.</td></tr></tbody></table></div><h3>PGPM specialisations</h3><p>Students can build depth in Finance, Marketing and Operations and industry-focused areas such as Business Analytics, Data Science, Consulting and Product Management. The current curriculum also includes options such as FinTech, Financial Risk Analytics, AI for Product Managers, NLP, Computer Vision, Predictive Analytics and Business Applications using AI and Analytics.</p></section><hr><section class="main-section" id="international"><h2>PGPM International Exposure &amp; Career Development</h2><p>Great Lakes lists optional international learning opportunities, including a term at IÉSEG School of Management in France and a four-week post-MBA dual-degree pathway with the University of Bordeaux. These are optional opportunities, so students should check eligibility, additional cost and availability for their batch.</p><h3>Faculty mentorship and industry exposure</h3><p>The PGPM includes structured faculty mentorship and regular interaction with CXOs and industry leaders. Great Lakes states that 150+ thought leaders and industry veterans interact with students annually.</p><h3>What should you prepare before joining?</h3><ul><li>Clarify your target role before selecting a concentration.</li><li>Refresh quantitative, Excel/data and business fundamentals if targeting analytics or consulting.</li><li>Prepare a strong career narrative explaining why a one-year programme is appropriate at your experience level.</li><li>Budget for tuition, accommodation, personal expenses and financing before accepting the offer.</li></ul></section>'''
            },
            'glim-chennai-pgdm.html': {
              'mobile': '<a href="#overview">Overview</a><a href="#eligibility">Eligibility</a><a href="#admission">Admission & Selection</a><a href="#fees">Fees & Scholarships</a><a href="#profile">Class Profile</a><a href="#curriculum">Curriculum & Specialisations</a><a href="#internship">Internship & Global Exposure</a><a href="#placements">Placements</a><a href="#who">Who Should Choose PGDM?</a><a href="#faq">FAQs</a><a href="#links">Official Links</a>',
              'insert_before': '<hr><section class="main-section" id="placements">',
              'sections': '''<section class="main-section" id="profile"><h2>Great Lakes PGDM Class Profile</h2><p>The current published Class of 2027 profile shows the type of peer group a prospective student can expect.</p><div class="table-wrapper"><table><tbody><tr><th>Profile factor</th><th>Published Class of 2027</th></tr><tr><td>Freshers</td><td>64%</td></tr><tr><td>Students with work experience</td><td>36%, with an average work experience of 1.5 years</td></tr><tr><td>Average age</td><td>23 years</td></tr><tr><td>Backgrounds</td><td>Finance &amp; BFSI, IT/ITES, Electronics &amp; Communication Engineering, Mechanical Engineering, Science, Economics, Marketing and others</td></tr></tbody></table></div><p>Older published cohorts also show students from PR, Psychology, Journalism, Hospitality, Entrepreneurship, Statistics and Mathematics. The classroom is therefore more diverse than a simple engineering-versus-commerce split.</p></section><hr><section class="main-section" id="curriculum"><h2>PGDM Curriculum: Core Subjects, Electives &amp; AI</h2><p>The two-year curriculum moves from management fundamentals to specialisation, internship and applied learning.</p><div class="table-wrapper"><table><tbody><tr><th>Stage</th><th>What students study</th></tr><tr><td>Trimester 1</td><td>Business Statistics, Communication, Data Visualization, Financial Accounting, Marketing, Microeconomics, Operations and Organisational Behaviour.</td></tr><tr><td>Trimester 2</td><td>Business Research, Financial Management, IT for Managers, Macroeconomics, Marketing, Optimisation, Organisational Behaviour and Python Workshop.</td></tr><tr><td>Trimester 3</td><td>AI for Managers, Business Analytics, Ethics &amp; Sustainability, Business Storytelling, Finance, HR, Law &amp; Taxation, Design Thinking and Strategy.</td></tr><tr><td>Trimester 4</td><td>Summer internship, ERP, International Business Strategy and specialisation electives.</td></tr><tr><td>Trimesters 5-6</td><td>Specialisation/general electives, entrepreneurial mindset, boardroom simulation and empirical studies.</td></tr></tbody></table></div><h3>Specialisation choices</h3><p>Great Lakes currently highlights functional options in Finance, Marketing, Operations and Analytics. The elective basket also includes areas such as Agentic AI, Generative AI for Management, Deep Learning, Marketing Analytics, Strategy Consulting, Digital Transformation, Supply Chain Management and Product-related subjects.</p></section><hr><section class="main-section" id="internship"><h2>PGDM Internship, International Exposure &amp; Experiential Learning</h2><h3>Summer internship</h3><p>The PGDM includes a structured summer internship. Great Lakes describes it as a rigorous 12-week internship and uses it as an important bridge between classroom learning and final placement.</p><h3>Experiential learning</h3><ul><li><strong>Karma Yoga:</strong> social leadership and real-world problem solving.</li><li><strong>Empirical Study:</strong> applied business research under faculty/business leadership.</li><li><strong>Boardroom Simulation:</strong> decision-making under realistic business conditions.</li><li><strong>Business Storytelling and analytics:</strong> practical communication and data interpretation.</li></ul><h3>International opportunities</h3><p>Students can explore short-term immersions and exchange/semester-abroad opportunities with partner schools including IÉSEG, Bologna Business School, Pace University, EDHEC, SKEMA, HHL Leipzig, NUCB, Manchester Metropolitan University, IPAG and others. These opportunities are subject to programme rules and availability.</p></section>'''
            },
            'glim-chennai-placements.html': {
              'mobile': '<a href="#overview">Placement Overview</a><a href="#comparison">PGPM vs PGDM</a><a href="#pgpm">PGPM 2026 Detailed Outcomes</a><a href="#pgdm">PGDM 2025 Detailed Outcomes</a><a href="#roles">Roles & Sectors</a><a href="#recruiters">Recruiters</a><a href="#internships">Internships & PPOs</a><a href="#interpretation">How to Read the Data</a><a href="#faq">FAQs</a><a href="#links">Official Links</a>',
              'insert_before': '<hr><section class="main-section" id="faq">',
              'sections': '''<section class="main-section" id="pgpm"><h2>PGPM 2026 Placement Outcomes in Detail</h2><p>The latest official PGPM report is for the Class of 2026. It reports an average CTC of <strong>₹18.1 LPA</strong> and highest domestic CTC of <strong>₹43 LPA</strong>.</p><div class="table-wrapper"><table><tbody><tr><th>Functional area</th><th>Share of offers</th></tr><tr><td>Business Consulting</td><td>37%</td></tr><tr><td>Strategy Consulting</td><td>9%</td></tr><tr><td>Operations</td><td>9%</td></tr><tr><td>Tech Consulting</td><td>8%</td></tr><tr><td>Analytics</td><td>8%</td></tr><tr><td>Marketing/Sales</td><td>8%</td></tr><tr><td>General Management</td><td>6%</td></tr><tr><td>Product Management</td><td>4%</td></tr><tr><td>Others</td><td>11%</td></tr></tbody></table></div><div class="table-wrapper"><table><tbody><tr><th>Industry</th><th>Share of offers</th></tr><tr><td>Tech Consulting</td><td>32%</td></tr><tr><td>Business Consulting</td><td>14%</td></tr><tr><td>Technology &amp; Product</td><td>13%</td></tr><tr><td>IT/ITES</td><td>10%</td></tr><tr><td>Strategy Consulting</td><td>7%</td></tr><tr><td>Analytics Consulting</td><td>5%</td></tr><tr><td>Healthcare</td><td>4%</td></tr><tr><td>Others</td><td>15%</td></tr></tbody></table></div></section><hr><section class="main-section" id="pgdm"><h2>PGDM 2025 Placement Outcomes in Detail</h2><p>The latest completed PGDM report currently published by Great Lakes is for the Class of 2025. It reports <strong>₹15 LPA average CTC</strong> and <strong>₹39.3 LPA highest domestic CTC</strong>.</p><div class="table-wrapper"><table><tbody><tr><th>Functional area</th><th>Share of offers</th></tr><tr><td>Finance</td><td>33%</td></tr><tr><td>Sales &amp; Marketing</td><td>32%</td></tr><tr><td>Tech Consulting</td><td>12%</td></tr><tr><td>Operations</td><td>11%</td></tr><tr><td>Analytics / Business &amp; Strategy Consulting / Market Research / Product</td><td>Remaining offers</td></tr></tbody></table></div><div class="table-wrapper"><table><tbody><tr><th>Industry</th><th>Share of offers</th></tr><tr><td>BFSI/NBFC</td><td>27%</td></tr><tr><td>IT/ITeS</td><td>22%</td></tr><tr><td>Consulting</td><td>16%</td></tr><tr><td>Financial Services</td><td>9%</td></tr><tr><td>Other sectors</td><td>FMCG/Retail, manufacturing, healthcare, aerospace, telecom, fintech, analytics and e-commerce</td></tr></tbody></table></div></section><hr><section class="main-section" id="internships"><h2>Internships, PPOs &amp; the Link to Final Placements</h2><p>For PGDM Class of 2025, Great Lakes reports <strong>63 students received PPOs</strong> after summer internships. This makes internship performance an important part of the two-year programme's career journey.</p><p>The institute's placement process also shows separate hiring cycles for summer internships and final placements. Students should therefore evaluate both internship quality and final placement outcomes when judging the PGDM.</p><div class="answer-box"><strong>Does a summer internship guarantee a PPO?</strong><p>No. A PPO is an offer made by a recruiter to an eligible intern; the published figure describes the past cohort and is not a guarantee for future students.</p></div></section>'''
            }
          }

          for name, cfg in files.items():
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              # Update mobile navigation without changing the reference CSS.
              text=re.sub(r'(<div class="mobile-on-page"><details><summary>On this page</summary>).*?(</details></div>)', lambda m: m.group(1)+cfg['mobile']+m.group(2), text, count=1, flags=re.S)
              # Insert research-depth sections only if they are not already present.
              marker=cfg['insert_before']
              if 'id="profile"' not in text and name != 'glim-chennai-placements.html':
                  text=text.replace(marker, cfg['sections']+marker, 1)
              elif name == 'glim-chennai-placements.html' and 'id="pgpm"' not in text:
                  text=text.replace(marker, cfg['sections']+marker, 1)
              # Strengthen the overview with a decision-oriented note.
              if name == 'glim-chennai.html' and 'class="glim-research-note"' not in text:
                  note='<div class="answer-box glim-research-note"><strong>Before you decide on Great Lakes Chennai</strong><p>Use this page as the college-level starting point, then compare the dedicated PGPM and PGDM pages for programme-specific eligibility, fee, curriculum, class profile and placement outcomes. The figures are kept programme- and batch-specific so that PGPM results are not mistakenly treated as PGDM results.</p></div>'
                  text=text.replace('</section><hr><section class="main-section" id="why-glim">', note+'</section><hr><section class="main-section" id="why-glim">', 1)
              p.write_text(text, encoding='utf-8')

          # Commit the four modified pages.
          import subprocess
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','glim-chennai.html','glim-chennai-pgpm.html','glim-chennai-pgdm.html','glim-chennai-placements.html'],check=True)
          r=subprocess.run(['git','commit','-m','Deepen GLIM Chennai student research content'],capture_output=True,text=True)
          if r.returncode==0:
              subprocess.run(['git','push'],check=True)
          else:
              print('No page changes needed:',r.stdout,r.stderr)

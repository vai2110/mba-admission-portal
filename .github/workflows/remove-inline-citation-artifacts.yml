name: Remove Inline Citation Artifacts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove citation UI artifacts from HTML
        shell: python
        run: |
          import os, re

          changed = []
          pattern = re.compile(r'\s*cite[^]*')

          for base, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              for name in files:
                  if not name.lower().endswith('.html'):
                      continue
                  path = os.path.join(base, name)
                  with open(path, encoding='utf-8') as f:
                      text = f.read()
                  cleaned = pattern.sub('', text)
                  if cleaned != text:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(cleaned)
                      changed.append(path)

          print('Cleaned:', changed)

      - name: Commit cleaned HTML
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No citation artifacts found.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Remove inline citation artifacts from portal pages'
          git push

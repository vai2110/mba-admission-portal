name: Update IIM Sambalpur pages
on:
  push:
    paths:
      - '.github/workflows/update-iim-sambalpur.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update IIM Sambalpur pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def section(html, sid, new):
              pat = rf'<section class="main-section" id="{sid}">.*?</section>'
              return re.sub(pat, new, html, count=1, flags=re.S)

          # MBA page: detailed cutoff, fees, and placement trend data.
          p=Path('iim-sambalpur-mba.html'); h=p.read_text()
          h=h.replace('<span class="quick-fact-label">Entrance</span><span class="quick-fact-value">CAT</span>', '<span class="quick-fact-label">Total fee 2026-28</span><span class="quick-fact-value">₹21.13 lakh</span>')
          h=section(h,'admission','''<section class="main-section" id="admission"><h2>IIM Sambalpur CAT Cutoff: Minimum vs Actual Competitive Target</h2><p>The 2026-28 MBA policy publishes minimum overall CAT percentiles for Stage-1 consideration. These are <strong>minimum eligibility/shortlisting thresholds, not guaranteed PI calls or admission cutoffs</strong>.</p><h3>Official minimum CAT cutoff</h3><div class="table-wrapper"><table><tr><th>Category</th><th>Minimum overall percentile</th><th>Condition</th></tr><tr><td>General</td><td>90*</td><td>*85 for all female candidates and male candidates with at least 1 year relevant work experience</td></tr><tr><td>EWS</td><td>80</td><td>Minimum published threshold</td></tr><tr><td>NC-OBC</td><td>75</td><td>Minimum published threshold</td></tr><tr><td>SC</td><td>55</td><td>Minimum published threshold</td></tr><tr><td>ST</td><td>40</td><td>Minimum published threshold</td></tr><tr><td>DAP</td><td>40</td><td>Minimum published threshold</td></tr></table></div><h3>Minimum cutoff vs practical target</h3><div class="two-column"><div class="pro-box"><h3>Official minimum</h3><p>The published threshold is the minimum for Stage-1 consideration when the policy conditions are met. It does not mean that a candidate at exactly that percentile will receive a PI call or final offer.</p></div><div class="warning-box"><h3>Practical planning target</h3><p>For General-category applicants, <strong>95+ percentile is a sensible safer planning target</strong>. This is an indicative target for preparation, not an official guaranteed cutoff. Actual shortlisting can change with the applicant pool and policy.</p></div></div><p>Historical/third-party trackers have reported General-category shortlist levels in the low-to-mid 90s in some cycles. Treat those numbers only as planning context; the current IIM Sambalpur policy remains the controlling source.</p><h3>Admission stages</h3><div class="table-wrapper"><table><tr><th>Stage</th><th>What happens</th></tr><tr><td>Stage 1</td><td>CAT-based eligibility/shortlisting using the published minimum overall percentile and positive raw scores in all CAT sections.</td></tr><tr><td>Stage 2</td><td>Pre-PI score out of 75 using CAT, Class X, XII, graduation, work experience and gender diversity.</td></tr><tr><td>Stage 3</td><td>Personal Interview contributes 25 marks to final merit.</td></tr></table></div></section>''')
          h=section(h,'fees','''<section class="main-section" id="fees"><h2>IIM Sambalpur MBA Fees 2026-28: Complete Breakup</h2><p>The reported two-year MBA fee for the 2026-28 batch is <strong>₹21.13 lakh</strong>. Students should not treat ₹18.50 lakh tuition as the full cost because the published structure also contains other programme charges, mess-related charges and a refundable caution deposit.</p><div class="table-wrapper"><table><tr><th>Fee component</th><th>Year 1</th><th>Year 2</th><th>2-year total</th></tr><tr><td>Tuition / course fee</td><td>₹9.25 lakh</td><td>₹9.25 lakh</td><td>₹18.50 lakh</td></tr><tr><td>Other programme charges</td><td>₹50,000</td><td>₹55,000</td><td>₹1.05 lakh</td></tr><tr><td>Mess deposit / charges</td><td>₹69,000</td><td>₹69,000</td><td>₹1.38 lakh</td></tr><tr><td>Refundable caution deposit</td><td>₹20,000</td><td>—</td><td>₹20,000</td></tr><tr><td><strong>Total</strong></td><td><strong>₹10.64 lakh</strong></td><td><strong>₹10.49 lakh</strong></td><td><strong>₹21.13 lakh</strong></td></tr></table></div><h3>What is included and what should you budget separately?</h3><div class="table-wrapper"><table><tr><th>Included / payable through fee structure</th><th>Budget separately</th></tr><tr><td>Tuition/course instruction, career-development related charges, SAC/student activity and alumni-related charges, mess charges/deposit and refundable caution deposit as specified.</td><td>Personal expenses, laptop/devices, travel, discretionary spending and any item not specified in the official fee document.</td></tr></table></div><div class="answer-box"><strong>Offer-acceptance amount</strong><p>The 2026-28 admission policy states that the offer-acceptance amount is adjusted against Term-1 fees, so it should not be counted as a second charge over the programme fee.</p></div></section>''')
          h=section(h,'placements','''<section class="main-section" id="placements"><h2>IIM Sambalpur MBA Placements: Year-wise Statistics</h2><p>Looking at several placement cycles is more useful than judging the MBA only by its latest highest package.</p><div class="table-wrapper"><table><tr><th>Batch</th><th>Highest CTC</th><th>Average CTC</th><th>Median CTC</th><th>Other official indicator</th></tr><tr><td>2023-25</td><td>₹48.60 LPA</td><td>₹15.65 LPA</td><td>₹15.03 LPA</td><td>216 companies; 16% PPOs</td></tr><tr><td>2022-24</td><td>₹23.50 LPA</td><td>₹14.21 LPA</td><td>—</td><td>Top 25% average ₹18.71 LPA</td></tr><tr><td>2021-23</td><td>₹64.61 LPA domestic</td><td>₹16.64 LPA</td><td>₹16.00 LPA</td><td>130+ companies; top 10% average ₹31.69 LPA</td></tr><tr><td>2020-22</td><td>₹30 LPA domestic / ₹41 LPA international</td><td>₹13.20 LPA</td><td>₹12.42 LPA</td><td>Top 25% ₹18.42 LPA</td></tr><tr><td>2019-21</td><td>₹26.40 LPA</td><td>—</td><td>—</td><td>Top 25% ₹14.91 LPA</td></tr><tr><td>2018-20</td><td>₹18.92 LPA</td><td>₹10.87 LPA</td><td>₹10.50 LPA</td><td>100+ companies</td></tr></table></div><div class="answer-box"><strong>How should students read this?</strong><p>The ₹64.61 LPA 2021-23 highest offer was an outlier and should not be treated as a typical salary. The latest average and median figures are more useful for ROI, while domain-wise roles matter when evaluating a specific career goal.</p></div><a class="programme-link" href="iim-sambalpur-placements.html">Read the detailed placement analysis →</a></section>''')
          p.write_text(h)

          # MBA-BA page: detailed cutoff, fee context and comparison with regular MBA.
          p=Path('iim-sambalpur-mba-ba.html'); h=p.read_text()
          h=h.replace('<span class="quick-fact-label">Core focus</span><span class="quick-fact-value">Business Analytics</span>', '<span class="quick-fact-label">Reported total fee</span><span class="quick-fact-value">₹17.80 lakh*</span>')
          h=section(h,'admission','''<section class="main-section" id="admission"><h2>IIM Sambalpur MBA-BA CAT Cutoff: Minimum vs Practical Target</h2><p>The MBA-BA 2026-28 policy publishes minimum overall CAT percentiles for Stage-1 consideration. Meeting the minimum does not guarantee a PI call or admission.</p><h3>Official minimum CAT cutoff</h3><div class="table-wrapper"><table><tr><th>Category</th><th>Minimum overall percentile</th></tr><tr><td>General</td><td>85</td></tr><tr><td>EWS</td><td>80</td></tr><tr><td>NC-OBC</td><td>75</td></tr><tr><td>SC</td><td>55</td></tr><tr><td>ST</td><td>40</td></tr><tr><td>DAP</td><td>40</td></tr></table></div><div class="two-column"><div class="pro-box"><h3>Minimum requirement</h3><p>These are the institute's published Stage-1 thresholds. Candidates also need to satisfy the programme's academic and work-experience conditions.</p></div><div class="warning-box"><h3>Actual competitive target</h3><p>IIM Sambalpur does not publish a guaranteed 'safe' CAT percentile. For planning, candidates should aim materially above the minimum, especially because final merit also includes academics, work experience, gender diversity, engineering degree and PI.</p></div></div><h3>Selection weightage</h3><div class="table-wrapper"><table><tr><th>Component</th><th>Weight</th></tr><tr><td>CAT score</td><td>40</td></tr><tr><td>Class X</td><td>1</td></tr><tr><td>Class XII</td><td>2</td></tr><tr><td>Graduation</td><td>2</td></tr><tr><td>Work Experience</td><td>20</td></tr><tr><td>Gender Diversity</td><td>5</td></tr><tr><td>Engineering Degree</td><td>5</td></tr><tr><td>Personal Interview</td><td>25</td></tr><tr><td><strong>Total</strong></td><td><strong>100</strong></td></tr></table></div></section>''')
          h=section(h,'fees','''<section class="main-section" id="fees"><h2>IIM Sambalpur MBA-BA Fees and Cost Planning</h2><p>Third-party fee listings currently report approximately <strong>₹17.80 lakh</strong> for the two-year MBA-BA. Because IIM Sambalpur publishes a separate 2026-28 fee PDF, students should use the institute's latest document as the final authority before making a payment.</p><div class="table-wrapper"><table><tr><th>Cost area</th><th>Student interpretation</th></tr><tr><td>IIM Sambalpur programme fee</td><td>Core two-year MBA-BA programme charges; verify the latest official 2026-28 fee PDF for the exact term-wise breakup.</td></tr><tr><td>Mess / accommodation / deposits</td><td>Check whether each component is included, charged separately or refundable in the current fee structure.</td></tr><tr><td>AIT Thailand dual-degree route</td><td>Any international tuition, travel, accommodation and living expenses associated with the optional dual-degree pathway should be budgeted separately unless explicitly included.</td></tr><tr><td>Personal expenses</td><td>Laptop, travel, discretionary spending and other personal costs are additional.</td></tr></table></div><div class="answer-box"><strong>Important fee note</strong><p>Do not use the regular MBA's ₹21.13 lakh fee as the MBA-BA fee. The institute publishes separate fee structures for the two programmes.</p></div></section>''')
          h=section(h,'placements','''<section class="main-section" id="placements"><h2>IIM Sambalpur MBA-BA Placements: What Students Can Reliably Use</h2><p>MBA-BA is a newer programme, so the institute's published final placement report should not be presented as a dedicated MBA-BA placement report unless the institute explicitly identifies the cohort. The latest published final placement figures are for the flagship MBA.</p><div class="table-wrapper"><table><tr><th>Placement metric</th><th>Latest institute-level MBA figure</th><th>How MBA-BA applicants should use it</th></tr><tr><td>Highest CTC</td><td>₹48.60 LPA</td><td>Institute-level benchmark, not an MBA-BA guarantee</td></tr><tr><td>Average CTC</td><td>₹15.65 LPA</td><td>Useful context, not programme-specific</td></tr><tr><td>Median CTC</td><td>₹15.03 LPA</td><td>Better central tendency indicator than highest package</td></tr><tr><td>Companies</td><td>216</td><td>Shows breadth of the latest MBA placement season</td></tr></table></div><div class="answer-box"><strong>What should MBA-BA students check?</strong><p>Look for programme-specific analytics, product, consulting and technology roles; recruiter eligibility; internship access; median CTC; role location; and the percentage of the cohort entering analytics-related functions. Do not assume that every MBA placement recruiter is available to MBA-BA.</p></div><a class="programme-link" href="iim-sambalpur-placements.html">Read the detailed institute placement analysis →</a></section>''')
          p.write_text(h)

          # Placement page: replace the content with a more detailed student-first analysis.
          p=Path('iim-sambalpur-placements.html'); h=p.read_text()
          main='''<main class="content"><section class="main-section" id="latest"><h2>IIM Sambalpur Placements: Latest Official Data</h2><p>The latest final placement report published by IIM Sambalpur for the MBA 2023-25 batch reports <strong>₹48.60 LPA highest CTC</strong>, <strong>₹15.65 LPA average CTC</strong> and <strong>₹15.03 LPA median CTC</strong>. A total of 216 companies participated, including 144 new companies.</p><div class="highlight-grid"><div class="highlight"><strong>₹48.60 LPA</strong><span>Highest CTC</span></div><div class="highlight"><strong>₹15.65 LPA</strong><span>Average CTC</span></div><div class="highlight"><strong>₹15.03 LPA</strong><span>Median CTC</span></div></div><div class="table-wrapper"><table><tr><th>Latest placement indicator</th><th>Figure</th></tr><tr><td>Total companies</td><td>216</td></tr><tr><td>New companies</td><td>144</td></tr><tr><td>PPO share</td><td>16%</td></tr><tr><td>Highest CTC increase</td><td>106.81%</td></tr><tr><td>Average CTC increase</td><td>10.12%</td></tr><tr><td>Median CTC increase</td><td>14.27%</td></tr></table></div></section><hr><section class="main-section" id="salary"><h2>Average vs Median vs Highest Package</h2><p>Students should not judge the placement season only by its highest package. The average and median provide a much better starting point for an ROI decision.</p><div class="table-wrapper"><table><tr><th>Batch segment</th><th>Average CTC</th><th>Median CTC</th></tr><tr><td>Top 10%</td><td>₹27.28 LPA</td><td>₹25.00 LPA</td></tr><tr><td>Top 25%</td><td>₹21.81 LPA</td><td>₹19.90 LPA</td></tr><tr><td>Top 50%</td><td>₹19.36 LPA</td><td>₹18.83 LPA</td></tr><tr><td>Top 75%</td><td>₹17.10 LPA</td><td>₹15.65 LPA</td></tr><tr><td>Overall</td><td>₹15.65 LPA</td><td>₹15.03 LPA</td></tr></table></div><div class="answer-box"><strong>Why is median important?</strong><p>Median CTC reduces the impact of a few unusually high offers. For a student deciding whether the ₹21.13 lakh MBA cost is worthwhile, the median and role quality are more useful than the ₹48.60 LPA headline alone.</p></div></section><hr><section class="main-section" id="domains"><h2>Domain-wise Placement Outcomes</h2><div class="table-wrapper"><table><tr><th>Domain</th><th>Share</th><th>Highest CTC</th><th>Average CTC</th></tr><tr><td>General Management</td><td>28%</td><td>—</td><td>—</td></tr><tr><td>Finance</td><td>17%</td><td>₹32.95 LPA</td><td>₹15.64 LPA</td></tr><tr><td>Sales & Marketing</td><td>14%</td><td>—</td><td>—</td></tr><tr><td>IT</td><td>11%</td><td>₹22.14 LPA</td><td>₹15.97 LPA</td></tr><tr><td>Consulting</td><td>12%</td><td>—</td><td>—</td></tr><tr><td>Product Management</td><td>9%</td><td>₹22.73 LPA</td><td>₹16.17 LPA</td></tr><tr><td>Human Resource</td><td>5%</td><td>₹25.00 LPA</td><td>₹16.45 LPA</td></tr><tr><td>Operations</td><td>4%</td><td>₹31.12 LPA</td><td>₹17.42 LPA</td></tr></table></div><p>This distribution is especially useful for students who already know their target function. For example, finance, IT, product, HR and operations have separately reported average/highest CTC figures, while general management is the largest domain by share.</p></section><hr><section class="main-section" id="recruiters"><h2>Recruiters, Sectors and Roles</h2><div class="table-wrapper"><table><tr><th>Hiring area</th><th>Examples reported by the institute</th><th>Typical role families</th></tr><tr><td>BFSI / Finance</td><td>Axis Bank, ICICI Bank, SBI Capital Market, Tata Capital, Bajaj Allianz Life</td><td>Credit, finance, relationship, investment and business roles</td></tr><tr><td>IT / Analytics</td><td>Accenture Technology, Capgemini, Cognizant, Gartner, Infosys Consulting, Micron</td><td>Business analyst, technology consulting, analytics and transformation</td></tr><tr><td>Consulting</td><td>Deloitte USI, Infosys Consulting and other consulting recruiters</td><td>Consulting, advisory and business analysis</td></tr><tr><td>Consumer / Retail</td><td>Bigbasket, Dabur and other consumer businesses</td><td>Sales, marketing, category and general management</td></tr><tr><td>Manufacturing / Industrial</td><td>Bharat Forge, Bosch, Vedanta and others</td><td>Operations, supply chain, project and general management</td></tr></table></div><p>Recruiter presence does not mean every student is eligible for every role. Students should check role, location, CTC structure, eligibility and function before using a recruiter list to judge career fit.</p></section><hr><section class="main-section" id="summer"><h2>Summer Placements and Internship Outcomes</h2><p>The institute's summer placement reports show strong participation across sales & marketing, general management, operations, finance, HR, product and technology-related roles.</p><div class="table-wrapper"><table><tr><th>Summer indicator</th><th>Reported figure</th></tr><tr><td>2022-24 batch size</td><td>193 students; 100% placement reported</td></tr><tr><td>2022-24 average stipend</td><td>₹65,382</td></tr><tr><td>2022-24 median stipend</td><td>₹40,000</td></tr><tr><td>2022-24 highest stipend</td><td>₹2,00,000</td></tr><tr><td>2022-24 top 25% average stipend</td><td>₹1,35,270</td></tr><tr><td>Largest domain</td><td>Sales & Marketing — 49.14%</td></tr></table></div><div class="answer-box"><strong>Why summer placements matter</strong><p>The internship is often the first real test of a student's intended career function. Students should compare internship role quality and PPO opportunities, not just stipend.</p></div></section><hr><section class="main-section" id="roles"><h2>What Do IIM Sambalpur Students Get Hired For?</h2><div class="two-column"><div class="pro-box"><h3>Strong career pathways</h3><ul><li>General management and leadership-track roles</li><li>Finance and BFSI</li><li>Consulting and business analysis</li><li>IT, analytics and technology consulting</li><li>Product management</li><li>Sales, marketing and customer roles</li><li>Operations and HR</li></ul></div><div class="warning-box"><h3>What the placement data does not tell you</h3><ul><li>It does not guarantee a specific role for an individual student.</li><li>Highest CTC is not the typical salary.</li><li>Recruiter count does not equal offer count.</li><li>Domain share does not reveal the seniority or location of every role.</li></ul></div></div></section><hr><section class="main-section" id="comparison"><h2>IIM Sambalpur Placement Comparison: What Students Should Compare</h2><div class="table-wrapper"><table><tr><th>Metric</th><th>Why it matters</th><th>Latest IIM Sambalpur figure</th></tr><tr><td>Highest CTC</td><td>Shows the top end but can be an outlier</td><td>₹48.60 LPA</td></tr><tr><td>Average CTC</td><td>Useful overall salary benchmark</td><td>₹15.65 LPA</td></tr><tr><td>Median CTC</td><td>Shows the middle of the cohort</td><td>₹15.03 LPA</td></tr><tr><td>Companies</td><td>Indicates breadth of hiring participation</td><td>216</td></tr><tr><td>New companies</td><td>Indicates expansion of recruiter pool</td><td>144</td></tr><tr><td>PPO share</td><td>Shows internship-to-job conversion context</td><td>16%</td></tr></table></div></section><hr><section class="main-section" id="mba-ba"><h2>MBA vs MBA-BA: Placement Interpretation</h2><div class="table-wrapper"><table><tr><th>Factor</th><th>Regular MBA</th><th>MBA-BA</th></tr><tr><td>Placement evidence</td><td>Established final-placement history</td><td>Dedicated MBA-BA placement history is still developing</td></tr><tr><td>Best for</td><td>Broad management careers</td><td>Analytics/data/technology-oriented management</td></tr><tr><td>How to read current placement data</td><td>Use the latest MBA report directly</td><td>Use MBA report only as institute-level context; verify MBA-BA-specific eligibility and roles</td></tr></table></div><div class="answer-box"><strong>Important for MBA-BA applicants</strong><p>Do not assume that the ₹48.60 LPA, ₹15.65 LPA average or 216-company figure is a guaranteed MBA-BA outcome. Check programme-specific recruiter access and role eligibility before enrolling.</p></div></section><hr><section class="main-section" id="faq"><h2>IIM Sambalpur Placements FAQs</h2><div class="faq-item accordion"><h3>What is the highest package at IIM Sambalpur?</h3><p>The latest official final placement report for the MBA 2023-25 batch records ₹48.60 LPA.</p></div><div class="faq-item accordion"><h3>What is the average package at IIM Sambalpur?</h3><p>The latest official final placement report records ₹15.65 LPA average CTC.</p></div><div class="faq-item accordion"><h3>What is the median package at IIM Sambalpur?</h3><p>The latest official final placement report records ₹15.03 LPA median CTC.</p></div><div class="faq-item accordion"><h3>How many companies visited IIM Sambalpur?</h3><p>The 2023-25 final placement report records 216 companies, including 144 new companies.</p></div><div class="faq-item accordion"><h3>Which sectors recruit from IIM Sambalpur?</h3><p>Recruiters span BFSI, finance, IT and analytics, consulting, general management, sales and marketing, product management, manufacturing, operations and consumer sectors.</p></div><div class="faq-item accordion"><h3>Is the highest package the typical salary?</h3><p>No. Students should use average and median CTC, domain distribution and role quality to understand likely outcomes.</p></div></section><hr><section class="main-section" id="links"><h2>Official IIM Sambalpur Placement Links</h2><div class="official-links"><a class="official-link" href="https://iimsambalpur.ac.in/final-placement/" target="_blank" rel="noopener">Final Placement Reports →</a><a class="official-link" href="https://iimsambalpur.ac.in/placement-brochure/" target="_blank" rel="noopener">Placement Brochures →</a><a class="official-link" href="https://iimsambalpur.ac.in/summer-placement/" target="_blank" rel="noopener">Summer Placements →</a><a class="official-link" href="https://iimsambalpur.ac.in/mba-new/" target="_blank" rel="noopener">MBA Programme →</a></div></section></main>'''
          h=re.sub(r'<main class="content">.*?</main>',main,h,count=1,flags=re.S)
          h=h.replace('href="#roles"','href="#roles"')
          # Add comparison to both desktop/mobile on-page navigation.
          h=h.replace('<a href="#roles">Roles & Career Interpretation</a>', '<a href="#roles">Roles & Career Interpretation</a><a href="#comparison">Placement Comparison</a>')
          p.write_text(h)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iim-sambalpur-mba.html iim-sambalpur-mba-ba.html iim-sambalpur-placements.html
          git diff --cached --quiet || git commit -m 'Expand IIM Sambalpur fees cutoffs and placements'
          git push

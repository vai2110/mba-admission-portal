name: College Production Queue

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: gemini-3.1-flash-lite

concurrency:
  group: college-production-main
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production dependencies
        run: pip install beautifulsoup4 openpyxl pypdf
      - name: Check free AI production credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::GEMINI_API_KEY is not available."; exit 1; fi
      - name: Apply popular-name SEO rules
        run: python scripts/apply_popular_name_rules.py
      - name: Reconcile production tracker
        run: python scripts/update_college_production_tracker.py
      - name: Commit tracker reconciliation
        run: |
          git config user.name "MBA Portal College Production"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-production-tracker.xlsx college-production-tracker.csv data/college-production-state.json
          if git diff --cached --quiet; then echo "No tracker/state changes."; else git commit -m "Update college production queue status"; git push; fi

name: URL Architecture Unit Tests

on:
  push:
    branches:
      - seo/url-architecture-migration
  pull_request:
    branches:
      - main

jobs:
  url-architecture-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run URL architecture audit helper tests
        run: node scripts/audit-url-architecture.test.js
      - name: Run public route path helper tests
        run: node scripts/public-route-from-html-path.test.js
      - name: Run allowlisted nested normalization collection tests
        run: node scripts/collect-public-html-for-normalization.test.js
      - name: Run URL migration manifest validator tests
        run: node scripts/validate-url-migration-map.test.js
      - name: Run IIM Ahmedabad migration preview route checks
        run: node scripts/iima-url-migration-preview.test.js
      - name: Run verified route sample checks
        run: node scripts/verified-route-samples.test.js
      - name: Run verified route entity alignment guard
        run: node scripts/verified-route-entity-guard.test.js
      - name: Run nested-aware internal-link audit unit tests
        run: python scripts/internal_link_audit_test.py
      - name: Run published CMS route validation tests
        run: node scripts/cms-profile-route.test.js
      - name: Normalize clean URLs before link audit
        run: node scripts/normalize-clean-urls.js
      - name: Generate news routes before link audit
        run: node scripts/build-news.js
      - name: Run repository internal-link audit report
        run: python scripts/internal_link_audit.py
      - name: Fail if broken or redirecting internal links remain
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("internal-link-audit.json").read_text(encoding="utf-8"))["summary"]
          print("INTERNAL LINK CI GATE:", summary["broken_local_links"], "broken;", summary["redirecting_internal_links"], "redirecting")
          if summary["broken_local_links"] or summary["redirecting_internal_links"]:
              raise SystemExit("INTERNAL LINK CI GATE FAILED")
          PY

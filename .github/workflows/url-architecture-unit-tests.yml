name: URL Architecture Unit Tests

on:
  push:
    branches:
      - seo/url-architecture-migration
  pull_request:
    branches:
      - main

jobs:
  url-architecture-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run URL architecture helper tests
        run: node scripts/audit-url-architecture.test.js

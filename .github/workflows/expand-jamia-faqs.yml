name: Expand Jamia Hamdard FAQs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  expand-faqs:
    if: contains(github.event.head_commit.message, 'Expand Jamia Hamdard FAQs') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Jamia Hamdard FAQ sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          faqs = {
            'jamia-hamdard-admission-2026.html': '''<section class="main-section" id="faq"><h2>Jamia Hamdard Admission 2026 FAQs: 12 Questions Students Search</h2>
          <details class="accordion"><summary>Is Jamia Hamdard admission open for 2026-27?</summary><div class="faq-answer"><p>Yes. The university's current admission notices state that applications for <strong>UG and PG programmes are live</strong>. The 2026 notice page also lists programme-specific updates for MBA GD/PI, NEET-based UG admissions, MPT/MOT entrance tests, PhD and other programmes. Because deadlines differ by course and round, students should follow the latest programme notice rather than assume one common deadline.</p></div></details>
          <details class="accordion"><summary>How can I apply for Jamia Hamdard admission 2026?</summary><div class="faq-answer"><p>Apply through the official <strong>Jamia Hamdard admission portal</strong>. Select the programme, read the 2026-27 eligibility and selection conditions, complete the application, upload the required documents and pay the applicable fee. After submission, monitor the university's admission notices and selection-list updates. The university says admission confirmation is communicated by the JH Admission Cell.</p></div></details>
          <details class="accordion"><summary>Which entrance exams are accepted by Jamia Hamdard?</summary><div class="faq-answer"><p>There is no single entrance exam for the whole university. Depending on the programme, the published admission framework has used <strong>CUET, NEET-UG, JEE Main and CLAT</strong>, while other programmes can use qualifying-exam merit, university entrance tests, interviews or another approved route. The exact 2026 requirement must be checked against the programme-specific prospectus/notice.</p></div></details>
          <details class="accordion"><summary>Does Jamia Hamdard accept CUET for admission?</summary><div class="faq-answer"><p>Yes, CUET is used for applicable programmes, but it is <strong>not a universal requirement for every Jamia Hamdard course</strong>. The applicable subject combination, minimum marks and university application requirement vary by programme. Students using CUET should also complete the Jamia Hamdard application wherever the university requires it.</p></div></details>
          <details class="accordion"><summary>Is the Jamia Hamdard application form mandatory after appearing for CUET?</summary><div class="faq-answer"><p>For CUET-linked UG admissions, the university's admission guidance requires applicants to complete the <strong>Jamia Hamdard application process</strong> in addition to the national entrance process where applicable. A CUET score alone should therefore not be treated as a completed Jamia Hamdard application.</p></div></details>
          <details class="accordion"><summary>What is the eligibility for Jamia Hamdard UG courses?</summary><div class="faq-answer"><p>UG eligibility is programme-specific. In general, applicants need a recognised <strong>10+2 qualification</strong>, but the required subjects, minimum marks, entrance examination and age/other conditions differ across courses. For example, pharmacy and regulated health programmes have subject-specific requirements. Students should check the 2026-27 prospectus for the exact programme before applying.</p></div></details>
          <details class="accordion"><summary>What is the Jamia Hamdard MBA admission process?</summary><div class="faq-answer"><p>The 2026-27 MBA process includes the university application followed by the applicable shortlisting and <strong>GD/PI/interview process</strong>. The university has published MBA General GD/PI and interview notices, including multiple rounds. Final admission then involves the selection list, fee payment and document formalities. The exact selection criteria should be taken from the current MBA notice/prospectus.</p></div></details>
          <details class="accordion"><summary>What is the last date to apply for Jamia Hamdard MBA 2026?</summary><div class="faq-answer"><p>Deadlines are round-specific and can change through university notices. An official February 2026 MBA notice specified <strong>31 March 2026</strong> as the application deadline for its first GD/PI round, while later notices added further rounds. Students should therefore use the latest MBA notice rather than an old deadline copied from another article.</p></div></details>
          <details class="accordion"><summary>Is NEET required for Jamia Hamdard courses?</summary><div class="faq-answer"><p>NEET is required for programmes for which the university and applicable regulator/counselling authority prescribe NEET. The 2026 admission page specifically carries a notice for <strong>UG NEET-based applicants</strong>. NEET should not be assumed to be required for unrelated programmes such as general management, commerce or many non-medical courses.</p></div></details>
          <details class="accordion"><summary>How does Jamia Hamdard selection work?</summary><div class="faq-answer"><p>Selection is programme-specific. Depending on the course, the university can use national entrance scores, qualifying-exam merit, university entrance tests, interviews, GD/PI or counselling. The 2026-27 prospectus is the controlling document. Students should check not only eligibility but also the <strong>selection criterion and document requirements</strong> for their exact programme.</p></div></details>
          <details class="accordion"><summary>Does Jamia Hamdard provide hostel to all admitted students?</summary><div class="faq-answer"><p>No. The university explicitly states that hostel accommodation is <strong>limited and admission to the university does not guarantee hostel allotment</strong>. Students apply through the hostel/student process, and allotted residents must pay hostel charges in advance and join the mess. Hostel availability should therefore be treated as a separate allocation decision.</p></div></details>
          <details class="accordion"><summary>How can I get a fee refund after cancelling Jamia Hamdard admission?</summary><div class="faq-answer"><p>Jamia Hamdard's admissions support page says fee refund is handled according to <strong>UGC fee-refund norms</strong>. The university also directs cancellation/refund queries to its admission support channels. Students should submit the cancellation/refund request through the prescribed process and retain payment and application records.</p></div></details>
          </section>''',
            'jamia-hamdard-bpharm.html': '''<section class="main-section" id="faq"><h2>Jamia Hamdard B.Pharm FAQs: 10 Questions Students Search</h2>
          <details class="accordion"><summary>Is Jamia Hamdard good for B.Pharm?</summary><div class="faq-answer"><p>Jamia Hamdard is a strong option for students specifically targeting pharmacy. Its School of Pharmaceutical Education &amp; Research has a long pharmacy academic history, offers B.Pharm through regular and SFS routes, and the university was ranked <strong>1st in NIRF 2025 Pharmacy</strong>. Students should still compare B.Pharm-specific fees, placements, curriculum and career outcomes rather than treating the national ranking as a guarantee.</p></div></details>
          <details class="accordion"><summary>What is the duration of B.Pharm at Jamia Hamdard?</summary><div class="faq-answer"><p>The B.Pharm programme is an <strong>eight-semester, four-year undergraduate programme</strong>. The university's pharmacy school also offers a separate lateral-entry route for eligible D.Pharm holders, so students should distinguish the regular first-year route from lateral entry.</p></div></details>
          <details class="accordion"><summary>What is the eligibility for B.Pharm at Jamia Hamdard?</summary><div class="faq-answer"><p>The university's pharmacy information lists B.Pharm eligibility around <strong>10+2 with PCB and at least 50% aggregate marks</strong>, with age requirements under applicable PCI norms. It also describes an entrance/merit route depending on the admission framework. Because the 2026-27 prospectus supersedes older rules, candidates should verify the exact current subject, marks and selection requirements before applying.</p></div></details>
          <details class="accordion"><summary>Does Jamia Hamdard B.Pharm require NEET or an entrance exam?</summary><div class="faq-answer"><p>Students should not rely on an old B.Pharm entrance rule. The university's current 2026 admission notices and programme prospectus determine the applicable route for the session. The pharmacy school has historically described entrance/merit-based selection, while the current admission cycle can prescribe a different national or university route. Check the 2026-27 B.Pharm notice before paying the application fee.</p></div></details>
          <details class="accordion"><summary>What is the Jamia Hamdard B.Pharm fee?</summary><div class="faq-answer"><p>The latest directly accessible official fee sheet linked by the admission portal lists <strong>₹1.60 lakh per year for B.Pharm General</strong> and <strong>₹2.40 lakh per year for B.Pharm SFS</strong>. Additional admission, enrolment, alumni, library-deposit and examination/e-governance charges can apply. The accessible fee PDF is labelled 2025-26 and the 2026-27 admission notices include a fee corrigendum, so students should verify the final 2026-27 amount before payment.</p></div></details>
          <details class="accordion"><summary>What is the difference between B.Pharm Regular and SFS at Jamia Hamdard?</summary><div class="faq-answer"><p>The university publishes separate <strong>Regular and Self-Financing Scheme (SFS)</strong> routes. The currently accessible fee schedule shows a materially higher annual fee for SFS than B.Pharm General. Students should compare the exact 2026-27 seat category, fee and selection conditions in the current prospectus before choosing or budgeting for a route.</p></div></details>
          <details class="accordion"><summary>What subjects are studied in Jamia Hamdard B.Pharm?</summary><div class="faq-answer"><p>The programme develops knowledge across areas such as <strong>pharmaceutics, pharmaceutical chemistry, pharmacology, pharmacognosy, pharmaceutical analysis, microbiology and pharmacy practice</strong>. The university's pharmacy school also supports postgraduate and research specialisations in pharmaceutical disciplines, giving B.Pharm students access to a broader pharmacy-focused academic ecosystem.</p></div></details>
          <details class="accordion"><summary>What are the career options after B.Pharm from Jamia Hamdard?</summary><div class="faq-answer"><p>Career paths include pharmaceutical manufacturing, quality assurance, quality control, regulatory affairs, clinical research, pharmacovigilance, medical writing, hospital/clinical pharmacy, sales and marketing, and higher studies such as M.Pharm or related postgraduate programmes. Actual outcomes depend on the role, employer, skills, internships and higher qualifications.</p></div></details>
          <details class="accordion"><summary>Does Jamia Hamdard provide B.Pharm placements?</summary><div class="faq-answer"><p>Placement outcomes should be assessed using <strong>B.Pharm-specific data</strong> wherever available. The university's NIRF Pharmacy Rank 1 is an academic-category ranking and should not be interpreted as a placement guarantee. Students should ask for recent B.Pharm placement participation, roles, recruiters, median salary and higher-study outcomes before making an ROI decision.</p></div></details>
          <details class="accordion"><summary>Can D.Pharm students get lateral entry into B.Pharm at Jamia Hamdard?</summary><div class="faq-answer"><p>Yes, the university's pharmacy school lists a <strong>B.Pharm second-year lateral-entry route</strong> for eligible D.Pharm holders. Its published eligibility includes a recognised D.Pharm with the prescribed marks and the applicable selection process. The exact 2026-27 seats, fee and admission test/merit rule should be checked in the current prospectus.</p></div></details>
          </section>''',
            'jamia-hamdard-mba.html': '''<section class="main-section" id="faq"><h2>Jamia Hamdard MBA FAQs: 10 Questions Students Search</h2>
          <details class="accordion"><summary>Is Jamia Hamdard MBA worth it?</summary><div class="faq-answer"><p>It can be worth considering for students who want a Delhi-based MBA and are comfortable with the programme's reported placement outcomes. NIRF 2025 Management data shows <strong>202 of 230</strong> graduates placed in 2023-24 with a <strong>₹5.95 LPA median salary</strong>. The decision should be based on current fee, role quality, recruiter mix and your alternatives rather than the university's Pharmacy ranking.</p></div></details>
          <details class="accordion"><summary>What is the Jamia Hamdard MBA eligibility?</summary><div class="faq-answer"><p>MBA eligibility is programme-specific and should be checked in the current 2026-27 prospectus. Applicants generally need a recognised bachelor's degree, but the applicable minimum marks, accepted qualifying route and selection criteria must be confirmed from the current university notice before applying.</p></div></details>
          <details class="accordion"><summary>What is the Jamia Hamdard MBA admission process?</summary><div class="faq-answer"><p>The current cycle uses the university application followed by the applicable shortlisting and <strong>GD/PI/interview process</strong>. The university has issued MBA General GD/PI and interview notices for 2026-27. After selection, candidates complete fee payment and document formalities within the prescribed deadline.</p></div></details>
          <details class="accordion"><summary>Does Jamia Hamdard MBA have GD/PI?</summary><div class="faq-answer"><p>Yes. The 2026-27 admission notices explicitly include <strong>MBA General GD/PI schedules</strong> and interview notices. The university has conducted multiple rounds, so applicants should follow the latest round notice applicable to their application.</p></div></details>
          <details class="accordion"><summary>What are the MBA specialisations at Jamia Hamdard?</summary><div class="faq-answer"><p>The published programme includes specialisation areas such as <strong>Marketing, Finance, Human Resource, Operations Management, Information Technology, International Business and Entrepreneurship</strong>. Students should compare each specialisation based on curriculum, electives, faculty, internships and relevant placement roles.</p></div></details>
          <details class="accordion"><summary>What is the Jamia Hamdard MBA fee in 2026?</summary><div class="faq-answer"><p>The fee information needs careful reading because different official documents reflect different points in the admission cycle. The fee PDF currently linked by the admission portal lists <strong>₹2.60 lakh per year</strong> for MBA in all disciplines, while a 2026-27 MBA General selection list shows an <strong>SFS semester fee of ₹1.40 lakh</strong> plus listed additional charges. Students should use the exact fee classification in their 2026-27 offer/selection document instead of assuming one number applies to every MBA category.</p></div></details>
          <details class="accordion"><summary>What is the Jamia Hamdard MBA placement package?</summary><div class="faq-answer"><p>NIRF 2025 Management data reports a <strong>₹5.95 LPA median salary</strong> for the 2023-24 cohort, with 202 of 230 graduates placed. Earlier reported medians were ₹5.52 LPA in 2022-23 and ₹4.63 LPA in 2021-22. Median salary is more useful for ROI planning than an isolated highest-package claim.</p></div></details>
          <details class="accordion"><summary>What is the MBA placement rate at Jamia Hamdard?</summary><div class="faq-answer"><p>For the 2023-24 Management cohort reported to NIRF, <strong>202 of 230</strong> students graduating in minimum stipulated time were placed, which is about 88%. This is a programme-category figure and should not be interpreted as a placement rate for every Jamia Hamdard course.</p></div></details>
          <details class="accordion"><summary>Does Jamia Hamdard MBA accept CAT, XAT or other entrance scores?</summary><div class="faq-answer"><p>Students should not assume that one national MBA exam is mandatory for every Jamia Hamdard MBA route. The applicable selection criteria are defined by the university's current prospectus and MBA admission notice, with the 2026 cycle clearly including the university application and GD/PI/interview process. Check the current notice for the exact accepted score/qualification route before applying.</p></div></details>
          <details class="accordion"><summary>Is Jamia Hamdard MBA good for Finance?</summary><div class="faq-answer"><p>Finance is one of the listed MBA specialisation areas, so it is relevant for students targeting banking, financial services, corporate finance, business analysis and related roles. However, the programme's overall reported median salary is not Finance-specific. Students interested in Finance should ask for specialisation-wise roles, recruiters and internships before deciding.</p></div></details>
          </section>''',
            'jamia-hamdard-fees-placements.html': '''<section class="main-section" id="faq"><h2>Jamia Hamdard Fees &amp; Placements FAQs: 10 Questions Students Search</h2>
          <details class="accordion"><summary>What is the Jamia Hamdard fee structure?</summary><div class="faq-answer"><p>Jamia Hamdard uses programme-wise fees rather than one common university fee. The currently accessible official fee sheet lists annual course fees such as <strong>₹2.60 lakh for MBA</strong>, ₹1.60 lakh for B.Pharm General and ₹2.20 lakh for B.Tech CSE. It also lists one-time and recurring charges. The accessible PDF is labelled 2025-26, while 2026-27 notices include a fee corrigendum, so students must verify the final 2026-27 amount.</p></div></details>
          <details class="accordion"><summary>What is the Jamia Hamdard MBA fee?</summary><div class="faq-answer"><p>The fee PDF currently linked by the university lists <strong>₹2.60 lakh per year</strong> for MBA in all disciplines before additional charges. However, a 2026-27 MBA General selection list records an SFS semester fee of ₹1.40 lakh plus admission, enrolment, library, alumni, examination and e-governance charges. The exact amount should therefore be taken from the candidate's current 2026-27 selection/offer document.</p></div></details>
          <details class="accordion"><summary>What is the Jamia Hamdard B.Pharm fee?</summary><div class="faq-answer"><p>The published fee schedule lists <strong>₹1.60 lakh per year for B.Pharm General</strong> and <strong>₹2.40 lakh per year for B.Pharm SFS</strong>. One-time and annual institutional charges are additional. Because the accessible fee PDF is labelled 2025-26 and a 2026-27 fee corrigendum is listed by the university, students should verify the revised figure before payment.</p></div></details>
          <details class="accordion"><summary>What additional fees are charged at Jamia Hamdard?</summary><div class="faq-answer"><p>The accessible fee sheet lists <strong>₹5,000 admission, ₹5,000 enrolment, ₹3,000 alumni fund and ₹5,000 refundable library deposit</strong> as one-time charges. For schools other than Humanities &amp; Social Sciences, it lists ₹10,000 examination and ₹1,000 e-governance charges annually. Programme-specific documents can differ, so the latest offer/fee document should be treated as final.</p></div></details>
          <details class="accordion"><summary>Is hostel included in Jamia Hamdard tuition fees?</summary><div class="faq-answer"><p>No. Hostel and mess are separate from academic fees. The university states that accommodation is limited and <strong>university admission does not guarantee hostel allotment</strong>. Allotted residents pay hostel charges in advance and must join the mess. Therefore, total cost of attendance should include academic fees plus hostel, mess and personal living expenses where applicable.</p></div></details>
          <details class="accordion"><summary>What is the Jamia Hamdard MBA median salary?</summary><div class="faq-answer"><p>NIRF 2025 Management data reports a <strong>₹5.95 LPA median salary</strong> for 2023-24 graduates in the reported Management category. The previous medians were ₹5.52 LPA and ₹4.63 LPA. These are median outcomes for the reported cohort, not a guaranteed salary for every MBA student.</p></div></details>
          <details class="accordion"><summary>What is the Jamia Hamdard MBA placement rate?</summary><div class="faq-answer"><p>In the 2023-24 NIRF Management submission, <strong>202 out of 230</strong> students graduating in minimum stipulated time were placed. That is roughly 88%. The figure applies to the reported Management category and should not be extrapolated to pharmacy, engineering or every programme at the university.</p></div></details>
          <details class="accordion"><summary>What is the Jamia Hamdard engineering placement salary?</summary><div class="faq-answer"><p>NIRF 2025 reports a <strong>₹5.45 LPA median</strong> for four-year engineering UG graduates in 2023-24, while the two-year engineering PG category reported a <strong>₹6.20 LPA median</strong>. The corresponding placement counts were 197 of 337 for UG and 42 of 60 for PG.</p></div></details>
          <details class="accordion"><summary>Is Jamia Hamdard Pharmacy really ranked No. 1?</summary><div class="faq-answer"><p>Yes. Jamia Hamdard was ranked <strong>1st in Pharmacy in NIRF 2025</strong>, with a score of 86.59. This is specifically the Pharmacy category and should be used as evidence of strength in that field, not as a universal ranking for MBA, engineering or other courses.</p></div></details>
          <details class="accordion"><summary>How should I calculate Jamia Hamdard ROI?</summary><div class="faq-answer"><p>Calculate the complete cost of the specific programme, including tuition, one-time charges, recurring exam/e-governance charges, hostel/mess and living costs. Then compare that total with the <strong>programme-specific median salary and placement rate</strong>. Also check role quality, recruiter mix, internships and higher-study outcomes. This is more reliable than comparing only tuition fees or the highest package.</p></div></details>
          </section>'''
          }

          for filename, faq in faqs.items():
              p = Path(filename)
              text = p.read_text()
              pattern = r'<section class="main-section" id="faq">.*?</section><hr/>'
              new, n = re.subn(pattern, faq + '<hr/>', text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'FAQ section not found exactly once in {filename}: {n}')
              p.write_text(new)
          PY
      - name: Commit FAQ updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jamia-hamdard-admission-2026.html jamia-hamdard-bpharm.html jamia-hamdard-mba.html jamia-hamdard-fees-placements.html
          git diff --cached --quiet && exit 0
          git commit -m "Expand Jamia Hamdard FAQs"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/expand-jamia-faqs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/expand-jamia-faqs.yml
          git commit -m "Remove one-time Jamia FAQ workflow" || true
          git push || true

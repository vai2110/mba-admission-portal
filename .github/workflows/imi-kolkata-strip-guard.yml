name: IMI Kolkata Navigation Guard

on:
  push:
    branches: [main]
    paths:
      - 'imi-kolkata*.html'
      - '.github/workflows/imi-kolkata-strip-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-strip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove forbidden college navigation strip
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          for f in imi-kolkata*.html; do
            [ -f "$f" ] || continue
            python3 - "$f" <<'PY'
import re, pathlib, sys
p = pathlib.Path(sys.argv[1])
s = p.read_text(encoding='utf-8')
new = re.sub(r'<nav\s+class=["\']college-cluster-nav["\'][^>]*>.*?</nav>\s*', '', s, flags=re.I|re.S)
if new != s:
    p.write_text(new, encoding='utf-8')
PY
            if ! git diff --quiet -- "$f"; then
              changed=1
              echo "Removed Explore this college strip from $f"
            fi
          done
          echo "changed=$changed" >> "$GITHUB_ENV"

      - name: Commit cleaned pages
        if: env.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imi-kolkata*.html
          git commit -m "Remove Explore this college strip from IMI Kolkata pages"
          git push

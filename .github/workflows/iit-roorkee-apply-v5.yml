name: IIT Roorkee SIBM Hero Structure

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Lock IIT Roorkee SIBM hero [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact hero structure
        shell: python
        run: |
          from pathlib import Path
          import re
          pages=[Path('iit-roorkee.html'),Path('iit-roorkee-mba.html'),Path('iit-roorkee-executive-mba.html'),Path('iit-roorkee-placements.html')]
          hero_copy={
            'iit-roorkee.html':'MBA admission, eligibility, fees, CAT selection, cutoff information, programme options and latest placement outcomes',
            'iit-roorkee-mba.html':'MBA admission process, eligibility, CAT selection, fees, cutoff information and placement outcomes',
            'iit-roorkee-executive-mba.html':'Executive MBA eligibility, admission process, fees, programme structure and career information',
            'iit-roorkee-placements.html':'Official MBA placement report data covering average CTC, median CTC, highest CTC and recruiter participation'
          }
          for p in pages:
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              # Replace only the hero wrapper's first generic width container with the approved SIBM container.
              s=re.sub(r'(<section class="hero">\s*<div class=")w("[^>]*>)', r'\1hero-container\2', s, count=1)
              # Convert the hero supporting paragraph to the benchmark H2 element, preserving its page-specific text.
              def hero_to_h2(m):
                  inner=m.group(1)
                  return '<h2>'+inner+'</h2>'
              s=re.sub(r'<p>(.*?)</p>(?=\s*<(?:small|div))', hero_to_h2, s, count=1, flags=re.S)
              # If the hero paragraph was the last element before closing wrapper, still convert it.
              if '<section class="hero">' in s:
                  start=s.index('<section class="hero">')
                  end=s.find('</section>',start)
                  if end!=-1:
                      block=s[start:end]
                      block=re.sub(r'<p>(.*?)</p>', hero_to_h2, block, count=1, flags=re.S)
                      s=s[:start]+block+s[end:]
              # Enforce benchmark font and component type scale.
              s=re.sub(r'body\{[^}]*\}', 'body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033;line-height:1.65}', s, count=1)
              s=re.sub(r'\.hero\{[^}]*\}', '.hero{background:linear-gradient(110deg,#172554 0%,#1d4ed8 100%);color:#fff;padding:38px 0}', s, count=1)
              s=re.sub(r'\.hero-container\{[^}]*\}', '.hero-container{width:min(1240px,calc(100% - 40px));margin:auto}', s, count=1)
              s=re.sub(r'\.hero h1\{[^}]*\}', '.hero h1{font-size:36px;line-height:1.18;margin:0 0 9px;max-width:900px}', s, count=1)
              if '.hero h2{' in s:
                  s=re.sub(r'\.hero h2\{[^}]*\}', '.hero h2{font-size:16px;line-height:1.5;font-weight:600;color:#dbeafe;margin:0 0 10px;max-width:900px}', s, count=1)
              else:
                  s=s.replace('</style>', '.hero h2{font-size:16px;line-height:1.5;font-weight:600;color:#dbeafe;margin:0 0 10px;max-width:900px}</style>', 1)
              if '.hero-location{' in s:
                  s=re.sub(r'\.hero-location\{[^}]*\}', '.hero-location{font-size:13px;color:#dbeafe;font-weight:600}', s, count=1)
              p.write_text(s,encoding='utf-8')
          # Add hard rule to agent skill.
          a=Path('AGENTS.md')
          txt=a.read_text(encoding='utf-8') if a.exists() else '# MBA Portal College Page Agent\n'
          marker='## Locked Hero HTML Structure'
          if marker not in txt:
              txt += '''\n\n## Locked Hero HTML Structure\n- Match the SIBM Pune hero HTML pattern: one compact hero container, one search-intent H1, one concise supporting H2 and one location/official-site line.\n- Do not add fact cards, logos, badges or other modules inside the hero unless the benchmark architecture explicitly contains them.\n- Use the approved Arial font stack and SIBM benchmark type scale: H1 36px desktop, H2 16px, location 13px; retain the responsive mobile scale already established.\n- Exactly one Quick Answer block is permitted in visible page content.\n- H2s elsewhere must remain short, specific and keyword-led.\n'''
              a.write_text(txt,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iit-roorkee*.html AGENTS.md
          git diff --cached --quiet || git commit -m 'Lock IIT Roorkee SIBM hero [skip ci]'
          git push
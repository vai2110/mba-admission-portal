name: Fix MBA fee page separators

on:
  push:
    paths:
      - '.github/workflows/fix-mba-fees-separators.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove unnecessary fee-page separators
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mba-college-fees.html')
          s = p.read_text(encoding='utf-8')
          for tag in ('<hr>', '<hr/>', '<hr />'):
              s = s.replace(tag, '')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mba-college-fees.html
          git rm .github/workflows/fix-mba-fees-separators.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove unnecessary separators from MBA fee page"
          git push
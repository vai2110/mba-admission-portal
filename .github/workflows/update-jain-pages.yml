name: Update Jain University pages
on:
  push:
    paths:
      - '.github/workflows/update-jain-pages.yml'
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Jain pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files=['jain-university.html','jain-university-btech-cse.html','jain-university-mba.html','jain-university-bba.html','jain-university-bca.html','jain-university-bcom.html','jain-university-placements.html']

          discussion='''<hr/><section class="main-section" id="student-discussions"><h2>What Do Students Say About Jain University on Reddit &amp; Quora?</h2><p>Student forums can reveal questions that brochures do not, especially around ROI, campus life, administration, fees and placements. These are personal experiences, not representative university-wide data.</p><div class="discussion-grid"><a class="discussion-card" href="https://www.reddit.com/r/JainUniCommunity/" target="_blank" rel="noopener"><span class="discussion-label">REDDIT</span><strong>Read Jain University student discussions</strong><span>Current questions and experiences from applicants, students and alumni.</span><b>Explore Reddit discussions ↗</b></a><a class="discussion-card" href="https://www.quora.com/search?q=Jain%20University%20Bangalore" target="_blank" rel="noopener"><span class="discussion-label">QUORA</span><strong>Browse Jain University questions on Quora</strong><span>Student and alumni perspectives on courses, placements, fees and campus life.</span><b>Browse Quora discussions ↗</b></a></div><div class="answer-box discussion-note"><strong>What themes appear in recent discussions?</strong><p>Recent Reddit discussions are mixed: students mention Bengaluru exposure and campus activities positively, while others discuss fees/ROI, engineering-campus location, administration and the importance of individual preparation for placements. Treat these as anecdotal viewpoints.</p></div></section>'''

          cards='''<div class="programme-grid"><div class="programme-card"><span class="programme-label">ENGINEERING</span><h3>B.Tech CSE</h3><p>Core computer science route for software, AI, data and technology careers.</p><div class="card-details"><div><span>WHO IS THIS COURSE FOR?</span><strong>Students targeting software, technology, AI or data roles.</strong></div><div><span>ELIGIBILITY</span><strong>10+2 with Physics and Mathematics; FET criteria apply.</strong></div><div><span>FEES</span><strong>₹3.25L/year; ₹13L tuition for 4 years.</strong></div><div><span>ADMISSION</span><strong>JEE / COMEDK / UNIGAUGE and applicable JAIN route.</strong></div></div><a class="programme-link" href="jain-university-btech-cse.html">View B.Tech CSE Guide →</a></div><div class="programme-card"><span class="programme-label">MANAGEMENT</span><h3>MBA</h3><p>Two-year full-time MBA through CMS Business School.</p><div class="card-details"><div><span>WHO IS THIS COURSE FOR?</span><strong>Graduates targeting corporate, finance, analytics, marketing or entrepreneurship roles.</strong></div><div><span>ELIGIBILITY</span><strong>Bachelor's degree; published programme criteria apply.</strong></div><div><span>FEES</span><strong>₹12.50L reported for 2 years; ₹6.45L + ₹6.05L.</strong></div><div><span>ADMISSION</span><strong>JET or qualifying CAT/MAT/NMAT/CMAT/GMAT/XAT route.</strong></div></div><a class="programme-link" href="jain-university-mba.html">View MBA Guide →</a></div><div class="programme-card"><span class="programme-label">UG MANAGEMENT</span><h3>BBA</h3><p>Business degree with analytics, entrepreneurship, finance and specialised routes.</p><div class="card-details"><div><span>WHO IS THIS COURSE FOR?</span><strong>12th-pass students planning business or management careers.</strong></div><div><span>ELIGIBILITY</span><strong>10+2 pass from Science, Commerce or Arts.</strong></div><div><span>FEES</span><strong>₹5.8–8.4L reported for 3-year BBA; Hons tracks can be higher.</strong></div><div><span>ADMISSION</span><strong>Programme-specific JET/application and selection process.</strong></div></div><a class="programme-link" href="jain-university-bba.html">View BBA Guide →</a></div><div class="programme-card"><span class="programme-label">COMPUTING</span><h3>BCA</h3><p>Application-focused computing route covering programming, data and emerging technologies.</p><div class="card-details"><div><span>WHO IS THIS COURSE FOR?</span><strong>Students seeking software/IT careers without B.Tech.</strong></div><div><span>ELIGIBILITY</span><strong>10+2 or equivalent; current official programme is 4 years.</strong></div><div><span>FEES</span><strong>₹1.75–2.50L first-year reported reference; verify exact 2026 fee.</strong></div><div><span>ADMISSION</span><strong>Programme-specific JAIN application and selection route.</strong></div></div><a class="programme-link" href="jain-university-bca.html">View BCA Guide →</a></div><div class="programme-card"><span class="programme-label">COMMERCE</span><h3>B.Com</h3><p>Commerce pathway with general, honours, professional and global tracks.</p><div class="card-details"><div><span>WHO IS THIS COURSE FOR?</span><strong>Students targeting accounting, finance, business or professional qualifications.</strong></div><div><span>ELIGIBILITY</span><strong>10+2 or equivalent; track-specific rules may apply.</strong></div><div><span>FEES</span><strong>₹5.70–10.40L reported depending on track.</strong></div><div><span>ADMISSION</span><strong>Programme-specific application/JET route.</strong></div></div><a class="programme-link" href="jain-university-bcom.html">View B.Com Guide →</a></div></div>'''

          fee={'jain-university.html':'''<section class="main-section" id="fees"><h2>Jain University Fees 2026: Course-wise Fee &amp; Bifurcation</h2><p>Fees vary by programme and specialisation. The following 2026 references combine official programme information with clearly labelled published fee references where a complete university fee table is not publicly displayed.</p><div class="table-wrapper"><table><tr><th>Programme</th><th>Fee reference</th><th>Duration</th><th>Other charges</th></tr><tr><td>B.Tech CSE</td><td><strong>₹3.25L/year; ₹13L tuition</strong></td><td>4 years</td><td>Application ₹600; hostel extra</td></tr><tr><td>MBA</td><td><strong>₹12.50L total</strong><br/>₹6.45L + ₹6.05L</td><td>2 years</td><td>Application ₹1,500</td></tr><tr><td>BBA</td><td><strong>₹5.8–8.4L</strong> reported</td><td>3 years</td><td>Hons/specialised tracks can be higher</td></tr><tr><td>BCA</td><td><strong>₹1.75–2.50L first-year</strong> reported</td><td>Current official page: 4 years</td><td>Verify exact 2026 programme fee</td></tr><tr><td>B.Com</td><td><strong>₹5.70–10.40L</strong> reported</td><td>3–4 years</td><td>₹1.90–2.60L first-year reference</td></tr><tr><td>Hostel</td><td><strong>₹1.40–2.25L/year</strong> reported</td><td>Per year</td><td>₹10,000 refundable caution reported</td></tr></table></div><p class="source-note">B.Tech CSE fee is from the official FET programme fee. Other 2026 fee ranges are published third-party references and should be verified against the final JAIN offer letter.</p><a class="cta" href="https://www.jainuniversity.ac.in/admission" target="_blank" rel="noopener">Verify Fees With JAIN Admissions ↗</a></section>''',
          'jain-university-btech-cse.html':'''<section class="main-section" id="fees"><h2>Jain University B.Tech CSE Fees 2026: Complete Bifurcation</h2><p>The official FET fee reference lists B.Tech CSE at ₹3.25 lakh per year. Four years therefore represent ₹13 lakh in tuition before hostel and other applicable charges.</p><div class="table-wrapper"><table><tr><th>Component</th><th>Amount</th><th>Frequency</th></tr><tr><td>CSE tuition</td><td><strong>₹3,25,000</strong></td><td>Per year</td></tr><tr><td>4-year tuition</td><td><strong>₹13,00,000</strong></td><td>4 years</td></tr><tr><td>Application</td><td><strong>₹600</strong></td><td>One time</td></tr><tr><td>Hostel</td><td>Extra</td><td>Per year</td></tr></table></div><p class="source-note">Tuition is from the official 2026 FET fee reference; the four-year total is calculated from the annual tuition.</p></section>''',
          'jain-university-mba.html':'''<section class="main-section" id="fees"><h2>Jain University MBA Fees 2026: Year-wise Bifurcation</h2><p>Published 2026 fee references put the two-year MBA tuition at ₹12.50 lakh, split between ₹6.45 lakh in Year 1 and ₹6.05 lakh in Year 2. CMS also states a ₹1,500 application fee.</p><div class="table-wrapper"><table><tr><th>Component</th><th>Amount</th></tr><tr><td>Year 1 tuition</td><td><strong>₹6,45,000</strong></td></tr><tr><td>Year 2 tuition</td><td><strong>₹6,05,000</strong></td></tr><tr><td>Total tuition</td><td><strong>₹12,50,000</strong></td></tr><tr><td>Application fee</td><td><strong>₹1,500</strong></td></tr></table></div><p class="source-note">Confirm the final 2026-28 payable amount, hostel and any other charges in the admission offer.</p></section>''',
          'jain-university-bba.html':'''<section class="main-section" id="fees"><h2>Jain University BBA Fees 2026: Course-wise Fee Reference</h2><p>BBA fees vary by programme. Published 2026 references put regular three-year BBA tuition around ₹5.8–8.4 lakh, while BBA Hons/global-style tracks can be higher.</p><div class="table-wrapper"><table><tr><th>Fee item</th><th>Reference</th><th>Verify</th></tr><tr><td>Regular BBA</td><td><strong>₹5.8–8.4L total</strong></td><td>Exact specialisation</td></tr><tr><td>BBA Hons</td><td><strong>₹12–16L reported</strong></td><td>Track and duration</td></tr><tr><td>Registration</td><td><strong>₹30,000 reported</strong></td><td>Current admission notice</td></tr><tr><td>Hostel</td><td><strong>₹1.40–2.25L/year reported</strong></td><td>Room/campus</td></tr></table></div><p class="source-note">The current official BBA page confirms eligibility but does not publish one universal fee table; figures above are indicative 2026 published references.</p></section>''',
          'jain-university-bca.html':'''<section class="main-section" id="fees"><h2>Jain University BCA Fees 2026: Fee Range &amp; Other Charges</h2><p>The current official BCA page lists a four-year programme but does not display a complete fee table. Published 2026 references put first-year fees around ₹1.75–2.50 lakh.</p><div class="table-wrapper"><table><tr><th>Fee item</th><th>Reference</th><th>Notes</th></tr><tr><td>First-year tuition</td><td><strong>₹1.75–2.50L</strong></td><td>Published reference</td></tr><tr><td>Older published total reference</td><td><strong>₹5.25–7.50L</strong></td><td>Some sources still show a 3-year structure; do not use as guaranteed 4-year total</td></tr><tr><td>Hostel</td><td><strong>₹1.40–2.25L/year reported</strong></td><td>Depends on accommodation</td></tr></table></div><p class="source-note">Important: the current official BCA page says 4 years/8 semesters. Verify the exact 2026 fee schedule before payment.</p></section>''',
          'jain-university-bcom.html':'''<section class="main-section" id="fees"><h2>Jain University B.Com Fees 2026: Track-wise Bifurcation</h2><p>Published 2026 references show substantial variation across B.Com tracks.</p><div class="table-wrapper"><table><tr><th>Track</th><th>First year</th><th>Total tuition</th></tr><tr><td>B.Com General</td><td><strong>₹1.90L</strong></td><td><strong>₹5.70L</strong></td></tr><tr><td>B.Com Hons.</td><td><strong>₹2.00L</strong></td><td><strong>₹6.00L</strong></td></tr><tr><td>Hons. Professional Accounting</td><td><strong>₹1.90L</strong></td><td><strong>₹7.60L</strong></td></tr><tr><td>Global ACCA</td><td><strong>₹2.60L</strong></td><td><strong>₹10.40L</strong></td></tr><tr><td>Global CFA</td><td><strong>₹2.60L</strong></td><td><strong>₹10.40L</strong></td></tr></table></div><p class="source-note">These are published 2026 fee references; verify the exact selected B.Com track in the current offer letter.</p></section>'''}

          for fn in files:
            p=Path(fn)
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            if '#student-discussions' not in s:
              s=s.replace('<a href="#faq">FAQs</a>', '<a href="#student-discussions">Reddit &amp; Quora Reviews</a><a href="#faq">FAQs</a>')
              s=s.replace('<hr/><section class="main-section" id="faq">', discussion+'<hr/><section class="main-section" id="faq">',1)
            if fn=='jain-university.html':
              s=re.sub(r'<div class="programme-grid">.*?</div></section><hr/><section class="main-section" id="admission">', cards+'<hr/><section class="main-section" id="admission">',s,count=1,flags=re.S)
            if fn in fee:
              s=re.sub(r'<section class="main-section" id="fees">.*?</section><hr/><section class="main-section" id="placements">',fee[fn]+'<hr/><section class="main-section" id="placements">',s,count=1,flags=re.S)
            p.write_text(s,encoding='utf-8')

          css=Path('jain-university.css')
          c=css.read_text(encoding='utf-8')
          c += '''\n/* Jain 2026 presentation upgrades */\n.main-section table{table-layout:fixed}.main-section th,.main-section td{font-size:12.5px;line-height:1.5}.main-section td:first-child{font-weight:700;color:#173f82}.table-wrapper{border:1px solid #d9e1ea;border-radius:8px;background:#fff}.programme-grid{align-items:stretch}.programme-card{padding:18px;box-shadow:0 3px 10px rgba(23,42,77,.04)}.programme-card>p{font-size:12.5px;min-height:50px}.card-details{display:grid;gap:7px;margin:10px 0 15px}.card-details>div{background:#f8fbff;border:1px solid #e1e9f2;border-radius:6px;padding:8px 9px}.card-details span{display:block;color:#2563eb;font-size:8.5px;font-weight:800;letter-spacing:.25px;margin-bottom:2px}.card-details strong{display:block;color:#334155;font-size:11px;line-height:1.4}.programme-link{margin-top:auto;background:#2563eb;color:#fff!important;border-radius:6px;text-align:center;padding:10px 11px;font-size:11px}.discussion-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}.discussion-card{display:flex;flex-direction:column;gap:7px;padding:16px;background:#f8fbff;border:1px solid #dbe7f5;border-radius:8px;color:#172033}.discussion-label{font-size:9px;font-weight:800;color:#2563eb;letter-spacing:.4px}.discussion-card strong{font-size:15px;color:#173f82;line-height:1.35}.discussion-card span:not(.discussion-label){font-size:12px;color:#475569;line-height:1.5}.discussion-card b{font-size:11px;color:#2563eb;margin-top:auto}.source-note{font-size:11px!important;color:#64748b!important;line-height:1.55!important}@media(max-width:720px){.discussion-grid{grid-template-columns:1fr}.main-section table{min-width:760px}.programme-card>p{min-height:0}.card-details strong{font-size:10.5px}}\n'''
          css.write_text(c,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Jain Page Updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jain-university*.html jain-university.css
          git commit -m "Improve Jain University fees cards and student discussions" || exit 0
          git push

name: Controlled V8 Benchmark Test - Rank 30

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controlled-v8-benchmark-test
  cancel-in-progress: false

jobs:
  benchmark-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 openpyxl

      - name: Configure Git identity
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Validate credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_WEBAPP_URL: ${{ secrets.GOOGLE_SHEETS_WEBAPP_URL }}
          GOOGLE_SHEETS_API_SECRET: ${{ secrets.GOOGLE_SHEETS_API_SECRET }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo '::error::GEMINI_API_KEY is unavailable'; exit 1; }
          test -n "$GOOGLE_SHEET_WEBAPP_URL" || { echo '::error::GOOGLE_SHEETS_WEBAPP_URL is unavailable'; exit 1; }
          test -n "$GOOGLE_SHEETS_API_SECRET" || { echo '::error::GOOGLE_SHEETS_API_SECRET is unavailable'; exit 1; }

      - name: Validate Google Sheet health
        env:
          GOOGLE_SHEET_WEBAPP_URL: ${{ secrets.GOOGLE_SHEETS_WEBAPP_URL }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          url=os.environ['GOOGLE_SHEET_WEBAPP_URL']
          last=None
          for attempt in range(5):
              try:
                  u=url+('&' if '?' in url else '?')+urllib.parse.urlencode({'action':'health'})
                  req=urllib.request.Request(u,headers={'User-Agent':'MBA-V8-Benchmark/1.0'})
                  with urllib.request.urlopen(req,timeout=90) as r:
                      data=json.loads(r.read().decode())
                  if data.get('success'):
                      print('Google Sheet endpoint: healthy')
                      print(data)
                      break
                  last=data
              except Exception as exc:
                  last=repr(exc)
                  print(f'Health check attempt {attempt+1}/5 failed: {last}')
              if attempt < 4:
                  time.sleep(10*(attempt+1))
          else:
              raise SystemExit(f'Google Sheet health check failed after 5 attempts: {last}')
          PY

      - name: Verify V8 source integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/independent_college_content_agent_v8.py')
          s=p.read_text(encoding='utf-8')
          required=[
              'research_text,source_pages=research(url)',
              'content_prompt(college,rank,url,research_text,[p.get("type")],existing)',
              'def render_page(page, college, rank, official_url, internal_links, filename, source_pages=None):',
              'planned_files=[]',
              'allowed_existing=existing | set(planned_files)',
              'render_page(p,college,rank,url,related,fn,source_pages)',
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('V8 source integrity check failed: '+repr(missing))
          print('V8 source integrity: OK')
          PY

      - name: Run controlled V8 benchmark test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_WEBAPP_URL: ${{ secrets.GOOGLE_SHEETS_WEBAPP_URL }}
          GOOGLE_SHEETS_API_SECRET: ${{ secrets.GOOGLE_SHEETS_API_SECRET }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          COLLEGE_BATCH_SIZE: '1'
          COLLEGE_TEST_RANK: '30'
        run: python scripts/controlled_v8_rank30_test.py

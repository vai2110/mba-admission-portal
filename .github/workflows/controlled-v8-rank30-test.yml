name: Controlled V8 Benchmark Test - Rank 30

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controlled-v8-benchmark-test
  cancel-in-progress: false

jobs:
  benchmark-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 openpyxl

      - name: Configure Git identity
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Validate credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_WEBAPP_URL: ${{ secrets.GOOGLE_SHEETS_WEBAPP_URL }}
          GOOGLE_SHEETS_API_SECRET: ${{ secrets.GOOGLE_SHEETS_API_SECRET }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo '::error::GEMINI_API_KEY is unavailable'; exit 1; }
          test -n "$GOOGLE_SHEET_WEBAPP_URL" || { echo '::error::GOOGLE_SHEETS_WEBAPP_URL is unavailable'; exit 1; }
          test -n "$GOOGLE_SHEETS_API_SECRET" || { echo '::error::GOOGLE_SHEETS_API_SECRET is unavailable'; exit 1; }

      - name: Validate Google Sheet health
        env:
          GOOGLE_SHEET_WEBAPP_URL: ${{ secrets.GOOGLE_SHEETS_WEBAPP_URL }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request, json
          url=os.environ['GOOGLE_SHEET_WEBAPP_URL']
          u=url+('&' if '?' in url else '?')+urllib.parse.urlencode({'action':'health'})
          with urllib.request.urlopen(u,timeout=30) as r: data=json.loads(r.read().decode())
          if not data.get('success'): raise SystemExit(data)
          print('Google Sheet endpoint: healthy')
          print(data)
          PY

      - name: Apply V8 research variable hotfixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/independent_college_content_agent_v8.py')
          s = p.read_text(encoding='utf-8')

          # Hotfix 1: main generation path must pass the research TEXT, not the function.
          old1 = '        research,source_pages=research(url)\n        prompt=content_prompt(college,rank,url,research,types,existing)'
          new1 = '        research_text,source_pages=research(url)\n        prompt=content_prompt(college,rank,url,research_text,types,existing)'
          if old1 in s:
              s = s.replace(old1, new1, 1)
              print('Applied V8 main research-variable hotfix')
          elif 'research_text,source_pages=research(url)' in s:
              print('V8 main research-variable hotfix already present')
          else:
              raise SystemExit('V8 main research pattern not found; refusing to run with an unknown source layout')

          # Hotfix 2: revision path must also pass the research TEXT, not the research function.
          old2 = 'revised=gemini(content_prompt(college,rank,url,research,[p.get("type")],existing)+f"\\n\\nREVISION REQUIRED. Fix these issues in the structured content: {feedback}\\nReturn exactly one page of the requested type.")'
          new2 = 'revised=gemini(content_prompt(college,rank,url,research_text,[p.get("type")],existing)+f"\\n\\nREVISION REQUIRED. Fix these issues in the structured content: {feedback}\\nReturn exactly one page of the requested type.")'
          if old2 in s:
              s = s.replace(old2, new2, 1)
              print('Applied V8 revision research-variable hotfix')
          elif 'content_prompt(college,rank,url,research_text,[p.get("type")],existing)' in s:
              print('V8 revision research-variable hotfix already present')
          else:
              raise SystemExit('V8 revision research pattern not found; refusing to run with an unknown source layout')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Persist V8 source hotfix
        run: |
          if git diff --quiet -- scripts/independent_college_content_agent_v8.py; then
            echo 'No V8 source change to persist'
          else
            git add scripts/independent_college_content_agent_v8.py
            git commit -m "Fix V8 research variable handling"
            git push origin main
          fi

      - name: Run controlled V8 benchmark test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_WEBAPP_URL: ${{ secrets.GOOGLE_SHEETS_WEBAPP_URL }}
          GOOGLE_SHEETS_API_SECRET: ${{ secrets.GOOGLE_SHEETS_API_SECRET }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          COLLEGE_BATCH_SIZE: '1'
        run: python scripts/controlled_v8_rank30_test.py

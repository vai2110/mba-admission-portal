name: Controlled V8 Benchmark Test - Rank 30

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controlled-v8-benchmark-test
  cancel-in-progress: false

jobs:
  benchmark-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 openpyxl

      - name: Configure Git identity
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Validate credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_WEBAPP_URL: ${{ secrets.GOOGLE_SHEETS_WEBAPP_URL }}
          GOOGLE_SHEETS_API_SECRET: ${{ secrets.GOOGLE_SHEETS_API_SECRET }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo '::error::GEMINI_API_KEY is unavailable'; exit 1; }
          test -n "$GOOGLE_SHEET_WEBAPP_URL" || { echo '::error::GOOGLE_SHEETS_WEBAPP_URL is unavailable'; exit 1; }
          test -n "$GOOGLE_SHEETS_API_SECRET" || { echo '::error::GOOGLE_SHEETS_API_SECRET is unavailable'; exit 1; }

      - name: Validate Google Sheet health
        env:
          GOOGLE_SHEET_WEBAPP_URL: ${{ secrets.GOOGLE_SHEETS_WEBAPP_URL }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          url=os.environ['GOOGLE_SHEET_WEBAPP_URL']
          last=None
          for attempt in range(5):
              try:
                  u=url+('&' if '?' in url else '?')+urllib.parse.urlencode({'action':'health'})
                  req=urllib.request.Request(u,headers={'User-Agent':'MBA-V8-Benchmark/1.0'})
                  with urllib.request.urlopen(req,timeout=90) as r:
                      data=json.loads(r.read().decode())
                  if data.get('success'):
                      print('Google Sheet endpoint: healthy')
                      print(data)
                      break
                  last=data
              except Exception as exc:
                  last=repr(exc)
                  print(f'Health check attempt {attempt+1}/5 failed: {last}')
              if attempt < 4:
                  time.sleep(10*(attempt+1))
          else:
              raise SystemExit(f'Google Sheet health check failed after 5 attempts: {last}')
          PY

      - name: Verify V8 source integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/independent_college_content_agent_v8.py')
          s=p.read_text(encoding='utf-8')
          required=[
              'research_text,source_pages=research(url)',
              'content_prompt(college,rank,url,research_text,[p.get("type")],existing)',
              'def render_page(page, college, rank, official_url, internal_links, filename, source_pages=None):',
              'planned_files=[]',
              'allowed_existing=existing | set(planned_files)',
              'render_page(p,college,rank,url,related,fn,source_pages)',
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('V8 source integrity check failed: '+repr(missing))
          print('V8 source integrity: OK')
          PY

      - name: Gemini API preflight
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
        run: |
          python - <<'PY'
          import json, os, requests
          model=os.environ['GEMINI_MODEL']
          key=os.environ['GEMINI_API_KEY']
          url=f'https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent'
          payload={"contents":[{"role":"user","parts":[{"text":"Reply with exactly: GEMINI_PREFLIGHT_OK"}]}],"generationConfig":{"temperature":0,"maxOutputTokens":20}}
          r=requests.post(url,headers={'x-goog-api-key':key,'Content-Type':'application/json'},json=payload,timeout=60)
          print('Gemini preflight HTTP:',r.status_code)
          if not r.ok:
              print('Gemini preflight body:',r.text[:4000])
              r.raise_for_status()
          print('Gemini preflight response:',r.json())
          PY

      - name: Harden Gemini error reporting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/independent_college_content_agent_v8.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('def gemini(')
          end=s.index('\ndef read_master', start)
          replacement='''def gemini(prompt, tokens=30000):
    if not API_KEY:
        raise RuntimeError("GEMINI_API_KEY is missing")
    endpoint = f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL}:generateContent"
    payload = {"contents":[{"role":"user","parts":[{"text":prompt}]}],"generationConfig":{"temperature":0.12,"maxOutputTokens":tokens,"responseMimeType":"application/json"}}
    last_error = None
    for attempt in range(4):
        try:
            r = session.post(endpoint, headers={"x-goog-api-key": API_KEY, "Content-Type": "application/json"}, json=payload, timeout=180)
            print(f"Gemini request: model={MODEL} attempt={attempt+1}/4 http={r.status_code} prompt_chars={len(prompt)}")
            if not r.ok:
                body = r.text[:5000]
                print(f"Gemini error body: {body}")
            if r.status_code in (429,500,502,503,504):
                last_error = f"HTTP {r.status_code}: {r.text[:2000]}"
                time.sleep(5*(attempt+1)); continue
            r.raise_for_status()
            data = r.json()
            candidates = data.get("candidates") or []
            if not candidates:
                raise RuntimeError(f"Gemini returned no candidates: {json.dumps(data)[:5000]}")
            content = candidates[0].get("content") or {}
            parts = content.get("parts") or []
            raw = "".join(str(x.get("text", "")) for x in parts if isinstance(x, dict))
            if not raw.strip():
                finish = candidates[0].get("finishReason")
                raise RuntimeError(f"Gemini returned empty text; finishReason={finish}; response={json.dumps(data)[:5000]}")
            try:
                return json.loads(raw)
            except json.JSONDecodeError as exc:
                finish = candidates[0].get("finishReason")
                raise RuntimeError(f"Gemini JSON parse failed: {exc}; finishReason={finish}; raw_prefix={raw[:3000]}") from exc
        except requests.RequestException as exc:
            last_error = f"{type(exc).__name__}: {exc}"
            if attempt == 3:
                raise RuntimeError(f"Gemini HTTP request failed after 4 attempts: {last_error}") from exc
            time.sleep(5*(attempt+1))
    raise RuntimeError(f"Gemini request failed after retries: {last_error}")
'''
          p.write_text(s[:start]+replacement+s[end:],encoding='utf-8')
          print('Gemini diagnostics patch: applied')
          PY

      - name: Persist Gemini diagnostics patch
        run: |
          git diff -- scripts/independent_college_content_agent_v8.py
          git add scripts/independent_college_content_agent_v8.py
          git commit -m "Improve V8 Gemini diagnostics" || echo "No Gemini source changes to commit"
          git push origin main || true

      - name: Apply V8.1 QA and revision hardening
        run: python scripts/harden_v8_runtime.py

      - name: Persist V8.1 hardening
        run: |
          python -m py_compile scripts/independent_college_content_agent_v8.py scripts/harden_v8_runtime.py
          git diff -- scripts/independent_college_content_agent_v8.py
          git add scripts/independent_college_content_agent_v8.py
          git commit -m "Harden V8 QA and compact revisions" || echo "No V8.1 source changes to commit"
          git push origin main || true

      - name: Verify V8.1 hardening
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/independent_college_content_agent_v8.py').read_text(encoding='utf-8')
          required=[
              'def revise_page(page, college, rank, official_url, issues):',
              'architecture failures:',
              'insufficient content sections',
              'required_generated_sections=7 if ptype=="placement" else 8',
              'revised=revise_page(p,college,rank,url,issues)',
          ]
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('V8.1 hardening verification failed: '+repr(missing))
          print('V8.1 hardening: OK')
          PY

      - name: Run controlled V8 benchmark test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SHEET_WEBAPP_URL: ${{ secrets.GOOGLE_SHEETS_WEBAPP_URL }}
          GOOGLE_SHEETS_API_SECRET: ${{ secrets.GOOGLE_SHEETS_API_SECRET }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          COLLEGE_BATCH_SIZE: '1'
          COLLEGE_TEST_RANK: '30'
        run: python scripts/controlled_v8_rank30_test.py

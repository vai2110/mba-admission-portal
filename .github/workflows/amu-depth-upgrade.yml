name: AMU depth upgrade
on:
  workflow_dispatch:
  push:
    paths:
      - 'amu-aligarh.html'
      - 'amu-aligarh-placements.html'
      - 'amu-btech.html'
      - 'amu-mba.html'
      - 'amu-mbbs.html'
      - 'amu-barch.html'
jobs:
  deepen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Expand AMU content
        shell: python
        run: |
          from pathlib import Path
          import re
          files = {}
          files['amu-aligarh.html'] = r'''<section class="main-section" id="academic-ecosystem"><h2>Academic Ecosystem: What AMU Offers Beyond the Popular Courses</h2><p>AMU is not a single-stream university. Its academic structure spans engineering and technology, medicine, dentistry, law, management, commerce, science, social sciences, arts, theology, agricultural sciences and several professional disciplines. This breadth matters for students who are comparing AMU with specialised institutions: the university environment gives access to multiple faculties, research centres, residential halls and cross-disciplinary academic exposure.</p><p>For a student researching admissions, the most useful way to navigate this breadth is to start with the intended career field and then work backwards to the programme, admission route, eligibility, fee structure and placement or higher-study pathway. A course that looks attractive because of the university's overall reputation may not necessarily be the best fit for a particular career goal.</p><div class="table-wrapper"><table><tr><th>Student goal</th><th>Relevant AMU pathway</th><th>What to investigate before applying</th></tr><tr><td>Engineering & technology</td><td>B.Tech / B.E. / M.Tech and related programmes</td><td>Branch, AMU test, intake, fee, internships, placement brochure and higher-study data</td></tr><tr><td>Management</td><td>MBA and related management programmes</td><td>Entrance test, campus, specialisation, total cost, placement brochure and recruiter roles</td></tr><tr><td>Medicine</td><td>MBBS / postgraduate medical programmes</td><td>NEET route, seat matrix, clinical exposure, internship and postgraduate pathway</td></tr><tr><td>Law</td><td>B.A.LL.B. and postgraduate law</td><td>Admission route, programme structure, moot/career exposure and placement information</td></tr><tr><td>Science & research</td><td>B.Sc., M.Sc. and research programmes</td><td>Subject combination, laboratory exposure, research opportunities and higher studies</td></tr></table></div></section><section class="main-section" id="admission-calendar"><h2>AMU Admission 2026-27: What Students Should Track</h2><p>AMU admissions are managed through course-specific notifications rather than one universal calendar. The Controller of Examinations publishes the admission guide, application notices, entrance-test information, answer keys/results, firm admission lists and related counselling or verification notices. Students should therefore create a course-specific checklist rather than relying on a generic “AMU admission date”.</p><h3>Before the application window</h3><p>Identify the exact course code, confirm the qualifying subjects and minimum marks, determine whether the programme uses an AMU admission test, CUET, NEET or another route, and keep scanned documents ready. Candidates should also check whether a programme has separate self-finance or special-category seats because the fee and selection conditions can differ.</p><h3>After submitting the form</h3><p>Save the application number and payment confirmation, download the admit card when issued, follow the published test pattern, and monitor the official portal for corrections, answer keys, results and admission lists. For national-level examinations such as NEET or CUET, students must also follow the relevant national counselling or examination authority instructions.</p></section><section class="main-section" id="documents"><h2>Documents Required for AMU Admission</h2><p>The exact document set varies by programme and admission category, but students should be prepared to produce academic records and category or eligibility documents during verification. Typical documents include the qualifying examination marksheet/certificate, date-of-birth proof, photographs, identity proof, category certificate where applicable, transfer/migration documents where applicable, and the relevant entrance-examination score or rank document.</p><div class="decision-grid"><div class="decision-card"><strong>UG applicants</strong><p>Keep Class 10 and Class 12 records, subject-wise marks, identity/date-of-birth proof and category or domicile-related documents where applicable.</p></div><div class="decision-card"><strong>PG applicants</strong><p>Keep the bachelor's degree/marksheets, qualifying entrance-test records where applicable and any category or special-quota documents.</p></div><div class="decision-card"><strong>Medical applicants</strong><p>Keep NEET documentation and the medical/admission documents requested after allotment. Medical fitness requirements apply to the MBBS route.</p></div><div class="decision-card"><strong>Special categories</strong><p>Read the applicable section of the current admission guide carefully because supporting certificates can determine eligibility for a specific seat category.</p></div></div></section><section class="main-section" id="scholarships"><h2>Scholarships & Financial Support</h2><p>Students should not assume that AMU has one universal merit scholarship. Financial support is distributed through university notices, the Dean Students' Welfare office, donor scholarships and government scholarship schemes. The Dean Students' Welfare notice board currently carries 2026-27 Uttar Pradesh scholarship notices as well as donor and other scholarship announcements.</p><p>Eligibility, income limits, category conditions, application windows and renewal requirements can differ significantly. Students should monitor the official AMU scholarship/DSW notices after admission and maintain the documents needed for the relevant scholarship portal.</p><div class="notice"><strong>Practical advice</strong><p>Scholarship availability is time-sensitive. Treat a scholarship notice as an opportunity to apply, not as an automatic fee waiver. Check the current notice, eligibility conditions and deadline for your course and category.</p></div></section><section class="main-section" id="research"><h2>Research, Higher Studies & Academic Exposure</h2><p>AMU's value proposition extends beyond immediate employment. Departments publish higher-study and research activity, and ZHCET's Training & Placement Office maintains branch-wise higher-studies data for the 2025 engineering batch. This is useful for students considering M.Tech, MS, MBA, doctoral study, competitive examinations or research-oriented careers after graduation.</p><p>The right metric therefore depends on the student's goal. A student targeting a software role may prioritise internships and technical projects; a student targeting academia may value laboratories, faculty research and progression to higher studies; and a medical student may evaluate clinical exposure and postgraduate preparation.</p></section><section class="main-section" id="hostel"><h2>Hostels, Residential Life & Student Facilities</h2><p>Residential life is a distinctive part of the AMU campus model. The university describes its Halls of Residence as centres of corporate student life, with common dining, reading rooms, libraries, sports clubs and literary or cultural societies. Hall facilities vary, but official hall pages list Wi-Fi, reading rooms, common rooms, sports facilities, dining halls, computer rooms, gyms and other student amenities.</p><p>Students should remember that hostel allocation, availability, fees and rules are separate from academic admission. The existence of hostel infrastructure does not mean that every admitted student is automatically guaranteed a room in a particular hall.</p></section><section class="main-section" id="decision-framework"><h2>Is AMU the Right Choice? A Student Decision Framework</h2><div class="decision-grid"><div class="decision-card"><strong>Choose AMU when...</strong><p>You value a large multidisciplinary university, established academic departments, residential campus life and a broad public-institution ecosystem.</p></div><div class="decision-card"><strong>Think twice when...</strong><p>You want a highly standardised admission route across all courses or a single university-wide placement metric that can be compared directly with specialised private institutions.</p></div><div class="decision-card"><strong>For ROI-conscious students</strong><p>Compare the exact programme fee against programme-level placement outcomes, internship access, likely career roles and opportunity cost rather than using university-level reputation alone.</p></div><div class="decision-card"><strong>For higher studies</strong><p>Give greater weight to department faculty, laboratories, research activity, higher-study progression and the academic ecosystem relevant to your subject.</p></div></div></section>'''
          files['amu-aligarh-placements.html'] = r'''<section class="main-section" id="2026-activity"><h2>AMU Placement Activity in 2026</h2><p>AMU's placement pages show that recruitment activity is continuing through 2026 rather than being limited to one annual placement season. Recent General TPO notices include roles and drives involving Anand Rathi, DXC Technology, Skillflow Learning, Silverskills, CodeYoung, TalentRecruit, Central Square Foundation, WSP India and other employers. A September 2026 notice also records an international recruitment drive by IFFCO Group in Dubai.</p><p>For engineering, ZHCET separately lists 2026 recruitment activity for employers such as Qualcomm, Zoom Communications, Infoglen, Shubham Flexible Packaging Machines, Black Apple Technologies, ASC International and others. The eligibility is often branch- and batch-specific, which makes these notices more useful than a generic recruiter list when deciding whether a programme has relevant career opportunities.</p></section><section class="main-section" id="recruiter-fit"><h2>Recruiters and Roles: Why the Job Profile Matters</h2><p>A recruiter name alone does not tell a student what the placement outcome looks like. AMU's current notices demonstrate roles ranging from software and technology recruitment to engineering, finance, sales, claims, education and consulting-related opportunities. The same employer may also recruit different programmes for different job families.</p><div class="table-wrapper"><table><tr><th>Career area</th><th>Examples visible in current official notices</th><th>Student preparation</th></tr><tr><td>Technology</td><td>Software/technology recruitment and computer/AI/MCA eligibility in ZHCET notices</td><td>Coding, DSA where relevant, projects, aptitude and technical interviews</td></tr><tr><td>Core engineering</td><td>Chemical, electrical, mechanical, civil and other branch-specific roles</td><td>Core subjects, internships, industrial exposure and technical interview preparation</td></tr><tr><td>Finance/management</td><td>Anand Rathi relationship-manager role; MBA Finance/Marketing eligibility</td><td>Financial awareness, communication, Excel and role-specific business knowledge</td></tr><tr><td>Sales/business development</td><td>Skillflow Learning, CodeYoung and other business-development/sales opportunities</td><td>Communication, persuasion, market understanding and interview readiness</td></tr></table></div></section><section class="main-section" id="internship-evidence"><h2>Internships and Higher Studies as Placement Alternatives</h2><p>Not every student outcome is a campus job. ZHCET maintains dedicated internship/training resources and branch-wise higher-studies data for the 2025 batch. This makes it possible to evaluate an engineering programme on a broader outcome spectrum: placement, internship, higher education and competitive-examination progression.</p><p>Students should ask the placement office or department for the latest brochure and determine whether the reported numbers cover only campus placements, all eligible students, registered students or another denominator. That definition can materially change how a placement percentage should be interpreted.</p></section><section class="main-section" id="placement-checklist"><h2>What to Check Before Joining AMU for Placements</h2><ol><li>Ask for the latest programme or department placement brochure.</li><li>Check the median or average package if officially reported, not only the highest package.</li><li>Review recruiter roles and eligibility, especially for your branch or specialisation.</li><li>Check internship participation and whether internships convert into full-time offers.</li><li>Review higher-studies data if your plan includes MS, M.Tech, MBA, PhD or competitive examinations.</li><li>Compare the outcome against the exact fee and total cost of the programme.</li></ol></section>'''
          files['amu-btech.html'] = r'''<section class="main-section" id="branch-comparison"><h2>AMU B.Tech Branch Comparison</h2><p>The 2026-27 intake includes both established core branches and newer technology-focused options. A higher-demand branch should not automatically be treated as the best branch for every student. The correct choice depends on career intent, academic strengths and willingness to build skills beyond the classroom.</p><div class="table-wrapper"><table><tr><th>Branch family</th><th>Typical career direction</th><th>What to prioritise</th></tr><tr><td>Computer / AI</td><td>Software, AI, data, cloud and technology roles</td><td>Coding, DSA, projects, internships and technical interview preparation</td></tr><tr><td>ECE / VLSI</td><td>Semiconductors, embedded systems, electronics and communications</td><td>Digital electronics, VLSI tools, embedded projects and industry exposure</td></tr><tr><td>Electrical</td><td>Power, electrical systems, automation, energy and public-sector roles</td><td>Core subjects, software tools, projects and internships</td></tr><tr><td>Mechanical / Automobile</td><td>Manufacturing, automotive, design, production and mobility</td><td>CAD/CAE, manufacturing exposure, projects and core internships</td></tr><tr><td>Civil</td><td>Construction, infrastructure, structural and public-sector roles</td><td>Design tools, site exposure, structures and project work</td></tr><tr><td>Chemical / Food / Petrochemical</td><td>Process, refining, food technology, chemicals and manufacturing</td><td>Process knowledge, plant exposure, safety and technical internships</td></tr></table></div></section><section class="main-section" id="exam-preparation"><h2>AMU B.Tech Entrance Test Preparation</h2><p>The B.Tech admission test is objective-type and covers Physics, Chemistry and Mathematics. Preparation should therefore begin with the qualifying-examination syllabus but should also include timed objective practice because speed and accuracy matter in a competitive test.</p><h3>A practical preparation sequence</h3><ol><li>Finish the core concepts of Physics, Chemistry and Mathematics.</li><li>Create a formula and reaction revision sheet.</li><li>Practise mixed-topic objective questions rather than studying only chapter-wise.</li><li>Use timed mock papers to improve question selection and reduce avoidable errors.</li><li>Track weak chapters and revise them repeatedly during the final preparation phase.</li></ol></section><section class="main-section" id="career-outcomes"><h2>Career Outcomes After B.Tech</h2><p>Engineering outcomes at AMU should be evaluated using three evidence streams: campus placements, internships and higher studies. ZHCET maintains dedicated resources for all three. Current recruitment notices also demonstrate that eligibility can be highly specific: some drives target Computer/AI, some target core branches, and some allow all engineering branches.</p><p>This means students should build a profile that remains employable even if the preferred recruiter does not visit campus. Projects, internships, technical certifications, coding or engineering software skills and communication can materially affect the final outcome.</p></section><section class="main-section" id="cost-value"><h2>B.Tech Cost vs Career Value</h2><p>AMU's admission-time B.Tech fees are relatively course-specific and include different amounts for regular and self-finance seats in the current guide. Students should compare the complete four-year cost rather than only the first admission payment. Include later-semester university charges, hostel and mess expenses, books, laptop/software needs, travel and project costs.</p><p>For ROI, compare that total with the branch-specific placement and higher-study evidence. A low academic fee does not automatically guarantee high ROI, and a higher fee does not automatically mean better outcomes.</p></section>'''
          files['amu-mba.html'] = r'''<section class="main-section" id="test-preparation"><h2>How to Prepare for the AMU MBA Entrance Test</h2><p>The 2026-27 written test has four equal sections: Verbal Ability & Reading Comprehension, Data Interpretation & Logical Reasoning, Quantitative Ability and General Awareness. Because each carries 25 marks, candidates should avoid preparing only for quantitative aptitude.</p><div class="table-wrapper"><table><tr><th>Section</th><th>Preparation focus</th><th>Common student mistake</th></tr><tr><td>VARC</td><td>Reading comprehension, vocabulary, grammar and verbal reasoning</td><td>Ignoring reading practice until the final weeks</td></tr><tr><td>DILR</td><td>Tables, charts, arrangements, puzzles and logical sets</td><td>Spending too long on one difficult set</td></tr><tr><td>Quantitative Ability</td><td>Arithmetic, algebra, geometry and data-based calculation</td><td>Focusing on advanced questions before strengthening basics</td></tr><tr><td>General Awareness</td><td>Current affairs, business, economy, national and international awareness</td><td>Relying on one last-minute current-affairs revision</td></tr></table></div></section><section class="main-section" id="campus-options"><h2>Aligarh MBA vs MBA at AMU Centres</h2><p>The admission guide lists MBA opportunities not only at Aligarh but also at AMU centres such as Malappuram, Murshidabad and Kishanganj. These programmes should not be treated as interchangeable simply because they carry the AMU name.</p><p>Before choosing a centre, compare campus location, intake, fee, faculty, curriculum, placement brochure, recruiter base and residential arrangements. A student should use centre-specific evidence wherever possible.</p></section><section class="main-section" id="mba-career-fit"><h2>Which MBA Specialisation Fits Your Career Goal?</h2><div class="decision-grid"><div class="decision-card"><strong>Finance</strong><p>Consider this route if you are targeting banking, financial services, corporate finance, analysis or related roles and are willing to build Excel, financial modelling and business-analysis skills.</p></div><div class="decision-card"><strong>Marketing</strong><p>Suitable for brand, digital marketing, sales, market research and customer-facing careers. Communication and analytical skills remain important.</p></div><div class="decision-card"><strong>Human Resource</strong><p>Relevant for recruitment, HR operations, learning and development and people-management roles. Internships and communication skills can strengthen the profile.</p></div><div class="decision-card"><strong>Operations & IT</strong><p>Useful for operations, technology-enabled business processes, analytics and information-systems-oriented roles.</p></div></div></section><section class="main-section" id="mba-roi"><h2>AMU MBA ROI: What Should You Compare?</h2><p>Do not evaluate the MBA only by its admission fee or a single historical highest package. A stronger ROI assessment combines total two-year cost, average/median salary where officially available, placement participation, recruiter roles, internship quality, location and the percentage of students progressing to higher studies or other outcomes.</p><p>The Department of Business Administration maintains placement-related material, but older placement announcements should be labelled by year. For 2026 decisions, use the newest available batch-level brochure and distinguish historical individual offers from current batch statistics.</p></section>'''
          files['amu-mbbs.html'] = r'''<section class="main-section" id="neet-strategy"><h2>NEET-UG Strategy for AMU MBBS Aspirants</h2><p>Since MBBS admission is based on NEET-UG, the AMU-specific preparation question is not a separate university entrance syllabus. The competitive challenge is the national medical entrance examination followed by the applicable counselling and allotment process.</p><p>Students should track the relevant seat matrix, category, quota and counselling round before interpreting a previous year's closing rank. The same score can have a different admission implication across different rounds or categories.</p></section><section class="main-section" id="medical-learning"><h2>What to Evaluate Beyond the MBBS Seat Count</h2><p>A medical college decision should consider clinical exposure, teaching departments, patient load, internship structure, laboratories, library access, student support and postgraduate opportunities. JNMC is the clinical teaching environment associated with AMU's medical education, and AMU's medical departments publish their own academic and training information.</p><div class="table-wrapper"><table><tr><th>Factor</th><th>Why it matters</th></tr><tr><td>Clinical exposure</td><td>Determines the breadth of cases and practical learning available during clinical years.</td></tr><tr><td>Internship</td><td>Provides supervised hands-on exposure across clinical departments and is compulsory after the academic programme.</td></tr><tr><td>PG ecosystem</td><td>Useful for students planning postgraduate medical education and specialty careers.</td></tr><tr><td>Student support</td><td>Hostels, health services, academic support and campus facilities influence the overall student experience.</td></tr></table></div></section><section class="main-section" id="mbbs-cost"><h2>MBBS Cost: What the Admission Fee Does and Does Not Tell You</h2><p>The current admission guide lists ₹55,900 payable at admission for MBBS. Students should not interpret that single payment as the total five-and-a-half-year financial requirement. Hostel, mess, later university charges, books, equipment, travel and personal expenses should be budgeted separately.</p></section><section class="main-section" id="post-mbbs"><h2>What Can You Do After MBBS?</h2><p>After completing the academic programme and compulsory internship and satisfying the applicable registration requirements, graduates can enter clinical practice, prepare for postgraduate medical education, explore public health or health administration, or pursue research and academic pathways.</p><p>The choice of medical college should therefore be aligned with the student's longer-term plan. Students aiming for postgraduate specialisation may give additional weight to clinical exposure, department strength and the academic environment for entrance preparation.</p></section>'''
          files['amu-barch.html'] = r'''<section class="main-section" id="aptitude-prep"><h2>B.Arch Aptitude & Admission Preparation</h2><p>The B.Arch admission route requires students to satisfy the prescribed qualifying-examination conditions and the architecture aptitude requirement specified by AMU, including the NATA qualification condition stated in the admission guide. Candidates should prepare for architecture aptitude rather than treating the process like a conventional PCM-only engineering admission.</p><h3>What to build before joining</h3><p>Develop observation, visualisation, basic drawing, spatial understanding, design thinking and awareness of buildings and the built environment. These skills also help later when studio-based learning becomes a major part of the programme.</p></section><section class="main-section" id="studio-learning"><h2>B.Arch Curriculum: Why Studio Work Matters</h2><p>Architecture is a studio-heavy discipline. Along with history and theory, students work on design problems, drawings, models, building construction, structures, services, planning and professional practice. AMU's Department of Architecture publishes a syllabus for students admitted from the 2025-26 session onward.</p><p>Students should therefore evaluate an architecture programme through studio culture, faculty guidance, software and visualisation exposure, construction learning, site visits, portfolio development and professional practice opportunities—not simply through the admission fee.</p></section><section class="main-section" id="career-path"><h2>Career Path After B.Arch</h2><div class="decision-grid"><div class="decision-card"><strong>Architectural practice</strong><p>Work with architecture and design firms while developing professional experience and the requirements applicable to architectural practice.</p></div><div class="decision-card"><strong>Urban planning</strong><p>Higher study can open routes into urban and regional planning and related built-environment disciplines.</p></div><div class="decision-card"><strong>Construction & project roles</strong><p>Graduates can explore construction management, coordination, design documentation and allied roles.</p></div><div class="decision-card"><strong>Higher studies</strong><p>M.Arch, M.Plan and allied postgraduate pathways are relevant for specialisation and academic careers.</p></div></div></section><section class="main-section" id="architecture-roi"><h2>B.Arch Cost, Studio Expenses & ROI</h2><p>The admission-time B.Arch fee in the 2026-27 guide is ₹25,500, but architecture students should also plan for studio materials, printing, model-making, software and project-related expenses. The practical cost of the degree is therefore broader than the university fee alone.</p></section>'''
          for path, addition in files.items():
              p=Path(path)
              text=p.read_text()
              if addition.split('id="')[1].split('"')[0] in text:
                  continue
              marker='<section class="main-section" id="faq">'
              if marker not in text:
                  raise SystemExit(f'FAQ marker missing: {path}')
              text=text.replace(marker, addition+marker, 1)
              p.write_text(text)
          # Expand overview on-page navigation to expose the new depth.
          p=Path('amu-aligarh.html'); t=p.read_text()
          t=t.replace('<a href="#choose">Which Course?</a><a href="#faq">FAQs</a>','<a href="#academic-ecosystem">Academic Ecosystem</a><a href="#admission-calendar">Admission Calendar</a><a href="#documents">Documents</a><a href="#scholarships">Scholarships</a><a href="#research">Research & Higher Studies</a><a href="#hostel">Hostels & Residential Life</a><a href="#decision-framework">Decision Framework</a><a href="#faq">FAQs</a>')
          p.write_text(t)
          # Expand placement on-page navigation.
          p=Path('amu-aligarh-placements.html'); t=p.read_text()
          t=t.replace('<a href="#overview">Placement Overview</a><a href="#structure">Placement Structure</a><a href="#engineering">Engineering</a><a href="#management">MBA &amp; Management</a><a href="#recruiters">Recruiter Activity</a><a href="#internships">Internships &amp; Training</a><a href="#interpret">How to Read Data</a><a href="#faq">FAQs</a>','<a href="#overview">Placement Overview</a><a href="#structure">Placement Structure</a><a href="#engineering">Engineering</a><a href="#management">MBA &amp; Management</a><a href="#recruiters">Recruiter Activity</a><a href="#2026-activity">2026 Activity</a><a href="#recruiter-fit">Recruiter & Role Fit</a><a href="#internship-evidence">Internships & Higher Studies</a><a href="#placement-checklist">Placement Checklist</a><a href="#interpret">How to Read Data</a><a href="#faq">FAQs</a>')
          p.write_text(t)
      - name: Commit AMU depth upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amu-*.html
          git diff --cached --quiet || git commit -m "Expand AMU pages to IIM-level content depth"
          git push

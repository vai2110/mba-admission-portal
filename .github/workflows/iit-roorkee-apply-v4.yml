name: IIT Roorkee UI Fix v4

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply final IIT Roorkee UI [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final component rules
        shell: python
        run: |
          from pathlib import Path
          import re
          pages=[Path('iit-roorkee.html'),Path('iit-roorkee-mba.html'),Path('iit-roorkee-executive-mba.html'),Path('iit-roorkee-placements.html')]
          for p in pages:
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              # Normalize the full body typography to the benchmark font.
              s=re.sub(r'body\{[^}]*\}', 'body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033;line-height:1.65}', s, count=1)
              # Normalize the desktop hero component to the SIBM Pune benchmark.
              s=re.sub(r'\.hero\{[^}]*\}', '.hero{background:linear-gradient(110deg,#172554 0%,#1d4ed8 100%);color:#fff;padding:38px 0}', s, count=1)
              s=re.sub(r'\.hero-container\{[^}]*\}', '.hero-container{width:min(1240px,calc(100% - 40px));margin:auto}', s, count=1)
              s=re.sub(r'\.hero h1\{[^}]*\}', '.hero h1{font-size:36px;line-height:1.18;margin:0 0 9px;max-width:900px}', s, count=1)
              # Some pages may not have a hero h2 selector; insert the approved rule if absent.
              if '.hero h2{' in s:
                  s=re.sub(r'\.hero h2\{[^}]*\}', '.hero h2{font-size:16px;line-height:1.5;font-weight:600;color:#dbeafe;margin:0 0 10px;max-width:900px}', s, count=1)
              else:
                  s=s.replace('</style>', '.hero h2{font-size:16px;line-height:1.5;font-weight:600;color:#dbeafe;margin:0 0 10px;max-width:900px}</style>', 1)
              if '.hero-location{' in s:
                  s=re.sub(r'\.hero-location\{[^}]*\}', '.hero-location{font-size:13px;color:#dbeafe;font-weight:600}', s, count=1)
              # Keep one visible Quick Answer. Remove only the duplicate answer-first block.
              if '<div class="ans">' in s:
                  s=re.sub(r'<div[^>]+class=["\']answer-first["\'][^>]*>.*?</div>\s*', '', s, count=1, flags=re.S)
              if p.name=='iit-roorkee-placements.html':
                  s=re.sub(r'<h1>IIT Roorkee MBA Placements[^<]*?</h1>', '<h1>IIT Roorkee MBA Placements: Average Package, Median &amp; Highest CTC</h1>', s, count=1)
              p.write_text(s,encoding='utf-8')
          # Persist the user-approved rules for all future creation/audit passes.
          a=Path('AGENTS.md')
          txt=a.read_text(encoding='utf-8') if a.exists() else '# MBA Portal College Page Agent\n'
          marker='## Locked Hero, Quick Answer and H2 Rules'
          if marker not in txt:
              txt += '''\n\n## Locked Hero, Quick Answer and H2 Rules\n- Use the SIBM Pune hero container as the benchmark: compact text-first hero, same proportions, spacing and established typography; never redesign it independently.\n- Use the IIM Ahmedabad/SIBM Pune approved `Arial, Helvetica, sans-serif` font stack and established font sizes.\n- Exactly one visible Quick Answer block per page; remove duplicate introductory answer blocks.\n- H2s must be short, specific, student-intent driven and naturally keyword optimised, never generic filler.\n- Placement H1s must be concise and keyword-led; keep year-specific details in metadata/body.\n- These are hard QA rules for every new page and every existing-page modification.\n'''
              a.write_text(txt,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iit-roorkee*.html AGENTS.md
          git diff --cached --quiet || git commit -m 'Apply final IIT Roorkee UI [skip ci]'
          git push
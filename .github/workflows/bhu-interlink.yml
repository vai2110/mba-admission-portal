name: BHU course interlink update
on:
  push:
    paths:
      - 'banaras-hindu-university.html'
      - '.github/workflows/bhu-interlink.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add BHU course and placement links
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('banaras-hindu-university.html')
          s=p.read_text()
          old='<p>For 2026, BHU also listed separate practical-test routes for BFA and BPA. Their final merit includes CUET performance plus the practical examination conducted by BHU.</p>'
          new='''<p>For 2026, BHU also listed separate practical-test routes for BFA and BPA. Their final merit includes CUET performance plus the practical examination conducted by BHU.</p><div class="table-wrapper"><table><thead><tr><th>Course</th><th>Dedicated guide</th><th>Admission route</th></tr></thead><tbody><tr><td>BA Hons</td><td><a href="bhu-ba-hons.html">BHU BA Hons</a></td><td>CUET-UG + CAP-UG</td></tr><tr><td>BSc Hons</td><td><a href="bhu-bsc-hons.html">BHU BSc Hons</a></td><td>CUET-UG + CAP-UG</td></tr><tr><td>BCom Hons</td><td><a href="bhu-bcom-hons.html">BHU BCom Hons</a></td><td>CUET-UG + CAP-UG</td></tr><tr><td>BA LLB</td><td><a href="bhu-ba-llb.html">BHU BA LLB</a></td><td>CUET-UG + CAP-UG</td></tr><tr><td>BSc Agriculture</td><td><a href="bhu-bsc-agriculture.html">BHU BSc Agriculture</a></td><td>CUET-UG + CAP-UG</td></tr><tr><td>BTech Dairy Technology</td><td><a href="bhu-btech-dairy-technology.html">BHU BTech Dairy Technology</a></td><td>CUET-UG + CAP-UG</td></tr><tr><td>MBA</td><td><a href="bhu-mba.html">BHU MBA</a></td><td>CUET-PG / programme-specific</td></tr></tbody></table></div><p>For salary, recruiter and university-level placement numbers, see the <a href="bhu-placements.html">dedicated BHU placements page</a>.</p>'''
          if old in s and 'bhu-ba-hons.html' not in s:
              s=s.replace(old,new,1)
          old2='<p>This is useful evidence of recruiter activity, but it is <strong>not a university-wide MBA/BHU average package</strong>. It should be read as the placement outcome of the specific unit reported in the Annual Report.</p>'
          new2=old2+'<p><a href="bhu-placements.html">Read the full BHU placements page with NIRF data, official Annual Report figures and recruiter details.</a></p>'
          if old2 in s and 'Read the full BHU placements page' not in s:
              s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add banaras-hindu-university.html
          git diff --cached --quiet || git commit -m 'Interlink BHU overview with course and placement pages'
          git push
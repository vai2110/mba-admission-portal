name: Add Editorial Update Metadata

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-meta
  cancel-in-progress: true

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add editorial metadata script to every sitemap page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import urllib.parse
          import xml.etree.ElementTree as ET
          root = ET.fromstring(Path("sitemap.xml").read_text(encoding="utf-8"))
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          script = '<script src="/assets/editorial-meta.js?v=20260930fix"></script>'
          changed = 0
          for item in root.findall("sm:url", ns):
              loc = item.find("sm:loc", ns)
              if loc is None: continue
              path = urllib.parse.urlparse(loc.text.strip()).path.strip("/")
              candidates = [Path("index.html")] if not path else [Path(path), Path(path + ".html"), Path(path) / "index.html"]
              file = next((p for p in candidates if p.is_file()), None)
              if file is None: continue
              text = file.read_text(encoding="utf-8", errors="ignore")
              text = re.sub(r'<div[^>]*id=["\']cdEditorialMeta["\'][^>]*>.*?</div\s*>','',text,flags=re.I|re.S)
              text = re.sub(r'<style[^>]*id=["\']cdEditorialMetaStaticStyles["\'][^>]*>.*?</style\s*>','',text,flags=re.I|re.S)
              text = re.sub(r'(</(?:div|section|article|main|footer|header|body|p|ul|ol|li)>)\s*(?:\\n\s*)+',r'\1',text,flags=re.I)
              text = re.sub(r'(?<!\\)\\n+','',text)
              cleaned = re.sub(r'<script[^>]+src=["\']/assets/editorial-meta\.js(?:\?[^"\']*)?["\'][^>]*></script>\s*','',text,flags=re.I)
              updated = re.sub(r'</head>',script+'\n</head>',cleaned,count=1,flags=re.I) if re.search(r'</head>',cleaned,flags=re.I) else cleaned
              if updated != text:
                  file.write_text(updated,encoding="utf-8"); changed += 1
          print(f"Editorial metadata script injected into {changed} sitemap-backed HTML pages.")
          PY
      - name: Commit changes
        run: |
          git config user.name "CollegeDecoded Editorial Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML pages needed editorial metadata changes."
          else
            git commit -m "Ensure editorial metadata on every live sitemap page"
            git push
          fi

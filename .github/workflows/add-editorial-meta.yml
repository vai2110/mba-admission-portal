name: Add Editorial Update Metadata

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-meta
  cancel-in-progress: true

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add editorial metadata script to every sitemap page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import urllib.parse
          import xml.etree.ElementTree as ET

          root = ET.fromstring(Path("sitemap.xml").read_text(encoding="utf-8"))
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          script = '<script src="/assets/editorial-meta.js?v=20260930"></script>'
          changed = 0
          missing = []

          for item in root.findall("sm:url", ns):
              loc = item.find("sm:loc", ns)
              if loc is None:
                  continue
              url = loc.text.strip()
              path = urllib.parse.urlparse(url).path.strip("/")
              candidates = [Path("index.html")] if not path else [Path(path), Path(path + ".html"), Path(path) / "index.html"]
              file = next((p for p in candidates if p.is_file()), None)
              if file is None:
                  missing.append(url + " -> file missing")
                  continue

              text = file.read_text(encoding="utf-8", errors="ignore")
              cleaned = re.sub(
                  r'<script[^>]+src=["\']/assets/editorial-meta\.js(?:\?[^"\']*)?["\'][^>]*></script>\s*',
                  '',
                  text,
                  flags=re.I
              )
              if re.search(r'</head>', cleaned, flags=re.I):
                  updated = re.sub(r'</head>', script + '\n</head>', cleaned, count=1, flags=re.I)
              elif re.search(r'<head\b[^>]*>', cleaned, flags=re.I):
                  updated = re.sub(r'(<head\b[^>]*>)', r'\1\n' + script, cleaned, count=1, flags=re.I)
              elif re.search(r'<body\b[^>]*>', cleaned, flags=re.I):
                  updated = re.sub(r'(<body\b[^>]*>)', r'\1\n' + script, cleaned, count=1, flags=re.I)
              elif re.search(r'</html>', cleaned, flags=re.I):
                  updated = re.sub(r'</html>', script + '\n</html>', cleaned, count=1, flags=re.I)
              else:
                  updated = script + '\n' + cleaned
              if updated != text:
                  file.write_text(updated, encoding="utf-8")
                  changed += 1

          print(f"Editorial metadata script injected into {changed} sitemap-backed HTML pages.")
          if missing:
              print("WARNING: could not process:")
              for item in missing:
                  print(item)
          PY

      - name: Validate every sitemap page has editorial metadata script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.parse
          import xml.etree.ElementTree as ET

          root = ET.fromstring(Path("sitemap.xml").read_text(encoding="utf-8"))
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          failures = []

          for item in root.findall("sm:url", ns):
              loc = item.find("sm:loc", ns)
              if loc is None:
                  continue
              path = urllib.parse.urlparse(loc.text.strip()).path.strip("/")
              candidates = [Path("index.html")] if not path else [Path(path), Path(path + ".html"), Path(path) / "index.html"]
              file = next((p for p in candidates if p.is_file()), None)
              if file is None:
                  failures.append(f"{loc.text.strip()} -> file missing")
                  continue
              text = file.read_text(encoding="utf-8", errors="ignore")
              if "/assets/editorial-meta.js?v=20260930" not in text:
                  failures.append(f"{loc.text.strip()} -> metadata script missing")

          if failures:
              print("\n".join(failures))
              raise SystemExit(f"{len(failures)} sitemap pages failed editorial metadata validation")
          print("Validation passed: every sitemap-backed HTML page contains editorial metadata script.")
          PY

      - name: Place editorial metadata below the fact cards on every sitemap page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import urllib.parse
          import xml.etree.ElementTree as ET

          root = ET.fromstring(Path("sitemap.xml").read_text(encoding="utf-8"))
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}

          style_id = 'cdEditorialMetaStaticStyles'
          block_re = re.compile(
              r'\s*<div id=["\']cdEditorialMeta["\'][^>]*>.*?</div>\s*'
              r'<style id=["\']' + style_id + r'["\']>.*?</style>\s*',
              re.I | re.S
          )
          standalone_block_re = re.compile(
              r'\s*<div id=["\']cdEditorialMeta["\'][^>]*>.*?</div>\s*',
              re.I | re.S
          )
          standalone_style_re = re.compile(
              r'\s*<style id=["\']' + style_id + r'["\']>.*?</style>\s*',
              re.I | re.S
          )

          block_template = (
              '<div id="cdEditorialMeta" class="cd-editorial-meta-static">'
              '<span class="cd-editorial-item"><span class="cd-editorial-icon" aria-hidden="true">▣</span>'
              '<span><small>Last updated on</small><strong>{date}</strong></span></span>'
              '<span class="cd-editorial-divider" aria-hidden="true"></span>'
              '<span class="cd-editorial-item"><span class="cd-editorial-icon" aria-hidden="true">●</span>'
              '<span><small>Updated by</small><a href="/collegedecoded-team">CollegeDecoded Team</a></span></span>'
              '</div>'
          )
          style = (
              '<style id="cdEditorialMetaStaticStyles">'
              '.cd-editorial-meta-static{width:min(1180px,calc(100% - 36px));margin:0 auto 18px;'
              'padding:14px 22px;background:linear-gradient(90deg,#fff8eb,#fffdf8);'
              'border:1px solid #f6d9ad;border-radius:12px;display:flex;align-items:center;'
              'justify-content:center;gap:34px;color:#334155;font:13px/1.45 Arial,Helvetica,sans-serif;'
              'box-shadow:0 2px 8px rgba(15,23,42,.035)}'
              '.cd-editorial-item{display:flex;align-items:center;gap:11px;min-width:260px}'
              '.cd-editorial-icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;'
              'background:#ffedc9;color:#d97706;font-size:18px;font-weight:800;flex:0 0 36px}'
              '.cd-editorial-item small{display:block;color:#64748b;font-size:11px;line-height:1.25;margin-bottom:2px}'
              '.cd-editorial-item strong,.cd-editorial-item a{display:block;color:#123b78;font-size:14px;'
              'font-weight:800;text-decoration:none}'
              '.cd-editorial-item a{color:#2563eb}'
              '.cd-editorial-divider{width:1px;height:36px;background:#e9b56b;opacity:.85}'
              '@media(max-width:640px){.cd-editorial-meta-static{width:calc(100% - 24px);'
              'margin:0 auto 12px;padding:11px 14px;gap:12px;justify-content:space-between;'
              'border-radius:10px}.cd-editorial-item{min-width:0;gap:7px;flex:1}.cd-editorial-icon{'
              'width:30px;height:30px;flex-basis:30px;font-size:14px}.cd-editorial-item small{font-size:9px}'
              '.cd-editorial-item strong,.cd-editorial-item a{font-size:10.5px}.cd-editorial-divider{height:28px}}'
              '@media(max-width:380px){.cd-editorial-meta-static{padding:10px 10px;gap:8px}.cd-editorial-item{gap:5px}'
              '.cd-editorial-icon{width:27px;height:27px;flex-basis:27px;font-size:12px}.cd-editorial-item strong,'
              '.cd-editorial-item a{font-size:9.5px}}'
              '</style>'
          )

          def find_container_end(text, start):
              tag_re = re.compile(r'<div\b[^>]*>|</div\s*>', re.I)
              depth = 0
              for m in tag_re.finditer(text, start):
                  token = m.group(0)
                  if token.lower().startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          return m.end()
              return -1

          def insert_after_fact_cards(text, block):
              opening = re.search(
                  r'<(?:div|section)\b[^>]*class=["\'][^"\']*(?:facts|quick-facts|stats-wrapper|placement-meta-section|placement-meta-grid|snapshot-grid|course-grid|college-grid|card-grid|info-grid|stats\\b)[^"\']*["\'][^>]*>',
                  text, re.I
              )
              if opening:
                  end = find_container_end(text, opening.start())
                  if end >= 0:
                      return text[:end] + '\\n' + block + '\\n' + style + text[end:], True

              # Fallback for pages without a dedicated fact-card wrapper:
              # place the metadata after the first main content section following the hero.
              hero = re.search(r'<section\\b[^>]*class=["\'][^"\']*hero[^"\']*["\'][^>]*>', text, re.I)
              if not hero:
                  hero = re.search(r'<section\\b[^>]*class=["\'][^"\']*placement-hero[^"\']*["\'][^>]*>', text, re.I)
              search_from = 0
              if hero:
                  hero_end = find_container_end(text, hero.start())
                  search_from = hero_end if hero_end >= 0 else hero.end()

              fallback = re.search(r'<section\\b[^>]*>', text[search_from:], re.I)
              if fallback:
                  start = search_from + fallback.start()
                  end = find_container_end(text, start)
                  if end >= 0:
                      return text[:end] + '\\n' + block + '\\n' + style + text[end:], True

              return text, False

          changed = 0
          missed = []

          for item in root.findall("sm:url", ns):
              loc = item.find("sm:loc", ns)
              lastmod = item.find("sm:lastmod", ns)
              if loc is None:
                  continue

              url = loc.text.strip()
              path = urllib.parse.urlparse(url).path.strip("/")
              candidates = [Path("index.html")] if not path else [Path(path), Path(path + ".html"), Path(path) / "index.html"]
              file = next((p for p in candidates if p.is_file()), None)
              if file is None:
                  missed.append(url + " -> file missing")
                  continue

              text = file.read_text(encoding="utf-8", errors="ignore")
              date = lastmod.text.strip() if lastmod is not None and lastmod.text else "2026-09-30"
              try:
                  y, m, d = date[:10].split("-")
                  months = ["January","February","March","April","May","June","July","August","September","October","November","December"]
                  display_date = f"{int(d)} {months[int(m)-1]} {y}"
              except Exception:
                  display_date = "30 September 2026"

              clean = standalone_block_re.sub("\n", text)
              clean = standalone_style_re.sub("\n", clean)
              clean = block_re.sub("\n", clean)

              block = block_template.format(date=display_date)
              updated, ok = insert_after_fact_cards(clean, block)
              if not ok:
                  missed.append(url + " -> facts container not found")
                  continue

              if updated != text:
                  file.write_text(updated, encoding="utf-8")
                  changed += 1

          print(f"Editorial metadata repositioned below fact cards on {changed} sitemap-backed HTML pages.")
          if missed:
              print("WARNING: " + str(len(missed)) + " pages could not be repositioned.")
              for item in missed[:50]:
                  print(item)
          PY

      - name: Commit changes
        run: |
          git config user.name "CollegeDecoded Editorial Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML pages needed editorial metadata changes."
          else
            git commit -m "Ensure editorial metadata on every live sitemap page"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Editorial metadata changes pushed successfully on attempt $attempt."
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Failed to push editorial metadata changes after 5 attempts."
                exit 1
              fi
              echo "Push race detected; retrying after latest main update..."
              sleep 2
            done
          fi

# Production redeploy trigger: 30 September 2026

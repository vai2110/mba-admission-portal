name: Add Editorial Update Metadata

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-meta
  cancel-in-progress: true

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add editorial metadata script to every sitemap page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import urllib.parse
          import xml.etree.ElementTree as ET

          root = ET.fromstring(Path("sitemap.xml").read_text(encoding="utf-8"))
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          script = '<script src="/assets/editorial-meta.js?v=20260930"></script>'
          changed = 0
          missing = []

          for item in root.findall("sm:url", ns):
              loc = item.find("sm:loc", ns)
              if loc is None:
                  continue
              url = loc.text.strip()
              path = urllib.parse.urlparse(url).path.strip("/")
              candidates = [Path("index.html")] if not path else [Path(path), Path(path + ".html"), Path(path) / "index.html"]
              file = next((p for p in candidates if p.is_file()), None)
              if file is None:
                  missing.append(url + " -> file missing")
                  continue

              text = file.read_text(encoding="utf-8", errors="ignore")
              cleaned = re.sub(
                  r'<script[^>]+src=["\']/assets/editorial-meta\.js(?:\?[^"\']*)?["\'][^>]*></script>\s*',
                  '',
                  text,
                  flags=re.I
              )
              if re.search(r'</head>', cleaned, flags=re.I):
                  updated = re.sub(r'</head>', script + '\n</head>', cleaned, count=1, flags=re.I)
              elif re.search(r'<head\b[^>]*>', cleaned, flags=re.I):
                  updated = re.sub(r'(<head\b[^>]*>)', r'\1\n' + script, cleaned, count=1, flags=re.I)
              elif re.search(r'<body\b[^>]*>', cleaned, flags=re.I):
                  updated = re.sub(r'(<body\b[^>]*>)', r'\1\n' + script, cleaned, count=1, flags=re.I)
              elif re.search(r'</html>', cleaned, flags=re.I):
                  updated = re.sub(r'</html>', script + '\n</html>', cleaned, count=1, flags=re.I)
              else:
                  updated = script + '\n' + cleaned
              if updated != text:
                  file.write_text(updated, encoding="utf-8")
                  changed += 1

          print(f"Editorial metadata script injected into {changed} sitemap-backed HTML pages.")
          if missing:
              print("WARNING: could not process:")
              for item in missing:
                  print(item)
          PY

      - name: Validate every sitemap page has editorial metadata script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.parse
          import xml.etree.ElementTree as ET

          root = ET.fromstring(Path("sitemap.xml").read_text(encoding="utf-8"))
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          failures = []

          for item in root.findall("sm:url", ns):
              loc = item.find("sm:loc", ns)
              if loc is None:
                  continue
              path = urllib.parse.urlparse(loc.text.strip()).path.strip("/")
              candidates = [Path("index.html")] if not path else [Path(path), Path(path + ".html"), Path(path) / "index.html"]
              file = next((p for p in candidates if p.is_file()), None)
              if file is None:
                  failures.append(f"{loc.text.strip()} -> file missing")
                  continue
              text = file.read_text(encoding="utf-8", errors="ignore")
              if "/assets/editorial-meta.js?v=20260930" not in text:
                  failures.append(f"{loc.text.strip()} -> metadata script missing")

          if failures:
              print("\n".join(failures))
              raise SystemExit(f"{len(failures)} sitemap pages failed editorial metadata validation")
          print("Validation passed: every sitemap-backed HTML page contains editorial metadata script.")
          PY

      - name: Add static editorial metadata fallback to every sitemap page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.parse
          import xml.etree.ElementTree as ET
          import re

          root = ET.fromstring(Path("sitemap.xml").read_text(encoding="utf-8"))
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          changed = 0

          def hero_end(text):
              matches = list(re.finditer(r'<section[^>]*class=["\\'][^"\\']*hero[^"\\']*["\\'][^>]*>|</section\\s*>', text, re.I))
              depth = 0
              started = False
              for m in matches:
                  token = m.group(0)
                  if token.lower().startswith("<section"):
                      depth += 1
                      started = True
                  elif started:
                      depth -= 1
                      if depth == 0:
                          return m.end()
              return -1

          for item in root.findall("sm:url", ns):
              loc = item.find("sm:loc", ns)
              lastmod = item.find("sm:lastmod", ns)
              if loc is None:
                  continue
              url = loc.text.strip()
              path = urllib.parse.urlparse(url).path.strip("/")
              candidates = [Path("index.html")] if not path else [Path(path), Path(path + ".html"), Path(path) / "index.html"]
              file = next((p for p in candidates if p.is_file()), None)
              if file is None:
                  continue

              text = file.read_text(encoding="utf-8", errors="ignore")
              date = lastmod.text.strip() if lastmod is not None and lastmod.text else "2026-09-30"
              try:
                  y, m, d = date[:10].split("-")
                  months = ["January","February","March","April","May","June","July","August","September","October","November","December"]
                  display_date = f"{int(d)} {months[int(m)-1]} {y}"
              except Exception:
                  display_date = "30 September 2026"

              block = (
                  '<div id="cdEditorialMeta" class="cd-editorial-meta-static">'
                  f'<span>Last updated on: <strong>{display_date}</strong></span>'
                  '<span aria-hidden="true">·</span>'
                  '<span>Updated by <a href="/collegedecoded-team">CollegeDecoded Team</a></span>'
                  '</div>'
              )
              style = '<style id="cdEditorialMetaStaticStyles">.cd-editorial-meta-static{width:min(1200px,calc(100% - 32px));margin:0 auto;padding:11px 0 7px;color:#64748b;font:12px/1.5 Arial,Helvetica,sans-serif;display:flex;align-items:center;gap:8px}.cd-editorial-meta-static strong{color:#475569;font-weight:700}.cd-editorial-meta-static a{color:#2563eb;font-weight:700;text-decoration:none}.cd-editorial-meta-static a:hover{text-decoration:underline}@media(max-width:560px){.cd-editorial-meta-static{width:calc(100% - 24px);padding:9px 0 5px;font-size:11px;gap:6px;flex-wrap:wrap}}</style>'

              if 'id="cdEditorialMeta"' in text:
                  continue

              pos = hero_end(text)
              if pos < 0:
                  continue
              text = text[:pos] + "\n" + block + "\n" + style + text[pos:]
              file.write_text(text, encoding="utf-8")
              changed += 1

          print(f"Static editorial metadata fallback added to {changed} sitemap-backed HTML pages.")
          PY

      - name: Commit changes
        run: |
          git config user.name "CollegeDecoded Editorial Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML pages needed editorial metadata changes."
          else
            git commit -m "Ensure editorial metadata on every live sitemap page"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

# Production redeploy trigger: 30 September 2026

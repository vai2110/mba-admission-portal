name: Add Editorial Update Metadata and Mobile Section Navigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-editorial-meta.yml'
      - 'assets/mobile-on-page.js'
      - 'sitemap.xml'

permissions:
  contents: write

concurrency:
  group: editorial-meta
  cancel-in-progress: true

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inject shared page scripts into every sitemap page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import urllib.parse
          import xml.etree.ElementTree as ET
          root = ET.fromstring(Path("sitemap.xml").read_text(encoding="utf-8"))
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          scripts = [
              '<script src="/assets/editorial-meta.js?v=20260930fix"></script>',
              '<script defer src="/assets/mobile-on-page.js?v=20261014v4"></script>',
          ]
          changed = 0
          for item in root.findall("sm:url", ns):
              loc = item.find("sm:loc", ns)
              if loc is None: continue
              path = urllib.parse.urlparse(loc.text.strip()).path.strip("/")
              candidates = [Path("index.html")] if not path else [Path(path), Path(path + ".html"), Path(path) / "index.html"]
              file = next((p for p in candidates if p.is_file()), None)
              if file is None: continue
              original = file.read_text(encoding="utf-8", errors="ignore")
              text = original
              text = re.sub(r"""<script[^>]+src=["']/assets/editorial-meta\.js(?:\?[^"']*)?["'][^>]*></script>\s*""", "", text, flags=re.I)
              text = re.sub(r"""<script[^>]+src=["']/assets/mobile-on-page\.js(?:\?[^"']*)?["'][^>]*></script>\s*""", "", text, flags=re.I)
              if re.search(r"</head>", text, flags=re.I):
                  text = re.sub(r"</head>", "\n".join(scripts) + "\n</head>", text, count=1, flags=re.I)
              if text != original:
                  file.write_text(text, encoding="utf-8")
                  changed += 1
          print(f"Shared scripts injected into {changed} sitemap-backed HTML pages.")
          PY
      - name: Commit changes
        run: |
          git config user.name "CollegeDecoded Editorial Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML pages needed shared script changes."
          else
            git commit -m "Apply shared mobile section navigation across sitemap pages"
            git push
          fi

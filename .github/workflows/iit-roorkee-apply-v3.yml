name: IIT Roorkee UI Fix v3

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Finalize IIT Roorkee locked UI [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final locked UI rules
        shell: python
        run: |
          from pathlib import Path
          import re
          pages=[Path('iit-roorkee.html'),Path('iit-roorkee-mba.html'),Path('iit-roorkee-executive-mba.html'),Path('iit-roorkee-placements.html')]
          for p in pages:
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              # Match the SIBM Pune desktop hero exactly at the component level.
              s=re.sub(r'\.hero\{[^}]*\}', '.hero{background:linear-gradient(110deg,#172554 0%,#1d4ed8 100%);color:#fff;padding:38px 0}', s, count=1)
              s=re.sub(r'\.hero-container\{[^}]*\}', '.hero-container{width:min(1240px,calc(100% - 40px));margin:auto}', s, count=1)
              s=re.sub(r'\.hero h1\{[^}]*\}', '.hero h1{font-size:36px;line-height:1.18;margin:0 0 9px;max-width:900px}', s, count=1)
              s=re.sub(r'\.hero h2\{[^}]*\}', '.hero h2{font-size:16px;line-height:1.5;font-weight:600;color:#dbeafe;margin:0 0 10px;max-width:900px}', s, count=1)
              s=re.sub(r'\.hero-location\{[^}]*\}', '.hero-location{font-size:13px;color:#dbeafe;font-weight:600}', s, count=1)
              # Some legacy pages use a shorthand `font:` declaration on body. Normalize the complete body block.
              s=re.sub(r'body\{[^}]*\}', 'body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033;line-height:1.65}', s, count=1)
              # Exactly one visible Quick Answer: retain the substantive .ans block.
              if '<div class="ans">' in s:
                  s=re.sub(r'<div[^>]+class=["\']answer-first["\'][^>]*>.*?</div>\s*', '', s, count=1, flags=re.S)
              # Concise keyword-led placement H1.
              if p.name=='iit-roorkee-placements.html':
                  s=re.sub(r'<h1>IIT Roorkee MBA Placements[^<]*?</h1>', '<h1>IIT Roorkee MBA Placements: Average Package, Median &amp; Highest CTC</h1>', s, count=1)
              p.write_text(s,encoding='utf-8')
          # Persist the rule in the agent instructions.
          a=Path('AGENTS.md')
          txt=a.read_text(encoding='utf-8') if a.exists() else '# MBA Portal College Page Agent\n'
          marker='## Locked Hero, Quick Answer and H2 Rules'
          if marker not in txt:
              txt += '''\n\n## Locked Hero, Quick Answer and H2 Rules\n- The hero must use the SIBM Pune benchmark component: compact text-first hero, same container proportions, spacing and established typography scale; do not redesign it.\n- Preserve the IIM Ahmedabad/SIBM Pune approved `Arial, Helvetica, sans-serif` font stack and established type scale across desktop and mobile.\n- Exactly one visible Quick Answer block per page.\n- H2 headings must be short, college/programme-specific and naturally keyword optimised.\n- Placement H1s must be concise and keyword-led; year-specific details belong in metadata/body.\n- These are hard QA gates after every creation or modification pass.\n'''
              a.write_text(txt,encoding='utf-8')
      - name: Verify final rules
        shell: python
        run: |
          from pathlib import Path
          import re
          for p in [Path('iit-roorkee.html'),Path('iit-roorkee-mba.html'),Path('iit-roorkee-executive-mba.html'),Path('iit-roorkee-placements.html')]:
              s=p.read_text(encoding='utf-8')
              assert 'Arial,Helvetica,sans-serif' in s
              assert '.hero h1{font-size:36px' in s
              assert '.hero h2{font-size:16px' in s
              assert len(re.findall(r'<div[^>]+class=["\']ans["\']',s)) <= 1
              assert not re.search(r'<div[^>]+class=["\']answer-first["\']',s)
          print('Final IIT Roorkee UI rules verified.')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iit-roorkee*.html AGENTS.md
          git diff --cached --quiet || git commit -m 'Finalize IIT Roorkee locked UI [skip ci]'
          git push
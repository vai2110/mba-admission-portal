name: Fix IIM Rohtak Heroes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-heroes:
    if: github.event.head_commit.message != 'Fix IIM Rohtak hero headers across pages'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Normalize IIM Rohtak hero headers
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = {
            'iim-rohtak.html': (
              'IIM Rohtak: Courses, Admissions, Fees, Cutoffs &amp; Placements 2026',
              'Courses, admission process, eligibility, fees, cutoff details, placements and important dates'
            ),
            'iim-rohtak-pgp.html': (
              'IIM Rohtak PGP Admission 2026: Fees, Eligibility, Cutoff &amp; Placements',
              'PGP admission process, CAT cutoff, eligibility, fees, selection criteria and placement details'
            ),
            'iim-rohtak-ipm.html': (
              'IIM Rohtak IPM Admission 2026: Eligibility, Fees, Cutoff &amp; Selection Process',
              'IPM admission dates, eligibility, IPM AT, selection process, fees and programme details'
            ),
            'iim-rohtak-placements.html': (
              'IIM Rohtak Placements: Average Package, Highest Salary &amp; Placement Trends',
              'Latest placement highlights, average and median CTC, highest package, recruiters and year-wise trends'
            )
          }

          css = '''\n/* SIBM Pune benchmark hero: compact, text-first, no extra hero cards. */\n.hero{padding:28px 0 !important}\n.hero-inner,.hero-container{max-width:1100px !important}\n.hero h1{font-size:32px !important;line-height:1.22 !important;margin-bottom:7px !important;max-width:1000px !important}\n.hero p,.hero h2{font-size:13px !important;line-height:1.5 !important;margin-bottom:7px !important;max-width:950px !important}\n.hero-meta,.hero-location{font-size:11px !important;margin-top:6px !important}\n@media(max-width:680px){.hero{padding:24px 0 !important}.hero h1{font-size:25px !important;line-height:1.25 !important}.hero p,.hero h2{font-size:12px !important}.hero-meta,.hero-location{font-size:10px !important}}\n'''

          for filename, (h1, sub) in pages.items():
              path = Path(filename)
              if not path.exists():
                  print(f'Skipping missing page: {filename}')
                  continue
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'\.hero\{[^}]*\}', lambda m: m.group(0), text, count=1)
              if '/* SIBM Pune benchmark hero:' not in text:
                  text = text.replace('</style>', css + '</style>', 1)
              text = re.sub(r'(<section class="hero">.*?<h1>).*?(</h1>)', lambda m: m.group(1) + h1 + m.group(2), text, count=1, flags=re.S)
              text = re.sub(r'(<section class="hero">.*?<h1>.*?</h1>)(.*?)(</section>)', lambda m: m.group(1) + re.sub(r'<p>.*?</p>', '<p>' + sub + '</p>', m.group(2), count=1, flags=re.S) + m.group(3), text, count=1, flags=re.S)
              path.write_text(text, encoding='utf-8')
              print(f'Updated {filename}')

      - name: Commit hero updates
        run: |
          git config user.name 'MBA Portal Hero Updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iim-rohtak.html iim-rohtak-pgp.html iim-rohtak-ipm.html iim-rohtak-placements.html
          git diff --cached --quiet || git commit -m 'Fix IIM Rohtak hero headers across pages'
          git push
name: Fix IIM Rohtak PGPx link
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix PGPx link and ensure dedicated page
        shell: python
        run: |
          from pathlib import Path
          p=Path('iim-rohtak.html')
          s=p.read_text()
          s=s.replace('href="https://iimrohtak.ac.in/pgpx-admission.php" target="_blank" rel="noopener">Official details →','href="iim-rohtak-pgpx.html">View PGPx page →')
          p.write_text(s)
          if not Path('iim-rohtak-pgpx.html').exists():
            Path('iim-rohtak-pgpx.html').write_text('''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IIM Rohtak PGPx 2026-27: Admission, Fees & Eligibility</title><meta name="description" content="IIM Rohtak PGPx 2026-27 admission, eligibility, entrance exams, fees and programme structure."><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}.hero{background:linear-gradient(120deg,#17336f,#2857c7);color:#fff;padding:30px}.main{max-width:1000px;margin:22px auto;padding:0 18px}.box{background:#fff;border:1px solid #dfe5ed;border-radius:9px;padding:24px;margin-bottom:18px}h1{font-size:32px}h2{color:#173f82}p,li{font-size:14px;line-height:1.7}a{color:#2563eb}</style></head><body><section class="hero"><h1>IIM Rohtak PGPx 2026-27: Admission, Fees, Eligibility & Programme Details</h1><p>One-year Post Graduate Programme in Management for Executives.</p></section><main class="main"><section class="box"><h2>Overview</h2><p>IIM Rohtak PGPx is a one-year management programme for working professionals focused on general management, practical learning and leadership development.</p></section><section class="box"><h2>Eligibility</h2><ul><li>Bachelor’s or Post Graduation Degree in any discipline.</li><li>Minimum 50% aggregate marks or equivalent CGPA.</li><li>At least 3 years of managerial, entrepreneurial or professional experience at admission.</li></ul></section><section class="box"><h2>Admission Process</h2><p>Accepted routes include valid CAT, GMAT, GRE or GATE scores from the past three years, or the IIMR Entrance Test, followed by screening and Personal Interview.</p><p><a href="https://admission.iimrohtak.ac.in/SignUp/PGPx" target="_blank">PGPx Admission Portal →</a></p></section><section class="box"><h2>Fees</h2><p>The official admission page lists a total programme fee of ₹7,43,650 and a separate ₹2,500 application fee. An additional fee applies to the on-campus module.</p></section><section class="box"><h2>Programme Structure</h2><p>The published structure includes 450 hours of interactive sessions, 75 hours offline on campus, 375 hours online and 180 hours of project work, for 630 total programme hours.</p></section><section class="box"><h2>Official Details</h2><p><a href="https://www.iimrohtak.ac.in/pgpx-admission.php" target="_blank">IIM Rohtak PGPx Admission →</a></p></section></main></body></html>''',encoding='utf-8')
      - name: Commit and remove updater
        run: |
          git config user.name 'MBA Portal Updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iim-rohtak.html iim-rohtak-pgpx.html
          git diff --cached --quiet || git commit -m 'Fix IIM Rohtak PGPx course link'
          git rm .github/workflows/fix-rohtak-pgpx-link.yml
          git commit -m 'Remove one-time PGPx link updater'
          git push
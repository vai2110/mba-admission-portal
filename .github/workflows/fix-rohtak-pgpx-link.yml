name: Fix IIM Rohtak PGPx link
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix IIM Rohtak PGPx course link'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix PGPx link
        shell: python
        run: |
          from pathlib import Path
          p=Path('iim-rohtak.html')
          s=p.read_text()
          s=s.replace('href="https://iimrohtak.ac.in/pgpx-admission.php" target="_blank" rel="noopener">Official details →','href="iim-rohtak-pgpx.html">View PGPx page →')
          p.write_text(s)
          Path('iim-rohtak-pgpx.html').write_text('''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IIM Rohtak PGPx 2026-27: Admission, Fees & Eligibility</title><meta name="description" content="IIM Rohtak PGPx 2026-27 admission, eligibility, entrance exams, fees and programme structure."><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033;line-height:1.65}.wrap{max-width:1050px;margin:auto;padding:0 18px}.hero{background:linear-gradient(120deg,#17336f,#2857c7);color:#fff;padding:30px 0}.hero h1{font-size:32px;margin:0 0 8px}.hero p{font-size:13px}.main{padding:22px 0 50px}.box{background:#fff;border:1px solid #dfe5ed;border-radius:9px;padding:24px;margin-bottom:18px}.box h2{font-size:22px;color:#102a43}.box p,.box li{font-size:13px;color:#334155}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.fact{background:#f8fbff;border:1px solid #dbe7f5;border-radius:8px;padding:12px}.fact b{display:block;color:#2563eb;font-size:17px}.fact span{font-size:10px;color:#64748b}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border:1px solid #dce3eb;text-align:left}th{background:#eef5ff;color:#173f82}@media(max-width:650px){.hero h1{font-size:25px}.facts{grid-template-columns:repeat(2,1fr)}table{min-width:620px}.scroll{overflow:auto}}</style></head><body><section class="hero"><div class="wrap"><h1>IIM Rohtak PGPx 2026-27: Admission, Fees, Eligibility & Programme Details</h1><p>One-year Post Graduate Programme in Management for Executives for experienced working professionals.</p></div></section><main class="wrap main"><section class="box"><h2>PGPx Overview</h2><div class="facts"><div class="fact"><b>1 year</b><span>Duration</span></div><div class="fact"><b>Hybrid</b><span>Online + offline</span></div><div class="fact"><b>50%</b><span>Minimum marks</span></div><div class="fact"><b>3 years</b><span>Minimum experience</span></div></div><p>IIM Rohtak PGPx is a one-year management programme for working professionals, focused on general management, practical learning and leadership development.</p></section><section class="box"><h2>Eligibility</h2><ul><li>Bachelor's or Post Graduation Degree in any discipline.</li><li>Minimum 50% aggregate marks or equivalent CGPA.</li><li>At least 3 years of managerial, entrepreneurial or professional experience at admission.</li></ul></section><section class="box"><h2>Admission Process</h2><p>Accepted routes include a valid CAT, GMAT, GRE or GATE score from the past three years, or the IIMR Entrance Test, followed by screening and Personal Interview.</p><p><a href="https://admission.iimrohtak.ac.in/SignUp/PGPx" target="_blank">PGPx Admission Portal →</a></p></section><section class="box"><h2>Fees</h2><p>The official admission page lists a total programme fee of <b>₹7,43,650</b> and a separate ₹2,500 application fee. An additional fee applies to the on-campus module.</p></section><section class="box"><h2>Programme Structure</h2><div class="scroll"><table><tr><th>Component</th><th>Hours</th></tr><tr><td>Interactive sessions</td><td>450</td></tr><tr><td>Online sessions</td><td>375</td></tr><tr><td>Offline sessions</td><td>75</td></tr><tr><td>Project work</td><td>180</td></tr><tr><td>Total</td><td>630</td></tr></table></div><p>Published subjects include Financial Reporting & Analysis, Business Computing, Data Analytics, Marketing, Operations, Quantitative Methods, Finance, Strategic Management, HR and leadership.</p></section><section class="box"><h2>Official Details</h2><p><a href="https://www.iimrohtak.ac.in/pgpx-admission.php" target="_blank">IIM Rohtak PGPx Admission →</a></p></section></main></body></html>''',encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'MBA Portal Updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iim-rohtak.html iim-rohtak-pgpx.html
          git commit -m 'Fix IIM Rohtak PGPx course link'
          git rm .github/workflows/fix-rohtak-pgpx-link.yml
          git commit -m 'Remove one-time PGPx link updater'
          git push
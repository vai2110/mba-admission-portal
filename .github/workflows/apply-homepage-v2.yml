name: Apply Homepage V2

on:
  push:
    paths:
      - 'scripts/modify_homepage_v2.py'
      - '.github/workflows/apply-homepage-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: homepage-redesign-pr
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply homepage redesign
        run: python scripts/modify_homepage_v2.py
      - name: Propose homepage changes for review
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Propose homepage redesign"
          branch: automation/homepage-v2
          delete-branch: true
          add-paths: |
            index.html
          title: "Homepage: review V2 redesign"
          body: |
            Automated homepage redesign proposal. Review desktop/mobile rendering, navigation, accessibility and SEO metadata before merging. No direct push to main is performed.

name: Fix IIM Bodh Gaya Fees
on:
  push:
    paths:
      - 'iim-bodhgaya.html'
      - '.github/workflows/fix-iimbg-fees.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix-fees:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace fee sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          common = '''<section class="main-section" id="fees"><h2>How much does IIM Bodh Gaya cost?</h2><p>Here are the actual fee figures students need to budget for, rather than a generic list of cost heads. The institute publishes programme-specific fee documents, so the total changes by programme and batch.</p><div class="highlight-grid"><div class="highlight"><strong>₹17.96L</strong><span>Latest visible 2-year MBA fee</span></div><div class="highlight"><strong>₹16.70L</strong><span>Latest indexed DBAI / HHM fee schedule</span></div><div class="highlight"><strong>₹14.25L</strong><span>IPM Years 1–3 published fee</span></div></div><div class="table-wrapper"><table><thead><tr><th>Programme</th><th>Published fee</th><th>What is included / important</th></tr></thead><tbody><tr><td>MBA</td><td><strong>₹17.96 lakh</strong></td><td>Six-term structure covering tuition, hostel, academic, admission, registration, student activity, career-development, alumni and convocation charges. ₹25,000 caution deposit is separate.</td></tr><tr><td>MBA-DBAI</td><td><strong>₹16.70 lakh*</strong></td><td>Latest indexed official fee schedule: ₹1.60 lakh tuition per term, plus hostel, academic, career-development and other institute charges.</td></tr><tr><td>MBA-HHM</td><td><strong>₹16.70 lakh*</strong></td><td>Latest indexed official fee schedule: ₹1.60 lakh tuition per term, plus hostel, academic, career-development and other institute charges.</td></tr><tr><td>IPM</td><td><strong>₹4.75 lakh/year for Years 1–3</strong></td><td>₹14.25 lakh for the first three years. Years 4–5 are charged as per the applicable MBA batch fee when the student enters the MBA stage.</td></tr></tbody></table></div><h3>What does the ₹17.96 lakh MBA fee actually contain?</h3><div class="table-wrapper"><table><thead><tr><th>Fee head</th><th>Term-wise / total</th></tr></thead><tbody><tr><td>Tuition</td><td>₹1.60 lakh per term · ₹9.60 lakh over 6 terms</td></tr><tr><td>Hostel rent</td><td>₹41,000 per term · ₹2.46 lakh over 6 terms</td></tr><tr><td>Academic charges</td><td>₹80,000 per term · ₹4.80 lakh over 6 terms</td></tr><tr><td>Admission fee</td><td>₹15,000 one time</td></tr><tr><td>Annual registration</td><td>₹6,000 in Terms I and IV</td></tr><tr><td>Student activity</td><td>₹5,000 in Terms II–V</td></tr><tr><td>Career development</td><td>₹8,000 per term · ₹48,000 total</td></tr><tr><td>Alumni activity</td><td>₹5,000 in final term</td></tr><tr><td>Convocation</td><td>₹10,000 in final term</td></tr><tr><td><strong>Course total</strong></td><td><strong>₹17,96,000</strong></td></tr></tbody></table></div><div class="notice"><strong>Do not add refundable deposits to the course fee</strong><p>The MBA fee schedule separately lists a ₹25,000 caution deposit. Mess and laundry deposits are also separate and can be adjusted/refunded according to the institute's terms. For ROI, calculate tuition + institute charges + actual living/mess costs, then treat refundable deposits separately.</p></div><p class="source-note">*The institute's admissions page currently links separate 2026-28 fee documents for MBA, MBA-DBAI and MBA-HHM. The ₹16.70 lakh figure shown for DBAI/HHM is the latest fee schedule whose detailed figures are publicly indexed from the institute; check the current 2026-28 PDF before payment.</p></section>'''
          ipm_fee = '''<section class="main-section" id="fees"><h2>How much does IPM cost?</h2><p>The 2026-31 IPM fee structure gives a clear number for the first three years and links Years 4–5 to the MBA fee applicable when the cohort reaches the MBA stage.</p><div class="highlight-grid"><div class="highlight"><strong>₹4.75L</strong><span>Published annual fee for Years 1–3</span></div><div class="highlight"><strong>₹14.25L</strong><span>Published total for first 3 years</span></div><div class="highlight"><strong>₹25,000</strong><span>Refundable caution deposit</span></div></div><div class="table-wrapper"><table><thead><tr><th>Component</th><th>Years 1–3</th><th>What to know</th></tr></thead><tbody><tr><td>Tuition</td><td>₹1.50 lakh/semester</td><td>₹9 lakh across the first three years.</td></tr><tr><td>Hostel rent</td><td>₹25,000/semester</td><td>₹1.50 lakh across the first three years.</td></tr><tr><td>Academic charges</td><td>₹50,000/semester</td><td>₹3 lakh across the first three years.</td></tr><tr><td>Admission fee</td><td>₹10,000 one time</td><td>Part of the published first-year fee.</td></tr><tr><td>Annual registration</td><td>₹5,000/year</td><td>₹15,000 across Years 1–3.</td></tr><tr><td>Student activity</td><td>₹10,000/semester</td><td>Included in the published annual total.</td></tr><tr><td><strong>Annual total</strong></td><td><strong>₹4.75 lakh</strong></td><td>₹14.25 lakh for Years 1–3.</td></tr><tr><td>Years 4–5</td><td><strong>Not fixed in the current IPM fee notice</strong></td><td>Charged according to the applicable MBA batch fee when the student enters the MBA phase.</td></tr></tbody></table></div><div class="notice"><strong>Budget realistically</strong><p>Keep the ₹14.25 lakh first-three-year academic fee separate from the ₹25,000 refundable caution deposit and ₹35,000 initial mess/laundry deposit. The final two years cannot be given as a fixed current figure because the applicable MBA batch fee will be determined later.</p></div></section>'''
          replacements={'iim-bodhgaya.html':common,'iim-bodhgaya-mba.html':common,'iim-bodhgaya-dbai.html':common,'iim-bodhgaya-hhm.html':common,'iim-bodhgaya-ipm.html':ipm_fee}
          for fn,section in replacements.items():
              p=Path(fn); s=p.read_text(); s2=re.sub(r'<section class="main-section" id="fees">.*?</section>(?=<section class="main-section" id="(?:placements|career|faq|compare|learning|decision)")',section,s,count=1,flags=re.S)
              if s2==s: raise SystemExit(f'Fee section not replaced in {fn}')
              p.write_text(s2)
          PY
      - name: Commit fee updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iim-bodhgaya.html iim-bodhgaya-mba.html iim-bodhgaya-dbai.html iim-bodhgaya-hhm.html iim-bodhgaya-ipm.html
          git commit -m 'Show actual IIM Bodh Gaya fee figures' || exit 0
          git push
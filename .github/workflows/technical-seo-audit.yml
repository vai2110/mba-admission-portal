name: Technical SEO Audit

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: technical-seo-audit-pr
  cancel-in-progress: false

jobs:
  audit:
    if: \${{ github.actor != 'github-actions[bot]' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install beautifulsoup4
      - name: Normalize SEO metadata
        run: python scripts/seo_metadata_cleanup.py
      - name: Run technical SEO audit
        run: python scripts/technical_seo_audit.py
      - name: Propose metadata repairs for review
        uses: peter-evans/create-pull-request@v7
        with:
          token: \${{ secrets.GITHUB_TOKEN }}
          commit-message: "Propose technical SEO metadata repairs"
          branch: automation/technical-seo-metadata
          delete-branch: true
          add-paths: |
            *.html
          title: "SEO: review automated metadata repairs"
          body: |
            Automated metadata cleanup proposal generated by the technical SEO audit workflow.

            Review the HTML diff and verify representative production URLs before merging. This workflow does not push directly to main.
      - name: Upload technical SEO report
        uses: actions/upload-artifact@v4
        with:
          name: technical-seo-audit
          path: technical-seo-audit.json
          if-no-files-found: ignore

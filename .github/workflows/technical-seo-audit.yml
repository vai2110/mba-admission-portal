name: Technical SEO Audit

on:
  push:
    paths:
      - '**.html'
      - 'scripts/technical_seo_audit.py'
      - '.github/workflows/technical-seo-audit.yml'
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# All workflows that write generated audit/report files to main share this
# queue so they cannot race each other and lose pushes.
concurrency:
  group: portal-main-writer
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.actor != 'github-actions[bot]' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run technical SEO audit
        run: python scripts/technical_seo_audit.py

      - name: Commit audit report
        run: |
          set -e
          git config user.name "MBA Portal Technical SEO Auditor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technical-seo-audit.json
          if git diff --cached --quiet; then
            echo "Technical SEO report is already current."
          else
            git commit -m "Update technical SEO audit report"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Upload technical SEO report
        uses: actions/upload-artifact@v4
        with:
          name: technical-seo-audit
          path: technical-seo-audit.json

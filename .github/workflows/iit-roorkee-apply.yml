name: Apply IIT Roorkee Benchmark UI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply locked IIT Roorkee UI fixes [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix all IIT Roorkee pages
        shell: python
        run: |
          from pathlib import Path
          import re
          pages=[Path('iit-roorkee.html'),Path('iit-roorkee-mba.html'),Path('iit-roorkee-executive-mba.html'),Path('iit-roorkee-placements.html')]
          for p in pages:
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              # Use the SIBM Pune benchmark hero exactly: same container width, compact vertical rhythm and type scale.
              s=re.sub(r'\.hero\{[^}]*\}', '.hero{background:linear-gradient(110deg,#172554 0%,#1d4ed8 100%);color:#fff;padding:38px 0}', s, count=1)
              s=re.sub(r'\.hero-container\{[^}]*\}', '.hero-container{width:min(1240px,calc(100% - 40px));margin:auto}', s, count=1)
              s=re.sub(r'\.hero h1\{[^}]*\}', '.hero h1{font-size:36px;line-height:1.18;margin:0 0 9px;max-width:900px}', s, count=1)
              s=re.sub(r'\.hero h2\{[^}]*\}', '.hero h2{font-size:16px;line-height:1.5;font-weight:600;color:#dbeafe;margin:0 0 10px;max-width:900px}', s, count=1)
              s=re.sub(r'\.hero-location\{[^}]*\}', '.hero-location{font-size:13px;color:#dbeafe;font-weight:600}', s, count=1)
              # Keep the approved IIMA/SIBM font stack.
              s=re.sub(r'body\{font-family:[^}]*\}', 'body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033;line-height:1.65}', s, count=1)
              # Exactly one Quick Answer: retain the substantive .ans block and remove duplicate .answer-first.
              if '<div class="ans">' in s:
                  s=re.sub(r'<div[^>]+class=["\']answer-first["\'][^>]*>.*?</div>\s*', '', s, count=1, flags=re.S)
              # Short keyword-led placement H1.
              if p.name=='iit-roorkee-placements.html':
                  s=re.sub(r'<h1>IIT Roorkee MBA Placements[^<]*?</h1>', '<h1>IIT Roorkee MBA Placements: Average Package, Median &amp; Highest CTC</h1>', s, count=1)
              p.write_text(s,encoding='utf-8')
          # Lock the rule in the agent skill without duplicating it.
          a=Path('AGENTS.md')
          txt=a.read_text(encoding='utf-8') if a.exists() else '# MBA Portal College Page Agent\n'
          marker='## Locked Hero, Quick Answer and H2 Rules'
          if marker not in txt:
              txt += '''\n\n## Locked Hero, Quick Answer and H2 Rules\n- Use the SIBM Pune hero container as the visual benchmark for all new and audited college pages: compact text-first hero, same container proportions, typography scale and spacing; never invent hero modules.\n- Preserve the approved site font stack `Arial, Helvetica, sans-serif`; never substitute fonts or independently alter the established base typography.\n- Render exactly one visible Quick Answer block per page; never render both an introductory `answer-first` block and an `ans`/approved block.\n- H2 headings must be short, specific, student-intent driven and naturally keyword optimised; avoid generic headings when a precise college/programme query can be used.\n- Placement-page H1s must be concise and keyword-led; keep year-specific detail in title metadata and body content rather than stuffing the H1.\n- Treat these as hard QA gates after every creation or modification pass.\n'''
              a.write_text(txt,encoding='utf-8')
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          import re
          pages=[Path('iit-roorkee.html'),Path('iit-roorkee-mba.html'),Path('iit-roorkee-executive-mba.html'),Path('iit-roorkee-placements.html')]
          for p in pages:
              s=p.read_text(encoding='utf-8')
              assert len(re.findall(r'<div[^>]+class=["\']ans["\']',s)) <= 1
              assert 'font-family:Arial,Helvetica,sans-serif' in s
              assert '.hero h1{font-size:36px' in s
              assert '.hero h2{font-size:16px' in s
          print('Verified IIT Roorkee hero, font and Quick Answer rules.')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iit-roorkee*.html AGENTS.md
          git diff --cached --quiet || git commit -m 'Apply locked IIT Roorkee UI fixes [skip ci]'
          git push
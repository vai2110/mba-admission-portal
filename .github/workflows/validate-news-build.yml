name: Validate CollegeDecoded News Build

on:
  pull_request:
    paths:
      - 'data/news.json'
      - 'config/news-schema.json'
      - 'scripts/build-news.js'
      - 'scripts/vercel-build.sh'
      - 'scripts/generate_college_guides_hub.py'
      - 'NEWSROOM-SETUP.md'
  push:
    branches: [main]
    paths:
      - 'data/news.json'
      - 'config/news-schema.json'
      - 'scripts/build-news.js'
      - 'scripts/vercel-build.sh'
      - 'scripts/generate_college_guides_hub.py'
      - 'NEWSROOM-SETUP.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check generator syntax
        run: |
          node --check scripts/build-news.js
          python3 -m py_compile scripts/generate_college_guides_hub.py
      - name: Generate crawlable college guide directory
        run: python3 scripts/generate_college_guides_hub.py
      - name: Generate hub and sitemap from registry
        run: node scripts/build-news.js
      - name: Validate generated SEO assets
        run: |
          test -s news/index.html
          test -s news-sitemap.xml
          grep -q 'rel="canonical" href="https://collegedecoded.in/news"' news/index.html
          grep -q 'news-sitemap.xml' robots.txt

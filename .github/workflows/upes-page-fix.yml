name: Fix mobile On this page menu
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upes-page-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile menu auto-close behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
            'mica.html','mica-pgdm-c.html','mica-pgdm.html','mica-placements.html',
            'iim-sambalpur.html','iim-sambalpur-mba.html','iim-sambalpur-mba-ba.html','iim-sambalpur-placements.html',
            'iim-jammu.html','iim-jammu-mba.html','iim-jammu-mba-hc.html','iim-jammu-mba-ai-ba.html','iim-jammu-placements.html',
            'upes-dehradun.html','upes-dehradun-btech.html','upes-dehradun-mba.html','upes-dehradun-bba.html',
            'upes-dehradun-bca.html','upes-dehradun-bdes.html','upes-dehradun-llb.html','upes-dehradun-placements.html'
          ]
          script = '''<script>
          /* Mobile "On this page" menu: close automatically after selecting a section. */
          document.querySelectorAll('.mobile-on-page details').forEach(function(details){
            details.querySelectorAll('a[href^="#"]').forEach(function(link){
              link.addEventListener('click', function(){
                details.open = false;
              });
            });
          });
          </script>'''
          marker = '/* Mobile "On this page" menu: close automatically after selecting a section. */'
          for fn in files:
            p = Path(fn)
            if not p.exists():
              print(f'Skipped missing file: {fn}')
              continue
            s = p.read_text(encoding='utf-8')
            if marker not in s and '<div class="mobile-on-page">' in s:
              s = s.replace('</body>', script + '</body>', 1)
              p.write_text(s, encoding='utf-8')
              print(f'Updated: {fn}')
            else:
              print(f'Already fixed/no mobile menu: {fn}')
          PY
      - name: Commit changes
        run: |
          git config user.name "Mobile Menu Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mica*.html iim-sambalpur*.html iim-jammu*.html upes-dehradun*.html
          git commit -m "Auto-close mobile On this page menu" || exit 0
          git push
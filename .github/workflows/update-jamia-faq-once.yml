name: Update Jamia Hamdard FAQ

on:
  push:
    paths:
      - '.github/workflows/update-jamia-faq-once.yml'

permissions:
  contents: write

jobs:
  update-faq:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Jamia FAQ section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('jamia-hamdard.html')
          html = path.read_text(encoding='utf-8')
          start = html.find('<section class="main-section" id="faq">')
          if start == -1:
              raise SystemExit('FAQ section not found')
          end = html.find('</section>', start)
          if end == -1:
              raise SystemExit('FAQ section closing tag not found')
          end += len('</section>')

          faq = '''<section class="main-section" id="faq"><h2>Jamia Hamdard FAQs: 12 questions students actually search</h2><details class="accordion"><summary>Is Jamia Hamdard a good university?</summary><div class="faq-answer"><p><strong>It depends on the programme.</strong> Jamia Hamdard has particularly strong academic positioning in pharmacy and health sciences. NIRF 2025 placed it <strong>Rank 1 in Pharmacy</strong>, while it was Rank 74 in the Overall category and Rank 40 in Medical. Students should not use the Pharmacy ranking as a proxy for MBA, engineering or every other course. Compare the specific programme's fees, curriculum, placement outcomes and admission route before deciding.</p></div></details><details class="accordion"><summary>What is Jamia Hamdard famous for?</summary><div class="faq-answer"><p>Jamia Hamdard is best known nationally for <strong>pharmacy, pharmaceutical education and health sciences</strong>. Its School of Pharmaceutical Education &amp; Research offers B.Pharm, D.Pharm, M.Pharm specialisations and PhD programmes, and the university's Pharmacy ranking is a major differentiator. It also offers management, engineering, computer applications, nursing, allied health, law and other disciplines.</p></div></details><details class="accordion"><summary>Is Jamia Hamdard admission open for 2026-27?</summary><div class="faq-answer"><p>Yes. The university's current 2026 admission notice page says applications for <strong>UG and PG programmes are live</strong>. The same page lists programme-specific notices including MBA GD/PI rounds, UG NEET-based admissions, M.Sc Nursing and other admission updates. Because dates vary by programme, students should check the current 2026-27 notice rather than relying on one university-wide deadline.</p></div></details><details class="accordion"><summary>How can I apply for Jamia Hamdard admission 2026?</summary><div class="faq-answer"><p>Applications are submitted through the <strong>Jamia Hamdard admission portal</strong>. The university's admissions support page directs applicants to the portal and says selection criteria should be checked in the <strong>2026-27 prospectus</strong>. After applying, students should monitor the admission notices and selection-list pages for programme-specific updates. Admission confirmation is communicated by the JH Admission Cell.</p></div></details><details class="accordion"><summary>Which entrance exams are accepted by Jamia Hamdard?</summary><div class="faq-answer"><p>There is <strong>no single entrance exam for every Jamia Hamdard course</strong>. The applicable route is programme-specific. The university's prospectus has used routes such as <strong>CUET, NEET-UG, JEE Main and CLAT</strong> wherever applicable, while other programmes can use qualifying-exam merit, university entrance tests, interviews or other approved selection methods. Always check the 2026-27 prospectus and course notice for the exact programme you want.</p></div></details><details class="accordion"><summary>What is the eligibility for B.Pharm at Jamia Hamdard?</summary><div class="faq-answer"><p>The university's pharmacy information states that B.Pharm is an <strong>eight-semester programme</strong>. The published eligibility requires 10+2 with PCB and at least <strong>50% marks</strong> in the aggregate, along with the applicable age requirement under PCI norms. The university has also described selection through the applicable entrance/merit route. Since admission rules can change by session, candidates should use the 2026-27 programme notice before applying.</p></div></details><details class="accordion"><summary>What is the Jamia Hamdard MBA admission process?</summary><div class="faq-answer"><p>For MBA, the 2026-27 admission cycle includes a <strong>university application followed by a GD/PI process</strong>. The official 2026 admission notices include MBA interview and GD/PI schedules, including a third round for MBA General. Students should check the current prospectus and MBA notice for eligibility, accepted score/selection components and the applicable deadline for their round.</p></div></details><details class="accordion"><summary>What is the Jamia Hamdard MBA fee?</summary><div class="faq-answer"><p>The university's fee PDF currently linked from its admission portal lists <strong>₹2.60 lakh per year</strong> for MBA before applicable additional charges; that PDF is labelled 2025-26. However, a 2026-27 MBA General selection list shows an <strong>SFS semester fee of ₹1.40 lakh</strong> plus listed admission, enrolment, library, alumni, examination and e-governance charges. This means students should check the exact 2026-27 fee applicable to their MBA category/offer instead of assuming one number applies to every route.</p></div></details><details class="accordion"><summary>What is the Jamia Hamdard B.Pharm fee?</summary><div class="faq-answer"><p>The published fee structure currently linked by the university lists <strong>₹1.60 lakh per year for B.Pharm General</strong> and <strong>₹2.40 lakh per year for B.Pharm SFS</strong>. Students also need to account for applicable one-time admission, enrolment, alumni and refundable library-deposit charges plus annual examination/e-governance charges. The 2026-27 fee corrigendum should be checked before payment because the currently accessible fee PDF is labelled 2025-26.</p></div></details><details class="accordion"><summary>Does Jamia Hamdard provide hostel facilities?</summary><div class="faq-answer"><p>Yes, Jamia Hamdard has separate boys' and girls' hostels with options including AC rooms, non-AC rooms and dormitories. However, <strong>admission to the university does not guarantee hostel allotment</strong> because accommodation is limited. The university says hostel applicants should apply through the student/hostel process, and allotted students must pay hostel charges in advance and join the mess. Hostel and mess costs should therefore be budgeted separately from academic fees.</p></div></details><details class="accordion"><summary>What is Jamia Hamdard's placement record?</summary><div class="faq-answer"><p>Placement outcomes vary considerably by programme. NIRF 2025 Management data reports <strong>202 of 230</strong> graduating-in-minimum-time students placed in 2023-24, with a <strong>₹5.95 lakh median salary</strong>. NIRF 2025 Engineering data reports <strong>197 of 337 UG engineering graduates</strong> placed with a ₹5.45 lakh median, while the two-year engineering PG category recorded 42 of 60 placed with a ₹6.20 lakh median. These are category-specific official submissions, not a single university-wide package.</p></div></details><details class="accordion"><summary>What is Jamia Hamdard's NIRF ranking for Pharmacy?</summary><div class="faq-answer"><p>Jamia Hamdard was ranked <strong>1st in Pharmacy in NIRF 2025</strong>, with a score of 86.59. The ranking is specifically for the Pharmacy category and should be interpreted as evidence of the university's strength in pharmacy education/research; it does not mean every Jamia Hamdard programme has the same national standing.</p></div></details><details class="accordion"><summary>Does Jamia Hamdard offer scholarships or fee concessions?</summary><div class="faq-answer"><p>Jamia Hamdard's official FAQ says fee-concession queries are handled under the supervision of the <strong>Dean Students' Welfare</strong> and directs scholarship applicants to the <strong>National Scholarship Portal</strong>. Eligibility and availability depend on the applicable scheme, so students should not subtract a scholarship from their budget until they confirm that they qualify and receive approval.</p></div></details></section>'''

          path.write_text(html[:start] + faq + html[end:], encoding='utf-8')
          PY

      - name: Commit FAQ update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jamia-hamdard.html
          git commit -m 'Expand Jamia Hamdard student intent FAQs' || exit 0
          git push

      - name: Remove one-time workflow
        if: always()
        run: |
          git rm .github/workflows/update-jamia-faq-once.yml || true
          git commit -m 'Remove one-time Jamia FAQ workflow' || true
          git push || true

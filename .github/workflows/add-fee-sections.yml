name: Add KL fee bifurcation sections

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-fee-sections:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert dedicated fee sections
        run: |
          python - <<'PY'
          from pathlib import Path
          sections = {
            'kl-university-btech-cse.html': '''<section class="main-section" id="fee-bifurcation"><h2>KL University B.Tech CSE Fees: Complete Fee Bifurcation</h2><p>Students should separate the one-time admission charge from the recurring semester tuition fee and then add hostel, mess and other applicable costs. KLU's fee structure can change by academic year, campus and admission category, so historical figures are labelled below rather than presented as confirmed 2026-27 fees.</p><div class="table-wrapper"><table><tr><th>Fee component</th><th>Published figure</th><th>Frequency / status</th></tr><tr><td>Admission fee</td><td>₹15,000</td><td>One time; 2024 Vijayawada counselling reference</td></tr><tr><td>Semester tuition / merit fee</td><td>₹1,40,000</td><td>Per semester; 2024 Vijayawada counselling reference</td></tr><tr><td>Total first-semester payment</td><td><strong>₹1,55,000</strong></td><td>Admission fee + semester fee; 2024 reference</td></tr><tr><td>Hostel &amp; mess</td><td>Separate</td><td>Varies by accommodation and food plan</td></tr><tr><td>Examination / other charges</td><td>Separate where applicable</td><td>Verify in the current fee document</td></tr></table></div><div class="answer-box"><strong>What is the confirmed 2026-27 CSE fee?</strong><p>The current public material available for this page does not establish a final 2026-27 CSE fee. Use the fee stated in your 2026-27 counselling/offer document before making the payment. The ₹1.55 lakh figure above is a historical 2024 Vijayawada reference, not a current fee.</p></div></section><hr/>''',
            'kl-university-btech-ai-data-science.html': '''<section class="main-section" id="fee-bifurcation"><h2>KL University B.Tech AI &amp; Data Science Fees: Complete Fee Bifurcation</h2><p>KLU's official AI &amp; Data Science programme page publishes the 2025-26 fee structure separately for Vijayawada and Hyderabad. This is the clearest programme-specific fee data currently available here, but KLU states that fees are subject to change for 2026-27.</p><div class="table-wrapper"><table><tr><th>Fee component</th><th>Vijayawada</th><th>Hyderabad</th><th>Frequency / status</th></tr><tr><td>Admission fee</td><td>₹16,000</td><td>₹16,000</td><td>One time; 2025-26</td></tr><tr><td>Semester tuition fee</td><td>₹1,37,500</td><td>₹1,45,000</td><td>Per semester; 2025-26</td></tr><tr><td>Total first-semester payment</td><td><strong>₹1,53,500</strong></td><td><strong>₹1,61,000</strong></td><td>Admission fee + semester fee; 2025-26</td></tr><tr><td>Hostel &amp; mess</td><td>Separate</td><td>Separate</td><td>Not included in the figures above</td></tr><tr><td>Examination / other charges</td><td>Separate</td><td>Separate</td><td>Verify current fee document</td></tr></table></div><div class="answer-box"><strong>How much should I budget beyond tuition?</strong><p>Add hostel and mess, examination and other applicable university charges to the first-semester amount. Also check whether later semesters have the same tuition fee before calculating the four-year cost.</p></div><p class="source-note">The published ₹1,53,500 Vijayawada and ₹1,61,000 Hyderabad first-semester figures are based on 2025-26 and are subject to change for 2026-27.</p></section><hr/>''',
            'kl-university-mba.html': '''<section class="main-section" id="fee-bifurcation"><h2>KL University MBA Fees: Complete Fee Bifurcation</h2><p>MBA fees differ by format. KLU's published 2024 counselling schedule provides a useful historical breakdown into one-time admission fee and semester fee, while the Global MBA also has an international-semester cost. These figures should not be treated as confirmed 2026-27 fees unless KLU reissues them for the current cycle.</p><div class="table-wrapper"><table><tr><th>MBA format</th><th>Admission fee</th><th>Semester fee</th><th>Other programme cost</th><th>Published first-semester reference</th></tr><tr><td>MBA + ERP / multi-specialisations</td><td>₹15,000</td><td>₹1,57,500</td><td>ERP certification fee: ₹33,000 for the entire programme in the 2024 schedule</td><td><strong>₹1,72,500</strong> before the programme-level ERP fee</td></tr><tr><td>MBA FinTech</td><td>₹15,000</td><td>₹2,75,000</td><td>Verify any additional current charges</td><td><strong>₹2,90,000</strong></td></tr><tr><td>MBA Global Program</td><td>₹15,000</td><td>₹3,00,000</td><td>One semester abroad; foreign-university tuition plus travel, visa and living expenses apply</td><td><strong>₹3,15,000</strong> before foreign-semester costs</td></tr><tr><td>Hostel &amp; mess</td><td colspan="2">Separate</td><td colspan="2">Add according to campus and accommodation selected</td></tr></table></div><div class="answer-box"><strong>What should I use as my 2026-27 MBA budget?</strong><p>Use the current 2026-27 offer/counselling fee sheet for your exact MBA format. The table above is based on KLU's 2024 counselling schedule and is included to show the fee structure and major cost components, not to replace the current fee notice.</p></div></section><hr/>'''
          }
          links = {k:'<a href="#fee-bifurcation">Fee Bifurcation</a>' for k in sections}
          for name, section in sections.items():
              p=Path(name); text=p.read_text()
              if 'id="fee-bifurcation"' in text: continue
              marker='<section class="main-section" id="fees">'
              if marker not in text: raise SystemExit(f'Fees marker not found in {name}')
              text=text.replace(marker, section+marker, 1)
              text=text.replace('<details><summary>On this page</summary>', '<details><summary>On this page</summary>'+links[name], 1)
              text=text.replace('<div class="sidebar-title">On this page</div>', '<div class="sidebar-title">On this page</div>'+links[name], 1)
              p.write_text(text)
          PY
      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-fee-sections.yml
          git add kl-university-btech-cse.html kl-university-btech-ai-data-science.html kl-university-mba.html
          git commit -m "Add dedicated fee bifurcation sections to KL course pages"
          git push
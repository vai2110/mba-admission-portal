name: Fix MBA fee page separators v2

on:
  push:
    paths:
      - '.github/fee-fix-trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove unnecessary fee-page separators
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mba-college-fees.html')
          s = p.read_text(encoding='utf-8')
          for tag in ('<hr>', '<hr/>', '<hr />'):
              s = s.replace(tag, '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mba-college-fees.html
          git rm .github/fee-fix-trigger.txt .github/workflows/fix-mba-fees-separators-v2.yml
          git commit -m "Remove unnecessary separators from MBA fee page"
          git push
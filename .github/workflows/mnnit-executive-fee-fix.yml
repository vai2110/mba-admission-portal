name: MNNIT Executive MBA Fee Fix v2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fees:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update MNNIT Executive MBA fee information
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('school-management-studies-mnnit-allahabad.html'), Path('school-management-studies-mnnit-allahabad-mba.html'), Path('school-management-studies-mnnit-allahabad-executive-mba.html')]
          fee_note = '<p><strong>Reported fee: ₹2.10 lakh for the three-year part-time MBA/Executive MBA listing.</strong> This is indicative, not a confirmed 2027-29 institute fee. The official SMS page confirms the Executive MBA and intake of 30, but does not publish a numeric fee in the accessible material.</p>'
          fee_table = '<div class="table-wrapper"><table><thead><tr><th>Fee information</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr><td>Executive MBA / part-time MBA total fee</td><td><strong>₹2.10 lakh</strong></td><td>Reported current figure</td></tr><tr><td>Fee breakup</td><td>Not reliably published</td><td>Check latest MNNIT fee notice</td></tr></tbody></table></div>'
          disclaimer = '<p><small><strong>Fee note:</strong> The ₹2.10 lakh figure is not an official 2027 fee. MNNIT may revise fees; the latest institute notification remains final.</small></p>'
          for path in files:
              text = path.read_text(encoding='utf-8')
              marker = '<section class="main-section" id="fees">'
              start = text.find(marker)
              end = text.find('</section>', start)
              if start < 0 or end < 0:
                  raise SystemExit(f'Fees section not found in {path}')
              if path.name == 'school-management-studies-mnnit-allahabad-executive-mba.html':
                  new = '<section class="main-section" id="fees"><h2>What is the MNNIT Executive MBA fee?</h2>' + fee_note + fee_table + disclaimer + '</section>'
                  text = text[:start] + new + text[end+10:]
              else:
                  section = text[start:end]
                  if 'Executive MBA fee' not in section:
                      section += '<h3>What is the MNNIT Executive MBA fee?</h3>' + fee_note + fee_table + disclaimer
                      text = text[:start] + section + text[end:]
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add school-management-studies-mnnit-allahabad.html school-management-studies-mnnit-allahabad-mba.html school-management-studies-mnnit-allahabad-executive-mba.html
          git diff --cached --quiet || git commit -m "Add MNNIT Executive MBA fee details"
          git push

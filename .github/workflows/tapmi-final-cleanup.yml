name: TAPMI Final Cleanup

on:
  push:
    paths:
      - 'tapmi-manipal.html'
      - 'tapmi-manipal-mba.html'
      - 'tapmi-manipal-mba-bkfs.html'
      - 'tapmi-manipal-mba-hrm.html'
      - 'tapmi-manipal-placements.html'
      - '.github/workflows/tapmi-final-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final TAPMI navigation and upcoming-cycle dates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = [
              'tapmi-manipal.html',
              'tapmi-manipal-mba.html',
              'tapmi-manipal-mba-bkfs.html',
              'tapmi-manipal-mba-hrm.html',
              'tapmi-manipal-placements.html',
          ]
          changed = False
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'<nav class="college-cluster-nav".*?</nav>', '', text, flags=re.S)
              text = re.sub(r'\s*cite[^]*', '', text)
              if name == 'tapmi-manipal.html':
                  text = text.replace('TAPMI Manipal: MBA, Fees, Cutoff, Placements & Admission 2026', 'TAPMI Manipal: MBA, Fees, Cutoff, Placements & Admission 2027')
                  text = text.replace('TAPMI Admission Dates: What Is the Current Status?', 'TAPMI Admission Dates 2027-29: Tentative Timeline')
                  old_section = re.compile(r'<section class="main-section" id="dates">.*?</section><hr><section class="main-section" id="programmes">', re.S)
                  new_section = '''<section class="main-section" id="dates"><h2>TAPMI Admission Dates 2027-29: Tentative Timeline</h2><p><strong>TAPMI has not yet published the official admission schedule for the 2027-29 MBA batch.</strong> The timeline below is therefore a planning estimate, not an official TAPMI calendar. It is based on TAPMI's published 2025-27 and 2026-28 admission cycles, which followed a broadly similar pattern: applications opened in October-November, selection rounds were held in February-March, the first selection list was announced around April, and the MBA academic year began in June/July.</p><div class="table-wrapper"><table><tr><th>2027-29 admission stage</th><th>Tentative timeline</th><th>Status</th></tr><tr><td>Application opening</td><td><strong>October-November 2026</strong></td><td>Expected from previous-cycle pattern</td></tr><tr><td>Application deadline</td><td><strong>January 2027</strong></td><td>Expected from previous-cycle pattern</td></tr><tr><td>Shortlist announcement</td><td><strong>January-February 2027</strong></td><td>Expected</td></tr><tr><td>GD/WAT/PI</td><td><strong>February-March 2027</strong></td><td>Expected from previous-cycle pattern</td></tr><tr><td>First selection list</td><td><strong>April 2027</strong></td><td>Expected; previous cycles placed the first list around 10 April</td></tr><tr><td>First-year Term I</td><td><strong>June-July 2027</strong></td><td>Expected from previous-cycle pattern</td></tr></table></div><div class="answer-box"><strong>How should students use these dates?</strong><p>Use October-November 2026 as the likely application window and January-March 2027 as the period to closely watch for the application deadline, shortlist and GD/WAT/PI schedule. These are <strong>tentative planning windows only</strong>. Do not treat them as confirmed dates until TAPMI publishes the 2027-29 notification on its official admissions page.</p></div></section><hr><section class="main-section" id="programmes">'''
                  text, n = old_section.subn(new_section, text, count=1)
                  if n == 0:
                      print('WARNING: dates section not found in tapmi-manipal.html')
              text = re.sub(r'\s*cite[^]*', '', text)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed = True
                  print(f'UPDATED: {name}')
          if not changed:
              print('No TAPMI changes needed.')
          PY
      - name: Commit final TAPMI fixes
        run: |
          git config user.name "TAPMI Final Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tapmi-manipal*.html
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
          else
            git commit -m "Remove citation artifacts from TAPMI HTML"
            git push
          fi

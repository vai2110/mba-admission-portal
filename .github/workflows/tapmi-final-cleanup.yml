name: TAPMI Final Cleanup

on:
  push:
    paths:
      - 'tapmi-manipal.html'
      - 'tapmi-manipal-mba.html'
      - 'tapmi-manipal-mba-bkfs.html'
      - 'tapmi-manipal-mba-hrm.html'
      - 'tapmi-manipal-placements.html'
      - '.github/workflows/tapmi-final-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove TAPMI cluster strip and tool citation artefacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = [
              'tapmi-manipal.html',
              'tapmi-manipal-mba.html',
              'tapmi-manipal-mba-bkfs.html',
              'tapmi-manipal-mba-hrm.html',
              'tapmi-manipal-placements.html',
          ]
          changed = False
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'<nav class="college-cluster-nav".*?</nav>', '', text, flags=re.S)
              text = re.sub(r'\s*cite[^]*', '', text)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed = True
                  print(f'CLEANED: {name}')
          if not changed:
              print('No TAPMI cleanup changes needed.')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "TAPMI Final Cleanup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tapmi-manipal*.html
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
          else
            git commit -m "Remove TAPMI college navigation strip"
            git push
          fi

name: Update IIM Jammu placement depth
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update IIM Jammu pages
        run: |
          python - <<'PY'
          from pathlib import Path

          marker='<!-- IIMJ-PLACEMENT-DEPTH-V2 -->'
          latest='''<section class="main-section" id="placements"><h2>IIM Jammu Placements: Latest Completed Report & What It Means</h2><p><strong>The latest completed MBA final-placement report currently available from IIM Jammu is for the 2023-25 batch.</strong> The institute also lists a 2024-26 placement brochure, but that is not the same as a completed final-placement report. Therefore, this page uses 2023-25 for the latest verified outcome figures and keeps 2024-26 clearly labelled as the current brochure cycle.</p><div class="highlight-grid"><div class="highlight"><strong>₹26.60 LPA</strong><span>Highest CTC · MBA 2023-25</span></div><div class="highlight"><strong>₹16.04 LPA</strong><span>Average CTC · MBA 2023-25</span></div><div class="highlight"><strong>₹15.80 LPA</strong><span>Median CTC · MBA 2023-25</span></div></div><div class="answer-box"><strong>Student takeaway:</strong><p>For decision-making, the ₹15.80 LPA median and ₹16.04 LPA average are more useful than the ₹26.60 LPA highest CTC. Recruiter mix, role type and your target function should be checked before treating the package headline as your likely outcome.</p></div><a class="programme-link" href="iim-jammu-placements.html">Read the detailed IIM Jammu placements analysis →</a></section>'''

          overview=Path('iim-jammu.html')
          t=overview.read_text()
          t=t.replace('Latest detailed MBA average</span><span class="quick-fact-value">₹15.48 LPA','Latest MBA average</span><span class="quick-fact-value">₹16.04 LPA')
          old='<section class="main-section" id="placements"><h2>IIM Jammu Placements</h2><p>The latest detailed official MBA report available in the indexed placement archive is for 2022-24, while IIM Jammu currently lists the 2024-26 report as a new report on its placement page. The detailed 2022-24 report recorded over 150 participating companies, a highest CTC of ₹31.75 LPA, average CTC of ₹15.48 LPA and median CTC of ₹15 LPA.</p><div class="highlight-grid"><div class="highlight"><strong>₹31.75 LPA</strong><span>Highest CTC, MBA 2022-24</span></div><div class="highlight"><strong>₹15.48 LPA</strong><span>Average CTC</span></div><div class="highlight"><strong>₹15.00 LPA</strong><span>Median CTC</span></div></div><a class="programme-link" href="iim-jammu-placements.html">Read detailed placement analysis →</a></section>'
          t=t.replace(old, latest)
          t=t.replace('<a href="#placements">Placements</a><a href="#fit">','<a href="#placements">Placements</a><a href="#student-discussion">Student Discussions</a><a href="#fit">')
          t=t.replace('<section class="main-section" id="fit">','''<section class="main-section" id="student-discussion"><h2>Students’ Discussions & Practical Inference</h2><p>Recent student and aspirant discussions repeatedly focus on whether IIM Jammu placements are sufficiently diverse for students who want to avoid sales-heavy roles. These discussions are useful for identifying questions to ask, but they are not placement statistics and should not replace the institute’s reports.</p><div class="answer-box"><strong>What the discussion suggests:</strong><p>Students commonly distinguish between the headline package and the actual role offered. If your target is finance, consulting, analytics or strategy, examine the role descriptions and recruiter mix carefully and build a strong profile rather than assuming every student gets the same type of role.</p></div></section><hr><section class="main-section" id="fit">''')
          overview.write_text(t)

          mba=Path('iim-jammu-mba.html'); t=mba.read_text()
          old2='<section class="main-section" id="placements"><h2>IIM Jammu MBA Placements</h2><p>The detailed official 2022-24 MBA placement report recorded more than 150 participating companies, 56 first-time recruiters, highest CTC of ₹31.75 LPA, average CTC of ₹15.48 LPA and median CTC of ₹15 LPA.</p><div class="highlight-grid"><div class="highlight"><strong>₹31.75 LPA</strong><span>Highest CTC</span></div><div class="highlight"><strong>₹15.48 LPA</strong><span>Average CTC</span></div><div class="highlight"><strong>₹15 LPA</strong><span>Median CTC</span></div></div><p>Reported recruiter sectors and roles include product management, marketing, consulting, finance and general management, with recruiters such as Unacademy, BNY Mellon, Diageo, Standard Chartered, ICICI Bank, Cognizant, Deloitte, HDFC Bank, Infosys, Thomson Reuters, Aditya Birla Capital and Vedanta.</p></section>'
          new2='''<section class="main-section" id="placements"><h2>IIM Jammu MBA Placements: Latest 2023-25 Outcomes</h2><p>The latest completed MBA final-placement report listed by IIM Jammu is for the 2023-25 batch. It reports <strong>₹26.60 LPA highest CTC, ₹16.04 LPA average CTC and ₹15.80 LPA median CTC</strong>, with 200 recruiters, 250 offers and 24 PPOs. IIM Jammu also lists a 2024-26 placement brochure, but that should be treated as the current brochure cycle rather than a completed outcome report.</p><div class="highlight-grid"><div class="highlight"><strong>₹26.60 LPA</strong><span>Highest CTC</span></div><div class="highlight"><strong>₹16.04 LPA</strong><span>Average CTC</span></div><div class="highlight"><strong>₹15.80 LPA</strong><span>Median CTC</span></div></div><p>For students, the median is the better first benchmark. The next question is role quality: finance, consulting, analytics, product, marketing and general-management opportunities can have very different day-to-day work even when their CTC is similar.</p></section>'''
          t=t.replace(old2,new2)
          t=t.replace('<a href="#placements">Placements</a></details>','<a href="#placements">Placements</a><a href="#student-discussion">Student Discussions</a></details>')
          t=t.replace('<a href="#placements">Placements</a></div>','<a href="#placements">Placements</a><a href="#student-discussion">Student Discussions</a></div>')
          t=t.replace('<section class="main-section" id="faq">','''<section class="main-section" id="student-discussion"><h2>Students’ Discussions & Practical Inference</h2><p>Recent aspirant and student discussions raise a recurring question: <strong>are the available roles broad enough for someone who does not want a sales-heavy career?</strong> Discussions are mixed and anecdotal, so they should be used as a prompt for due diligence rather than as a substitute for placement data.</p><div class="two-column"><div class="pro-box"><h3>If you want finance/consulting/analytics</h3><ul><li>Check the actual job descriptions, not just sector names.</li><li>Use summer internships to build domain credibility.</li><li>Strengthen Excel, SQL, analytics, finance or case-interview skills as relevant.</li></ul></div><div class="warning-box"><h3>If you are open to sales/marketing</h3><p>The recruiter universe can be broader, particularly across BFSI, consumer and business-development roles. Your decision should therefore depend on your target function, not only the IIM label or highest package.</p></div></div></section><hr><section class="main-section" id="faq">''')
          mba.write_text(t)

          hc=Path('iim-jammu-mba-hc.html'); t=hc.read_text()
          old3='<section class="main-section" id="placements"><h2>IIM Jammu MBA Healthcare Placements</h2><p>The first MBA HA & HM batch (2022-24) reported 100% placement. Forty-four students appeared for final placements and more than 56 companies participated. The highest domestic CTC was ₹32 LPA, average CTC ₹14.01 LPA and median CTC ₹13 LPA.</p><div class="highlight-grid"><div class="highlight"><strong>₹32 LPA</strong><span>Highest domestic CTC</span></div><div class="highlight"><strong>₹14.01 LPA</strong><span>Average CTC</span></div><div class="highlight"><strong>₹13 LPA</strong><span>Median CTC</span></div></div><p>Roles spanned healthcare, product management, marketing, consulting, finance, general management, operations and healthcare-related supply chain.</p></section>'
          new3='''<section class="main-section" id="placements"><h2>IIM Jammu MBA Healthcare Placements: Latest Available Report</h2><p>IIM Jammu currently lists a <strong>2023-25 MBA HA & HM final placement report</strong> and a 2024-26 brochure on its official placement archive. The earlier 2022-24 report should therefore be treated as historical rather than the latest outcome. The first completed cohort reported 100% placement, 56+ companies, ₹32 LPA highest domestic CTC, ₹14.01 LPA average and ₹13 LPA median.</p><div class="highlight-grid"><div class="highlight"><strong>2023-25</strong><span>Latest completed report listed by IIM Jammu</span></div><div class="highlight"><strong>2024-26</strong><span>Latest brochure cycle listed</span></div><div class="highlight"><strong>₹14.01 LPA</strong><span>2022-24 average · historical benchmark</span></div></div><p>Because the specialised healthcare cohort is much smaller than the flagship MBA cohort, students should compare healthcare-specific roles, recruiter relevance and median salary rather than directly ranking the two programmes by their highest CTC.</p></section>'''
          t=t.replace(old3,new3)
          t=t.replace('<a href="#placements">Placements</a></details>','<a href="#placements">Placements</a><a href="#student-discussion">Student Discussions</a></details>')
          t=t.replace('<a href="#placements">Placements</a></div>','<a href="#placements">Placements</a><a href="#student-discussion">Student Discussions</a></div>')
          t=t.replace('<section class="main-section" id="fit">','''<section class="main-section" id="student-discussion"><h2>Students’ Discussions & Practical Inference</h2><p>Student discussions around MBA Healthcare usually centre on one question: <strong>will the programme lead to healthcare-specific careers or a broader MBA-style role set?</strong> The placement data shows a mix of healthcare and general management functions, so candidates should examine recruiter names and role descriptions before joining.</p><div class="answer-box"><strong>Practical inference:</strong><p>Choose this programme primarily when healthcare is a genuine career interest. If your only objective is general consulting, finance or marketing flexibility, compare the flagship MBA and other options before paying the programme fee.</p></div></section><hr><section class="main-section" id="fit">''')
          hc.write_text(t)

          ai=Path('iim-jammu-mba-ai-ba.html'); t=ai.read_text()
          t=t.replace('<a href="#curriculum">Curriculum</a><a href="#ait">','<a href="#curriculum">Curriculum</a><a href="#student-discussion">Student Discussions</a><a href="#ait">')
          t=t.replace('<section class="main-section" id="faq">','''<section class="main-section" id="student-discussion"><h2>Students’ Discussions & Practical Inference</h2><p>Because the AI & Business Analytics MBA is a newer dual-degree programme, students should be careful about borrowing placement expectations from the flagship MBA. The programme is designed around AI, analytics and technology, and its second-year AIT structure adds international exposure, but a mature programme-specific final-placement history is still developing.</p><div class="answer-box"><strong>What should an applicant verify?</strong><p>Ask about the first graduating batch, programme-specific recruiter participation, role titles, placement eligibility after the AIT year, total living costs and how employers view the dual degree. Treat general IIM Jammu placement figures as context, not as guaranteed AI & BA outcomes.</p></div></section><hr><section class="main-section" id="faq">''')
          ai.write_text(t)

          p=Path('iim-jammu-placements.html'); t=p.read_text()
          if marker not in t:
              t=t.replace('<head>','<head>',1)
          # Replace latest section
          start=t.find('<section class="main-section" id="latest">')
          end=t.find('<hr><section class="main-section" id="history">')
          latest2='''<section class="main-section" id="latest"><h2>IIM Jammu Placements 2025: Latest Completed MBA Report</h2><p><strong>The latest completed MBA final-placement report currently listed by IIM Jammu is for the 2023-25 batch.</strong> The official placement archive also lists a 2024-26 brochure marked new, but no completed 2024-26 final-placement report is listed there yet. This distinction matters when answering “latest placement” queries.</p><div class="highlight-grid"><div class="highlight"><strong>₹26.60 LPA</strong><span>Highest CTC · 2023-25</span></div><div class="highlight"><strong>₹16.04 LPA</strong><span>Average CTC · 2023-25</span></div><div class="highlight"><strong>₹15.80 LPA</strong><span>Median CTC · 2023-25</span></div></div><div class="table-wrapper"><table><tr><th>Placement metric</th><th>MBA 2023-25</th><th>Why students should care</th></tr><tr><td>Highest CTC</td><td>₹26.60 LPA</td><td>Shows upside, not the typical outcome.</td></tr><tr><td>Average CTC</td><td>₹16.04 LPA</td><td>Useful for broad cohort comparison.</td></tr><tr><td>Median CTC</td><td>₹15.80 LPA</td><td>Better indicator of the middle student outcome.</td></tr><tr><td>Recruiters</td><td>200</td><td>Indicates breadth of employer participation.</td></tr><tr><td>Offers</td><td>250</td><td>Shows total offers generated for the batch.</td></tr><tr><td>PPOs</td><td>24</td><td>Signals conversion of internship performance into final roles.</td></tr><tr><td>New recruiters</td><td>50</td><td>Indicates continuing recruiter expansion.</td></tr></table></div><div class="answer-box"><strong>Bottom line:</strong><p>The ₹15.80 LPA median is the number a student should anchor on first. Then examine whether the roles offered match your target function. A high CTC with an unsuitable role can still be a poor career fit.</p></div></section><hr><section class="main-section" id="history">'''
          if start!=-1 and end!=-1: t=t[:start]+latest2+t[end+len('<hr><section class="main-section" id="history">'):]
          t=t.replace('<a href="#interpretation">How to read the numbers</a><a href="#faq">FAQs</a>','<a href="#interpretation">How to read the numbers</a><a href="#student-discussion">Student discussions</a><a href="#faq">FAQs</a>')
          insert='''<hr><section class="main-section" id="student-discussion"><h2>Students’ Discussions: What Aspirants Are Actually Worried About</h2><p>Recent Reddit discussions show that applicants are less interested in the headline package alone and more concerned about <strong>role quality, sales-heavy hiring, finance/consulting opportunities, placement transparency and actual outcomes for freshers versus work-ex candidates</strong>. These are anecdotal discussions, not official statistics, but they reveal the questions students should ask before joining.</p><div class="table-wrapper"><table><tr><th>Student concern</th><th>What the available evidence suggests</th><th>How to interpret it</th></tr><tr><td>Are placements mostly sales?</td><td>Student discussions repeatedly raise this concern, especially around BFSI and marketing roles.</td><td>Do not convert discussion into a percentage. Check actual role titles and recruiter-wise openings.</td></tr><tr><td>Can I target finance/consulting?</td><td>Finance and consulting recruiters do appear in the placement ecosystem.</td><td>These roles are more selective; profile, internship and skills matter.</td></tr><tr><td>Is the highest package realistic?</td><td>The latest completed report shows ₹26.60 LPA highest versus ₹15.80 LPA median.</td><td>Use median/average as the baseline, not the highest package.</td></tr><tr><td>Does the IIM tag guarantee a role?</td><td>No. Placement is employer- and role-dependent.</td><td>Evaluate the programme for career fit, not brand alone.</td></tr></table></div><p><strong>Inference:</strong> IIM Jammu can make sense for a student who is comfortable with a broad management placement pool and is willing to actively shape a target function. A student who is completely unwilling to consider sales/relationship-oriented roles should compare the recruiter and role mix of alternative colleges before accepting the offer. citeturn1reddit1turn1reddit3</p></section>'''
          t=t.replace('<hr><section class="main-section" id="faq">',insert+'<hr><section class="main-section" id="faq">')
          # Update history first row if present
          t=t.replace('<tr><td>2022-24</td><td>₹31.75 LPA</td><td>₹15.48 LPA</td><td>₹15.00 LPA</td></tr>','<tr><td>2023-25</td><td>₹26.60 LPA</td><td>₹16.04 LPA</td><td>₹15.80 LPA</td></tr><tr><td>2022-24</td><td>₹31.75 LPA</td><td>₹15.48 LPA</td><td>₹15.00 LPA</td></tr>')
          # Update FAQ answers
          t=t.replace('The detailed official 2022-24 report recorded an average CTC of ₹15.48 LPA and median CTC of ₹15 LPA.','The latest completed 2023-25 MBA report recorded an average CTC of ₹16.04 LPA and median CTC of ₹15.80 LPA.')
          t=t.replace('The 2022-24 MBA report recorded ₹31.75 LPA as the highest CTC. Older batches had different peak figures.','The latest completed 2023-25 MBA report recorded ₹26.60 LPA as the highest CTC. The earlier 2022-24 report had a higher peak, but it is no longer the latest completed cycle.')
          p.write_text(t)
          print('IIM Jammu pages updated')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iim-jammu.html iim-jammu-mba.html iim-jammu-mba-hc.html iim-jammu-mba-ai-ba.html iim-jammu-placements.html
          git diff --cached --quiet || git commit -m "Deepen IIM Jammu placement and student discussion content"
          git push

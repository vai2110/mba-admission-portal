name: Improve IIM Sambalpur table mobile layout
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update IIM Sambalpur table styles
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              'iim-sambalpur.html',
              'iim-sambalpur-mba.html',
              'iim-sambalpur-mba-ba.html',
              'iim-sambalpur-placements.html',
          ]

          style = '''<style id="iim-table-mobile-fix">
          /* IIM Sambalpur: tables stay inside the viewport on mobile */
          .iim-sambalpur-table-fix .table-wrapper{width:100%;overflow-x:visible;margin:15px 0 19px}
          .iim-sambalpur-table-fix .table-wrapper table{width:100%;min-width:0;table-layout:fixed;border-collapse:collapse}
          .iim-sambalpur-table-fix .table-wrapper th,.iim-sambalpur-table-fix .table-wrapper td{overflow-wrap:anywhere;word-break:normal}
          @media(max-width:720px){
            .iim-sambalpur-table-fix .table-wrapper{overflow:visible}
            .iim-sambalpur-table-fix .table-wrapper table{width:100%;font-size:10.5px}
            .iim-sambalpur-table-fix .table-wrapper th{padding:7px 5px;line-height:1.3;font-size:10px}
            .iim-sambalpur-table-fix .table-wrapper td{padding:7px 5px;line-height:1.45}
            .iim-sambalpur-table-fix .table-wrapper p{font-size:12px}
          }
          @media(max-width:380px){
            .iim-sambalpur-table-fix .table-wrapper table{font-size:10px}
            .iim-sambalpur-table-fix .table-wrapper th{padding:6px 4px;font-size:9.5px}
            .iim-sambalpur-table-fix .table-wrapper td{padding:6px 4px}
          }
          </style>'''

          for name in files:
              p = Path(name)
              text = p.read_text()
              if 'id="iim-table-mobile-fix"' not in text:
                  text = text.replace('<link rel="stylesheet" href="sibm-bengaluru.css">', '<link rel="stylesheet" href="sibm-bengaluru.css">' + style, 1)
              text = text.replace('<body>', '<body class="iim-sambalpur-table-fix">', 1)
              p.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iim-sambalpur.html iim-sambalpur-mba.html iim-sambalpur-mba-ba.html iim-sambalpur-placements.html
          git diff --cached --quiet || git commit -m "Make IIM Sambalpur tables mobile friendly"
          git push
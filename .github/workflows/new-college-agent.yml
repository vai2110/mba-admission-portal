name: New College Page Agent

on:
  workflow_dispatch:
    inputs:
      college_name:
        description: 'Full official college/institute name'
        required: true
        type: string
      college_slug:
        description: 'URL-safe slug'
        required: true
        type: string
      page_count:
        description: 'Target package size'
        required: true
        type: choice
        options: ['5','4','3']
        default: '5'
      create_pages:
        description: 'Create HTML pages after research and programme selection'
        required: true
        type: boolean
        default: true
      run_full_audit:
        description: 'Run SEO/AEO/GEO + content + integrity audit after creation'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: new-college-disabled
  cancel-in-progress: false

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Duplicate New College Page Agent is intentionally paused. Use College Production Queue after benchmark repairs are complete."

name: LPU Content Architecture Cleanup

on:
  push:
    branches: [main]
    paths:
      - 'lovely-professional-university*.html'
      - '.github/workflows/lpu-cluster-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

# LPU pages are protected here because the permanent site rule is:
# never create or retain a college-cluster / "Explore this college" strip.
# Internal links belong naturally inside existing content paragraphs.

jobs:
  cleanup-and-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove forced navigation and keep natural contextual links
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = [
            'lovely-professional-university.html','lovely-professional-university-btech.html','lovely-professional-university-mba.html',
            'lovely-professional-university-bba.html','lovely-professional-university-bca.html','lovely-professional-university-mca.html',
            'lovely-professional-university-law.html','lovely-professional-university-pharmacy.html','lovely-professional-university-design.html',
            'lovely-professional-university-mtech.html','lovely-professional-university-admission.html',
            'lovely-professional-university-fees-scholarships.html','lovely-professional-university-placements.html','lovely-professional-university-hostel.html'
          ]
          H = {
            'overview':'lovely-professional-university.html','btech':'lovely-professional-university-btech.html','mba':'lovely-professional-university-mba.html',
            'bba':'lovely-professional-university-bba.html','bca':'lovely-professional-university-bca.html','mca':'lovely-professional-university-mca.html',
            'law':'lovely-professional-university-law.html','pharmacy':'lovely-professional-university-pharmacy.html','design':'lovely-professional-university-design.html',
            'mtech':'lovely-professional-university-mtech.html','admission':'lovely-professional-university-admission.html',
            'fees':'lovely-professional-university-fees-scholarships.html','placements':'lovely-professional-university-placements.html','hostel':'lovely-professional-university-hostel.html'
          }
          plans = {
            'lovely-professional-university.html': [('B.Tech',H['btech']),('MBA',H['mba']),('BBA',H['bba']),('BCA',H['bca']),('MCA',H['mca']),('law programmes',H['law']),('pharmacy programmes',H['pharmacy']),('design programmes',H['design']),('M.Tech',H['mtech']),('admission',H['admission']),('fees',H['fees']),('placements',H['placements']),('hostel',H['hostel'])],
            'lovely-professional-university-btech.html': [('LPU',H['overview']),('admission process',H['admission']),('fees',H['fees']),('placements',H['placements']),('hostel',H['hostel'])],
            'lovely-professional-university-mba.html': [('LPU',H['overview']),('admission route',H['admission']),('fees',H['fees']),('placements',H['placements']),('hostel',H['hostel'])],
            'lovely-professional-university-bba.html': [('LPU',H['overview']),('admission',H['admission']),('fees',H['fees']),('placements',H['placements']),('hostel',H['hostel'])],
            'lovely-professional-university-bca.html': [('LPU',H['overview']),('admission',H['admission']),('fees',H['fees']),('placements',H['placements']),('hostel',H['hostel'])],
            'lovely-professional-university-mca.html': [('LPU',H['overview']),('admission',H['admission']),('fees',H['fees']),('placements',H['placements']),('hostel',H['hostel'])],
            'lovely-professional-university-law.html': [('LPU',H['overview']),('admissions',H['admission']),('fees',H['fees']),('placements',H['placements']),('hostel',H['hostel'])],
            'lovely-professional-university-pharmacy.html': [('LPU',H['overview']),('admission',H['admission']),('fees',H['fees']),('placements',H['placements']),('hostel',H['hostel'])],
            'lovely-professional-university-design.html': [('LPU',H['overview']),('admission',H['admission']),('fees',H['fees']),('placements',H['placements']),('hostel',H['hostel'])],
            'lovely-professional-university-mtech.html': [('LPU',H['overview']),('admission',H['admission']),('fees',H['fees']),('placements',H['placements']),('hostel',H['hostel'])],
            'lovely-professional-university-admission.html': [('LPU',H['overview']),('B.Tech',H['btech']),('MBA',H['mba']),('BBA',H['bba']),('BCA',H['bca']),('MCA',H['mca']),('fees',H['fees']),('placements',H['placements'])],
            'lovely-professional-university-fees-scholarships.html': [('LPU',H['overview']),('B.Tech',H['btech']),('MBA',H['mba']),('BBA',H['bba']),('BCA',H['bca']),('MCA',H['mca']),('hostel',H['hostel']),('admission',H['admission'])],
            'lovely-professional-university-placements.html': [('LPU',H['overview']),('B.Tech',H['btech']),('MBA',H['mba']),('BBA',H['bba']),('BCA',H['bca']),('MCA',H['mca']),('fees',H['fees']),('admission',H['admission'])],
            'lovely-professional-university-hostel.html': [('LPU',H['overview']),('B.Tech',H['btech']),('MBA',H['mba']),('BBA',H['bba']),('BCA',H['bca']),('MCA',H['mca']),('fees',H['fees']),('admission',H['admission'])]
          }

          section_re = re.compile(r'<section\b[^>]*\bid=["\']lpu-pages["\'][^>]*>.*?</section>\s*(?:<hr\s*/?>)?', re.I|re.S)
          cluster_nav_re = re.compile(r'<nav\b[^>]*class=["\'][^"\']*college-cluster-nav[^"\']*["\'][^>]*>.*?</nav>\s*', re.I|re.S)
          cluster_css_re = re.compile(r'\.college-cluster-nav[^\{]*\{[^}]*\}', re.I|re.S)
          hero_logo_re = re.compile(r'<div\b[^>]*class=["\'][^"\']*hero-logo-box[^"\']*["\'][^>]*>.*?</div>\s*', re.I|re.S)
          hero_label_re = re.compile(r'<(?:div|span|p)\b[^>]*class=["\'][^"\']*(?:hero-(?:kicker|eyebrow|label|small-title|program-label)|hero-kicker|hero-eyebrow)[^"\']*["\'][^>]*>.*?</(?:div|span|p)>\s*', re.I|re.S)
          p_re = re.compile(r'<p\b[^>]*>.*?</p>', re.I|re.S)
          bad_mba_link_re = re.compile(r'<a class=\\*"programme-link\\*" href=\\*"lovely-professional-university-admission\.html\\*">(?:LPU MBA admission process|MBA admission ecosystem)</a>')

          for path in map(Path, pages):
            if not path.exists(): continue
            text = path.read_text(encoding='utf-8')
            text = section_re.sub('', text)
            text = cluster_nav_re.sub('', text)
            text = cluster_css_re.sub('', text)
            text = hero_logo_re.sub('', text)
            text = hero_label_re.sub('', text)
            text = bad_mba_link_re.sub('<a class="programme-link" href="lovely-professional-university-admission.html">MBA admission ecosystem</a>', text)
            text = re.sub(r'(<a class="programme-link" href="lovely-professional-university-admission\.html">)admission(</a>)s', r'\1admissions\2', text)
            path.write_text(text, encoding='utf-8')

          def add_link(text, phrase, href):
            if f'href="{href}"' in text:
              return text, False
            for m in p_re.finditer(text):
              para = m.group(0)
              for pm in re.finditer(re.escape(phrase), para, re.I):
                before = para[:pm.start()].lower()
                if before.rfind('<a ') > before.rfind('</a>'):
                  continue
                replacement = f'<a class="programme-link" href="{href}">{pm.group(0)}</a>'
                para2 = para[:pm.start()] + replacement + para[pm.end():]
                return text[:m.start()] + para2 + text[m.end():], True
            return text, False

          for filename in pages:
            path=Path(filename)
            if not path.exists(): continue
            text=path.read_text(encoding='utf-8'); original=text
            for phrase,href in plans.get(filename,[]):
              text,_=add_link(text,phrase,href)
            if text != original:
              path.write_text(text,encoding='utf-8')

      - name: Verify LPU contract before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          pages=list(Path('.').glob('lovely-professional-university*.html'))
          for p in pages:
              s=p.read_text(encoding='utf-8')
              if 'college-cluster-nav' in s or 'Explore this college' in s:
                  raise SystemExit(f'Forbidden LPU cluster navigation remains in {p.name}')
              if 'hero-logo-box' in s:
                  raise SystemExit(f'Forbidden LPU hero logo label remains in {p.name}')
              if 'cite' in s or 'turn0search' in s:
                  raise SystemExit(f'Citation/debug artifact remains in {p.name}')
          print(f'LPU contract PASS: {len(pages)} pages')
          PY

      - name: Commit LPU internal-link cleanup
        run: |
          git config user.name 'LPU Content Architecture Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lovely-professional-university*.html
          if git diff --cached --quiet; then echo 'No LPU pages changed.'; else git commit -m 'Finalize LPU contextual internal links'; git push; fi

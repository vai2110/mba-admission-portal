name: LPU Content Architecture Cleanup

on:
  push:
    branches: [main]
    paths:
      - 'lovely-professional-university*.html'
      - '.github/workflows/lpu-cluster-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-and-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove forced LPU navigation blocks and add natural contextual links
        shell: python
        run: |
          from pathlib import Path
          import re
          pages = [
            'lovely-professional-university.html','lovely-professional-university-btech.html','lovely-professional-university-mba.html','lovely-professional-university-bba.html','lovely-professional-university-bca.html','lovely-professional-university-mca.html','lovely-professional-university-law.html','lovely-professional-university-pharmacy.html','lovely-professional-university-design.html','lovely-professional-university-mtech.html','lovely-professional-university-admission.html','lovely-professional-university-fees-scholarships.html','lovely-professional-university-placements.html','lovely-professional-university-hostel.html'
          ]
          links = {
            'overview':'lovely-professional-university.html','btech':'lovely-professional-university-btech.html','mba':'lovely-professional-university-mba.html','bba':'lovely-professional-university-bba.html','bca':'lovely-professional-university-bca.html','mca':'lovely-professional-university-mca.html','law':'lovely-professional-university-law.html','pharmacy':'lovely-professional-university-pharmacy.html','design':'lovely-professional-university-design.html','mtech':'lovely-professional-university-mtech.html','admission':'lovely-professional-university-admission.html','fees':'lovely-professional-university-fees-scholarships.html','placements':'lovely-professional-university-placements.html','hostel':'lovely-professional-university-hostel.html'
          }
          plans = {
            'lovely-professional-university.html': [('B.Tech',links['btech']),('MBA',links['mba']),('BBA',links['bba']),('BCA',links['bca']),('MCA',links['mca']),('admission',links['admission']),('fees',links['fees']),('placements',links['placements']),('hostel',links['hostel'])],
            'lovely-professional-university-btech.html': [('admission',links['admission']),('fees',links['fees']),('placements',links['placements']),('hostel',links['hostel']),('LPU offers',links['overview'])],
            'lovely-professional-university-mba.html': [('admission',links['admission']),('fees',links['fees']),('placements',links['placements']),('hostel',links['hostel']),('LPU offers',links['overview'])],
            'lovely-professional-university-bba.html': [('admission',links['admission']),('fees',links['fees']),('placements',links['placements']),('hostel',links['hostel']),('LPU offers',links['overview'])],
            'lovely-professional-university-bca.html': [('admission',links['admission']),('fees',links['fees']),('placements',links['placements']),('hostel',links['hostel']),('LPU offers',links['overview'])],
            'lovely-professional-university-mca.html': [('admission',links['admission']),('fees',links['fees']),('placements',links['placements']),('hostel',links['hostel']),('LPU offers',links['overview'])],
            'lovely-professional-university-law.html': [('admission',links['admission']),('fees',links['fees']),('placements',links['placements']),('hostel',links['hostel']),('LPU offers',links['overview'])],
            'lovely-professional-university-pharmacy.html': [('admission',links['admission']),('fees',links['fees']),('placements',links['placements']),('hostel',links['hostel']),('LPU offers',links['overview'])],
            'lovely-professional-university-design.html': [('admission',links['admission']),('fees',links['fees']),('placements',links['placements']),('hostel',links['hostel']),('LPU offers',links['overview'])],
            'lovely-professional-university-mtech.html': [('admission',links['admission']),('fees',links['fees']),('placements',links['placements']),('hostel',links['hostel']),('LPU offers',links['overview'])],
            'lovely-professional-university-admission.html': [('B.Tech',links['btech']),('MBA',links['mba']),('fees',links['fees']),('placements',links['placements'])],
            'lovely-professional-university-fees-scholarships.html': [('B.Tech',links['btech']),('MBA',links['mba']),('BBA',links['bba']),('BCA',links['bca']),('hostel',links['hostel']),('admission',links['admission'])],
            'lovely-professional-university-placements.html': [('B.Tech',links['btech']),('MBA',links['mba']),('BBA',links['bba']),('BCA',links['bca']),('fees',links['fees']),('hostel',links['hostel'])],
            'lovely-professional-university-hostel.html': [('B.Tech',links['btech']),('MBA',links['mba']),('BBA',links['bba']),('fees',links['fees']),('admission',links['admission'])],
          }
          section_re = re.compile(r'<section\b[^>]*\bid=["\']lpu-pages["\'][^>]*>.*?</section>\s*(?:<hr\s*/?>)?', re.I|re.S)
          hero_label_re = re.compile(r'<(?:div|span|p)\b[^>]*class=["\'][^"\']*(?:hero-(?:kicker|eyebrow|label|small-title|program-label)|hero-kicker|hero-eyebrow)[^"\']*["\'][^>]*>.*?</(?:div|span|p)>\s*', re.I|re.S)
          p_re = re.compile(r'<p\b[^>]*>.*?</p>', re.I|re.S)
          changed=[]
          for filename in pages:
            p=Path(filename)
            if not p.exists(): continue
            text=p.read_text(encoding='utf-8'); original=text
            text=section_re.sub('',text)
            text=hero_label_re.sub('',text)
            for phrase,href in plans.get(filename,[]):
              if f'href="{href}"' in text: continue
              for m in p_re.finditer(text):
                para=m.group(0); pm=re.search(re.escape(phrase),para,re.I)
                if not pm: continue
                before=para[:pm.start()]
                if before.lower().rfind('<a ') > before.lower().rfind('</a>'): continue
                anchor=f'<a class="programme-link" href="{href}">{pm.group(0)}</a>'
                para2=para[:pm.start()]+anchor+para[pm.end():]
                text=text[:m.start()]+para2+text[m.end():]
                break
            if text!=original:
              p.write_text(text,encoding='utf-8'); changed.append(filename)
          print('Updated:',', '.join(changed) if changed else 'No LPU pages changed.')
      - name: Commit LPU architecture cleanup
        run: |
          git config user.name 'LPU Content Architecture Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lovely-professional-university*.html
          if git diff --cached --quiet; then echo 'No LPU content changes to commit.'; else git commit -m 'Remove forced LPU navigation and add contextual links'; git push; fi

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>
<title>
IIM Ahmedabad MBA 2026–28: Admission, Fees, CAT Cutoff, Placements & Student Insights
</title>
<style>


/* =========================================================
   HERO
========================================================= */

.hero {
    background:
        linear-gradient(
            110deg,
            #172554 0%,
            #1d4ed8 100%
        );

    color: #ffffff;

    padding: 30px 0;
}

.hero-container {
    width: min(1240px, calc(100% - 40px));
    margin: 0 auto;

    min-height: 165px;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 360px);

    gap: 14px;

    align-items: center;
}


/* LEFT SIDE OF HERO */

.hero-main {
    display: flex;
    align-items: center;
    gap: 20px;

    min-width: 0;
}

.hero-logo-wrap {
    width: 82px;
    height: 82px;

    min-width: 82px;

    background: #ffffff;

    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 7px;

    box-shadow:
        0 5px 18px
        rgba(0, 0, 0, 0.18);
}

.hero-logo {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;
}

.hero-text {
    min-width: 0;
}

.hero-kicker {
    font-size: 11px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 0.4px;

    color: #dbeafe;

    margin-bottom: 4px;
}

.hero h1 {
    font-size: 34px;

    line-height: 1.18;

    color: #ffffff;

    margin: 0 0 5px;
}

.hero h2 {
    font-size: 17px;

    line-height: 1.4;

    font-weight: 600;

    color: #e0ecff;

    margin: 0 0 8px;
}

.hero-location {
    font-size: 13px;

    color: #dbeafe;

    font-weight: 600;
}


/* CAMPUS IMAGE */

.hero-image-wrap {
    width: 100%;
    max-width: 360px;
    aspect-ratio: 360 / 155;

    justify-self: start;

    position: relative;

    overflow: hidden;

    border-radius: 9px;

    border:
        1px solid
        rgba(255,255,255,0.35);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.20);
}

.hero-campus-image {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

.hero-image-caption {
    position: absolute;

    left: 10px;
    bottom: 8px;

    color: #ffffff;

    font-size: 10px;

    font-weight: 700;

    text-shadow:
        0 1px 4px
        rgba(0,0,0,0.7);
}


/* =========================================================
   MOBILE BREAKPOINT
========================================================= */

@media (max-width: 768px) {

    .hero-container {
        grid-template-columns: 1fr;
        min-height: 0;
    }

    .hero-main {
        flex-wrap: wrap;
    }

    .hero-image-wrap {
        max-width: 100%;
        justify-self: stretch;
    }

    .hero h1 {
        font-size: 26px;
    }

    .hero h2 {
        font-size: 15px;
    }

}

</style>
</head>
<body>
<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">

<div class="hero-container">


    <div class="hero-main">


        <div class="hero-logo-wrap">

            <img
                src="iima-logo.png"
                alt="IIM Ahmedabad official logo"
                class="hero-logo"
            >

        </div>


        <div class="hero-text">

            <h1>
                IIM Ahmedabad MBA 2026–28
            </h1>

            <h2>
                Admission, Fees, CAT Cutoff,
                Placements & Student Insights
            </h2>

            <div class="hero-location">
                Ahmedabad, Gujarat &nbsp; • &nbsp; MBA / PGP
            </div>

        </div>

    </div>


    <div class="hero-image-wrap">

        <img
            src="iima-campus.jpg"
            alt="IIM Ahmedabad campus"
            class="hero-campus-image"
        >
    </div>
</div>
</section>

</body>
</html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Quality Audit | MBA Portal</title><style>
body{font-family:Arial,sans-serif;background:#f7f9fc;color:#26364a;margin:0}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.hero{background:#173b7a;color:white;border-radius:12px;padding:24px}.hero h1{margin:0 0 6px}.muted{color:#667085}.hero .muted{color:#dbe7ff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card{background:white;border:1px solid #e1e7ef;border-radius:10px;padding:16px}.num{font-size:25px;font-weight:800;color:#173f82}.page{background:white;border:1px solid #e1e7ef;border-radius:10px;margin:12px 0;padding:18px}.score{font-weight:800;color:#173f82}.issue{padding:10px;border-left:4px solid #d97706;background:#fff8eb;margin:8px 0}.high{border-left-color:#dc2626;background:#fff1f2}.low{border-left-color:#2563eb;background:#eff6ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}button{background:#2563eb;color:#fff;border:0;border-radius:6px;padding:9px 13px;cursor:pointer}@media(max-width:700px){.cards,.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.cards,.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="hero"><h1>Content Quality Auditor</h1><p class="muted">Student relevance, factual-risk and generic-content review for MBA Portal pages.</p></section><section class="cards"><div class="card"><div class="muted">Pages audited</div><div id="pages" class="num">—</div></div><div class="card"><div class="muted">Pages changed</div><div id="changed" class="num">—</div></div><div class="card"><div class="muted">Average score</div><div id="avg" class="num">—</div></div><div class="card"><div class="muted">Last audit</div><div id="date" class="num" style="font-size:14px">—</div></div></section><div id="results"><p class="muted">Loading audit report…</p></div></main><script>
fetch('content-audit-report.json?x='+Date.now()).then(r=>r.json()).then(data=>{document.getElementById('pages').textContent=data.pages_audited;document.getElementById('changed').textContent=data.pages_changed;let scores=data.results.map(x=>Number(x.overall_score)||0);document.getElementById('avg').textContent=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):'—';document.getElementById('date').textContent=data.generated_at?new Date(data.generated_at).toLocaleString():'—';const root=document.getElementById('results');root.innerHTML=data.results.map(x=>`<article class="page"><div class="grid"><div><h2>${esc(x.file||'Page')}</h2><p class="score">Quality score: ${esc(x.overall_score||0)}/100</p><p>${esc(x.summary||'')}</p><p class="muted">Auto-applied: ${x.auto_applied?'Yes':'No'}</p></div><div><h3>Priority issues</h3>${(x.issues||[]).slice(0,6).map(i=>`<div class="issue ${i.severity||''}"><b>${esc(i.severity||'issue')} · ${esc(i.type||'')}</b><br>${esc(i.text||'')}<br><span class="muted">Recommendation: ${esc(i.recommendation||'')}</span></div>`).join('')||'<p class="muted">No issues recorded.</p>'}</div></div></article>`).join('')}).catch(e=>document.getElementById('results').innerHTML='<div class="page"><b>Audit report not available yet.</b><p class="muted">Run the GitHub Actions content audit once the OpenAI API key is configured.</p></div>');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
